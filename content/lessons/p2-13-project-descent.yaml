id: p2-project-descent
track: ml
unit: 2
order: 13
kind: project
title: 'Project: Adam climbs the hill'
summary: Help Adam the goat find the top of a hill in the fog, one step at a time. It's the idea behind how models learn, and the name of this app.

cards:
  - type: project
    id: hill-climb
    brief: >-
      Adam is on a hillside in thick fog and wants to reach the top. He can't see the summit, but he can feel which way the ground rises under his hooves. So he
      takes one step uphill, feels again, and repeats until every direction is down. That's gradient ascent. Training a model works the same way, only it walks
      downhill on its error, and that version is called gradient descent.


      You'll write the hill, the "which way is up?" test, the climb itself, and a drawing of the hill made with loops inside loops. Then your program tells the
      story of one climb. The starting point `start` is at the top of the code, and the checks will try other starting points.


      Everything you need is from this unit: functions, `return`, `if`, `while` and `for`. There are no lists yet, so the drawing is built up as one string.
    example: |
      ......#......
      ...#######...
      ..#########..
      .###########.
      Adam starts at x = 1, height 15.
      Adam reached the summit in 5 steps.
    starter: |
      start = 1

      # Your functions go here.
    solution: |
      start = 1


      def height(x):
          return 40 - (x - 6) ** 2


      def uphill(x):
          if height(x + 1) > height(x):
              return "right"
          elif height(x - 1) > height(x):
              return "left"
          return "summit"


      def climb(x):
          steps = 0
          while uphill(x) != "summit":
              if uphill(x) == "right":
                  x = x + 1
              else:
                  x = x - 1
              steps = steps + 1
          return steps


      def draw(rows):
          picture = ""
          for i in range(rows):
              if i > 0:
                  picture = picture + "\n"
              level = 40 - 10 * i
              for x in range(13):
                  if height(x) >= level:
                      picture = picture + "#"
                  else:
                      picture = picture + "."
          return picture


      print(draw(4))
      print(f"Adam starts at x = {start}, height {height(start)}.")
      print(f"Adam reached the summit in {climb(start)} steps.")
    milestones:
      - title: The hill
        goal: Write `height(x)`, which gives back how high the hill is at `x`. The formula is `40 - (x - 6) ** 2`.
        tests:
          - { call: height(6), expect: '40' }
          - { call: height(0), expect: '4' }
          - { call: height(10), expect: '24', hidden: true }
        hints:
          - Use `def`, then `return` the formula. Don't print it.
          - "`def height(x):` and on the next line, indented, `return 40 - (x - 6) ** 2`."
      - title: Which way is up?
        goal: >-
          Write `uphill(x)`. It gives back `"right"` if the hill is higher one step to the right, `"left"` if it's higher one step to the left, and `"summit"` if
          neither is higher.
        tests:
          - { call: uphill(2), expect: "'right'" }
          - { call: uphill(9), expect: "'left'" }
          - { call: uphill(6), expect: "'summit'" }
          - { call: uphill(-3), expect: "'right'", hidden: true }
          - { call: uphill(20), expect: "'left'", hidden: true }
        requires: ['if', 'name:height']
        scope: uphill
        hints:
          - Call `height` three times, at `x`, `x + 1` and `x - 1`, and compare.
          - '`if height(x + 1) > height(x): return "right"`, then an `elif` for the left, and `return "summit"` at the end.'
      - title: The climb
        goal: >-
          Write `climb(x)`. Starting at `x`, Adam steps one at a time in whichever direction `uphill` says, until he's at the summit. Give back how many steps
          it took.
        tests:
          - { call: climb(2), expect: '4' }
          - { call: climb(9), expect: '3' }
          - { call: climb(6), expect: '0', hidden: true }
          - { call: climb(-5), expect: '11', hidden: true }
        requires: ['while', 'name:uphill']
        scope: climb
        hints:
          - You don't know how many steps it will take, so this is a `while` loop. Keep going while `uphill(x)` isn't `"summit"`.
          - Count with a variable that starts at 0 and goes up by 1 each step. Move `x` by 1 to the right or the left.
          - 'The loop is `while uphill(x) != "summit":`. Inside it, an `if` moves `x`, then `steps = steps + 1`. Return `steps` after the loop.'
      - title: Draw the hill
        goal: >-
          Write `draw(rows)`, which gives back a picture of the hill as one string. Each row is 13 characters, one for each `x` from 0 to 12. A character is
          `#` if the hill reaches that row's level, and `.` if not. The top row's level is 40, and each row down is 10 lower. Rows are joined with `"\n"`, with
          no newline at the end.
        tests:
          - { call: draw(1), expect: "'......#......'" }
          - { call: draw(2), expect: '''......#......\n...#######...''' }
          - { call: draw(4), expect: '''......#......\n...#######...\n..#########..\n.###########.''', hidden: true }
        requires: ['for']
        scope: draw
        hints:
          - One loop goes over the rows, and inside it another goes over `x` from 0 to 12. The row's level is `40 - 10 * i`.
          - 'Start with `picture = ""` and add one character at a time: `"#"` if `height(x) >= level`, otherwise `"."`.'
          - Add `"\n"` at the start of every row except the first, with `if i > 0:`.
      - title: Tell the story
        goal: Print the 4-row drawing, then where Adam starts, then how many steps he took, like the example. Use `start`, so a new start tells a new story.
        expectOutput: |
          ......#......
          ...#######...
          ..#########..
          .###########.
          Adam starts at x = 1, height 15.
          Adam reached the summit in 5 steps.
        vary: [{ start: '11' }, { start: '6' }, { start: '-2' }]
        hints:
          - '`print(draw(4))` prints the picture. The other two lines are f-strings that call `height(start)` and `climb(start)`.'
