id: u2-names
track: ml
unit: 2
order: 2
title: Names and changes
summary: A variable is a name for an object. Changing an object and renaming it are different things.

cards:
  - type: learn
    id: names
    title: Names point at objects
    body: >-
      A variable isn't a box holding a value. It's a name pointing at an object. `==` asks if two objects have equal
      values; `is` asks if they're the same object. Changing an object shows through every name for it.
    code: |
      a = [1, 2]
      b = a
      c = [1, 2]
      print(a == c, a is c)
      print(a == b, a is b)
      b.append(3)
      print(a)
    subgoals:
      - { line: 2, label: A second name for the same list }
      - { line: 3, label: A different list with equal values }
      - { line: 6, label: Change it through one name }
    predict: What does the last line print?

  - type: choice
    id: is-vs-eq
    kind: predict
    prompt: What does this print?
    code: |
      x = [0, 0]
      y = [0, 0]
      print(x == y, x is y)
    choices: ['True False', 'True True', 'False False', 'False True']
    answer: 'True False'
    why: >-
      Their values are equal, so `==` is True. They're two separate lists, so `is` is False. `is` and `==` are not the same
      question.

  - type: learn
    id: mutate-reassign
    title: Changing vs reassigning
    body: >-
      `nums.append(4)` changes the object, so every name sees it. `nums = [9]` only points this one name at a new
      object. Inside a function, a parameter is a new name for the caller's object. Assignment in a function makes a local name.
    code: |
      def change(items):
          items.append(4)

      def rename(items):
          items = [9]

      nums = [1]
      change(nums)
      rename(nums)
      print(nums)
    subgoals:
      - { line: 2, label: Changes the caller's list }
      - { line: 5, label: Only moves the local name }
    predict: What's in `nums` at the end?

  - type: choice
    id: rename-param
    kind: predict
    prompt: What does this print?
    code: |
      def reset(values):
          values = []

      data = [1, 2, 3]
      reset(data)
      print(data)
    choices: ['[1, 2, 3]', '[]', 'None', 'Error']
    answer: '[1, 2, 3]'
    why: >-
      `values = []` points the local name at a new list. It doesn't touch the caller's `data`. To empty the caller's list
      you'd need to change the object, like `values.clear()`.
    variants:
      - code: |
          def reset(values):
              values.clear()

          data = [1, 2, 3]
          reset(data)
          print(data)
        choices: ['[]', '[1, 2, 3]', 'None', 'Error']
        answer: '[]'
        why: '`.clear()` changes the object itself, and `data` names that same object.'
      - code: |
          def grow(values):
              values = values + [4]

          data = [1, 2]
          grow(data)
          print(data)
        choices: ['[1, 2]', '[1, 2, 4]', '[4]', 'None']
        answer: '[1, 2]'
        why: '`values + [4]` builds a new list, and only the local name points at it. `.append` would have changed `data`.'

  - type: choice
    id: sort-none
    kind: predict
    prompt: What does this print?
    code: |
      nums = [3, 1, 2]
      nums = nums.sort()
      print(nums)
    choices: ['None', '[1, 2, 3]', '[3, 1, 2]', 'Error']
    answer: 'None'
    why: >-
      `.sort()` changes the list and returns `None`, so this assignment throws the list away. Use `nums.sort()` alone, or
      `nums = sorted(nums)`.

  - type: choice
    id: scope
    kind: predict
    prompt: What does this print?
    code: |
      total = 10

      def add():
          total = 20

      add()
      print(total)
    choices: ['10', '20', '30', 'Error']
    answer: '10'
    why: >-
      Assigning inside a function makes a new local name, so the global `total` is untouched. Returning a value is
      usually better than changing a global.

  - type: parsons
    id: double-in-place
    prompt: Order the lines so `double_all` changes the caller's list in place.
    code: |
      def double_all(items):
          for i in range(len(items)):
              items[i] = items[i] * 2
    distractors: ['    items = items * 2']
    tests:
      - { call: '(lambda a: (double_all(a), a)[1])([1, 2])', expect: '[2, 4]' }
    why: >-
      Assigning to `items[i]` changes the object. `items = items * 2` would only make a new local list.

  - type: fix
    id: lost-list
    prompt: '`sorted_copy` should return a sorted list, but returns `None`. Fix it without changing the input.'
    code: |
      def sorted_copy(items):
          return items.sort()
    solution: |
      def sorted_copy(items):
          return sorted(items)
    tests:
      - { call: 'sorted_copy([2, 1])', expect: '[1, 2]' }
      - { call: '(lambda a: (sorted_copy(a), a)[1])([2, 1])', expect: '[2, 1]', hidden: true }
    why: >-
      `.sort()` changes the list and returns `None`. `sorted()` leaves the input alone and returns a new list.
    hints:
      - Which one returns a new list, `.sort()` or `sorted()`?

  - type: write
    id: add-score
    prompt: >-
      Write `with_item(items, x)`, which returns a new list with `x` on the end and leaves `items` unchanged.
    starter: |
      def with_item(items, x):
          pass
    solution: |
      def with_item(items, x):
          return items + [x]
    tests:
      - { call: 'with_item([1], 2)', expect: '[1, 2]' }
      - { call: 'with_item([], "a")', expect: "['a']" }
      - { call: '(lambda a: (with_item(a, 9), a)[1])([1])', expect: '[1]', hidden: true }
    hints:
      - '`+` makes a new list. `.append` changes the old one.'

  - type: explain
    id: why-same
    prompt: Why does this print `[1, 2]` and not `[1]`?
    code: |
      def f(a):
          a.append(2)

      x = [1]
      f(x)
      print(x)
    model: >-
      `a` is another name for the same list as `x`, so appending through `a` changes the one list both names point at.
    keyPoints:
      - The parameter names the caller's object
      - '`append` changes the object'
