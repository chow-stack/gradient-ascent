id: p4-first-net
track: ml
unit: 4
order: 1
title: A first look at a neural net
summary: See where all this is going before learning the Python behind it.

cards:
  - type: learn
    id: goal
    label: The goal
    title: Why you've been learning this
    body: >-
      You now know enough Python to read most programs. This unit teaches the parts that machine learning code relies on most, like classes that act like functions. Before that, it's worth seeing what all this code is for.
    points:
      - 'Train a real neural network in your browser'
      - 'Learn what one neuron calculates'
      - 'See why a network needs more than one'

  - type: learn
    id: neuron
    title: One neuron is a weighted sum
    body: >-
      A neuron is much simpler than it sounds. It multiplies each input by a number called a weight, adds up the results, and adds one more number called the bias. There's nothing else in it.


      A weight says how much an input matters. A large weight means the input counts for a lot, a weight near 0 means it's nearly ignored, and a negative weight means it pushes the answer down. The bias shifts the answer up or down whatever the inputs are.


      Training means nudging those numbers until the outputs are good. It's the same idea as your Find the bottom project, with many numbers in place of one. Every model in this course, including GPT, is built from this calculation and a lot of repetition.
    code: |
      def neuron(x1, x2, w1, w2, bias):
          return w1 * x1 + w2 * x2 + bias

      print(neuron(2, 3, 0.5, -1, 1))
    subgoals:
      - { line: 2, label: 'Weighted sum plus a bias' }
      - { line: 4, label: 'Inputs 2 and 3, weights 0.5 and -1, bias 1' }
    predict: What will it show?

  - type: choice
    id: compute-neuron
    kind: predict
    prompt: What does this print?
    code: |
      def neuron(x1, x2, w1, w2, bias):
          return w1 * x1 + w2 * x2 + bias

      print(neuron(4, 1, 0.5, 2, -1))
    choices: ['3.0', '4.0', '2.5', '5.0']
    answer: '3.0'
    why: >-
      0.5 × 4 + 2 × 1 − 1 = 2 + 2 − 1 = 3.0. Don't forget the bias.
    variants:
      - code: |
          def neuron(x1, x2, w1, w2, bias):
              return w1 * x1 + w2 * x2 + bias

          print(neuron(2, 5, 1, 0.5, 3))
        choices: ['7.5', '4.5', '6.5', '8.5']
        answer: '7.5'
        why: >-
          1 × 2 + 0.5 × 5 + 3 = 2 + 2.5 + 3 = 7.5.
      - code: |
          def neuron(x1, x2, w1, w2, bias):
              return w1 * x1 + w2 * x2 + bias

          print(neuron(3, 2, -1, 2.5, 0))
        choices: ['2.0', '8.0', '-2.0', '3.5']
        answer: '2.0'
        why: >-
          −1 × 3 + 2.5 × 2 + 0 = −3 + 5 = 2.0.

  - type: choice
    id: predict-line
    prompt: >-
      One neuron can only separate things with one straight line. Can it separate blue dots from an orange ring around them?
    choices:
      - 'No: one straight line can’t put a ring on one side and its middle on the other'
      - 'Yes: with enough training it can draw any shape'
      - 'Yes: as long as the learning rate is small'
    answer: 'No: one straight line can’t put a ring on one side and its middle on the other'
    why: >-
      More training doesn't help, because the model can only ever draw a line. Its limit is its shape, not its effort.

  - type: learn
    id: try-it
    title: Try it for two minutes
    body: >-
      TensorFlow Playground trains a small network while you watch. Each circle in the middle is a neuron, and each column of them is a layer. The layers between the inputs and the output are called hidden layers. Orange and blue show what the network thinks at each point.


      Loss is how wrong the model is, and lower is better. Training loss is measured on the data it learns from, and test loss on data it never trains on.


      Open the playground and choose the circle dataset, the one with a ring. Remove every hidden layer and press play. Watch the test loss get stuck. Then add one hidden layer with 4 neurons and press play again. Finally, set the learning rate to 10, and see what happens.
    link: { label: Open TensorFlow Playground, url: 'https://playground.tensorflow.org/' }

  - type: choice
    id: hidden-layer
    prompt: Why can one hidden layer solve what no hidden layers couldn't?
    choices:
      - Each neuron draws a line, and the next layer combines those lines into a curved boundary
      - It gets more time to train
      - Hidden layers memorise where each dot is
    answer: Each neuron draws a line, and the next layer combines those lines into a curved boundary
    why: >-
      The extra neurons don't try harder. They give the model more shapes to build with.

  - type: choice
    id: learning-rate
    prompt: In the playground, you raise the learning rate to 10 and the loss jumps around and doesn't fall. Why?
    choices:
      - Each step is so big that it overshoots the low point
      - A higher learning rate always trains better, so this must be a bug
      - The dataset changed
    answer: Each step is so big that it overshoots the low point
    why: >-
      You saw this in the Find the bottom project. The learning rate sets the step size. Too small is slow, and too big jumps past the bottom.

  - type: choice
    id: test-loss
    prompt: Training loss is 0.01, but test loss is 0.30 and rising. What's most likely happening?
    choices:
      - It's learning the noise in the training data, which is called overfitting
      - It's a great model, because training loss is what counts
      - It needs a bigger learning rate
    answer: It's learning the noise in the training data, which is called overfitting
    why: >-
      Low training loss alone says little. A model is only as good as how it does on data it hasn't seen.

  - type: explain
    id: why-hidden
    prompt: In your own words, why does training one neuron for longer not help on the circle data?
    code: |
      def neuron(x1, x2, w1, w2, bias):
          return w1 * x1 + w2 * x2 + bias
    model: >-
      One neuron can only draw a straight line, however long it trains. A ring needs a curved boundary, which takes more neurons combined in layers.
    keyPoints:
      - One neuron gives one straight line
      - The limit is the model's shape, not the training time

  - type: learn
    id: worked
    label: Worked example
    title: A layer of neurons
    body: >-
      A layer is just several neurons looking at the same inputs. Each one has its own weights and bias, so each one notices something different. The outputs of one layer become the inputs of the next.


      Written with what you know, it's a loop. Each neuron here is described by a list holding two weights and a bias. It works, but it's clumsy: the positions `n[0]` and `n[2]` tell you nothing, and the weights and the calculation are kept apart.


      That clumsiness is what this unit fixes. By the end, a neuron will be an object that holds its own weights, and you'll call it with `neuron(x)`, the same way PyTorch does.
    code: |
      def neuron(x1, x2, w1, w2, bias):
          return w1 * x1 + w2 * x2 + bias

      layer = [[0.5, -1, 1], [2, 0, -1]]
      inputs = [2, 3]

      outputs = []
      for n in layer:
          outputs.append(neuron(inputs[0], inputs[1], n[0], n[1], n[2]))
      print(outputs)
    subgoals:
      - { line: 4, label: 'Two neurons, each with weights and a bias' }
      - { line: 8, label: 'Each neuron sees the same inputs' }
      - { line: 10, label: 'One output for each neuron' }
    predict: How many numbers will be in `outputs`?

  - type: write
    id: write-layer
    prompt: Write `layer_output(layer, x1, x2)`. `layer` is a list like `[[w1, w2, bias], ...]`. It gives back a list with each neuron's output for the inputs `x1` and `x2`.
    starter: |
      def layer_output(layer, x1, x2):
          # Your code here
    solution: |
      def layer_output(layer, x1, x2):
          out = []
          for n in layer:
              out.append(n[0] * x1 + n[1] * x2 + n[2])
          return out
    tests:
      - { call: 'layer_output([[1, 1, 0]], 2, 3)', expect: '[5]' }
      - { call: 'layer_output([[1, 0, 1], [0, 2, 0]], 2, 3)', expect: '[3, 6]' }
      - { call: 'layer_output([], 2, 3)', expect: '[]' }
    why: >-
      It's the transform pattern from Unit 3, applied to neurons.
    hints:
      - Go through the neurons, and append each output to a new list.

  - type: learn
    id: recap
    label: Recap
    title: What you know now
    body: >-
      Next: tidier ways of holding data together, starting with tuples.
    points:
      - 'A neuron is a weighted sum plus a bias'
      - 'Training nudges those numbers'
      - 'One neuron draws one straight line. Layers combine lines into curves'
      - 'Loss measures how wrong a model is. Test loss is the one to trust'
