id: p6-checkpoint
track: ml
unit: 6
order: 8
kind: checkpoint
title: Calculus checkpoint
summary: Derivatives, gradients and gradient descent, in code. Get 80% right to move on.

cards:
  - type: choice
    id: power
    prompt: What's the derivative of `4 * x ** 3`?
    choices: ['`12 * x ** 2`', '`4 * x ** 2`', '`12 * x ** 3`', '`3 * x ** 2`']
    answer: '`12 * x ** 2`'
    why: >-
      Bring the 3 down, multiply it by the 4, and drop the power by one.
    misses:
      '`4 * x ** 2`': 'Bring the 3 down and multiply it by the 4.'
      '`12 * x ** 3`': 'The power drops by one, to 2.'
      '`3 * x ** 2`': "That's the derivative of `x ** 3`. The 4 in front stays as a multiplier."
    variants:
      - prompt: What's the derivative of `x ** 2 + 6 * x + 9`?
        choices: ['`2 * x + 6`', '`2 * x + 6 * x`', '`2 * x + 15`', '`x + 6`']
        answer: '`2 * x + 6`'
        why: 'Take each part on its own: `x ** 2` gives `2 * x`, `6 * x` gives 6, and the constant 9 gives 0.'
        misses:
          {
            '`2 * x + 6 * x`': 'The slope of `6 * x` is just 6: the power of `x` drops from 1 to 0.',
            '`2 * x + 15`': A constant has no slope. The 9 adds nothing to the derivative.,
            '`x + 6`': 'Bring the power down: `x ** 2` gives `2 * x`.',
          }
      - prompt: What's the derivative of `5 * np.log(x)`?
        choices: ['`5 / x`', '`1 / x`', '`5 * np.log(x) / x`', '`np.log(5)`']
        answer: '`5 / x`'
        why: The slope of `np.log(x)` is `1 / x`, and a number in front stays as a multiplier.
        misses:
          {
            '`1 / x`': The 5 in front scales the slope too.,
            '`5 * np.log(x) / x`': 'The log itself disappears: its slope is `1 / x`.',
            '`np.log(5)`': 'The slope of `log` depends on `x`: it is `1 / x`.',
          }

  - type: choice
    id: chain
    prompt: What's the derivative of `np.exp(5 * x)`?
    choices: ['`5 * np.exp(5 * x)`', '`np.exp(5 * x)`', '`np.exp(5)`', '`5 * x * np.exp(5 * x - 1)`']
    answer: '`5 * np.exp(5 * x)`'
    why: >-
      The outside, `exp`, is its own derivative at the inside's value, times the inside's slope, 5.
    misses:
      '`np.exp(5 * x)`': "You left out the inside's slope, 5."
      '`np.exp(5)`': "The outside's slope is worked out at the inside's value, `5 * x`."
      '`5 * x * np.exp(5 * x - 1)`': "The power rule doesn't apply to `exp`. It's its own derivative."
    variants:
      - prompt: What's the derivative of `(3 * x - 2) ** 2`?
        choices: ['`6 * (3 * x - 2)`', '`2 * (3 * x - 2)`', '`2 * (3 * x - 2) + 3`', '`6 * x`']
        answer: '`6 * (3 * x - 2)`'
        why: The outside, squaring, gives `2 * u` at `u = 3 * x - 2`. Times the inside's slope, 3, that is `6 * (3 * x - 2)`.
        misses:
          {
            '`2 * (3 * x - 2)`': "You left out the inside's slope, 3.",
            '`2 * (3 * x - 2) + 3`': The chain rule multiplies the slopes. It never adds them.,
            '`6 * x`': "The outside's slope is worked out at the inside's value, `3 * x - 2`, not at `x`.",
          }
      - prompt: What's the derivative of `np.log(x ** 2 + 1)`?
        choices: ['`2 * x / (x ** 2 + 1)`', '`1 / (x ** 2 + 1)`', '`2 * x / x`', '`1 / (2 * x)`']
        answer: '`2 * x / (x ** 2 + 1)`'
        why: The outside, `log`, gives `1 / u` at `u = x ** 2 + 1`. Times the inside's slope, `2 * x`.
        misses:
          {
            '`1 / (x ** 2 + 1)`': "Multiply by the inside's slope, `2 * x`.",
            '`2 * x / x`': "`log`'s slope is `1 / u`, worked out at the inside's value, not at `x`.",
            '`1 / (2 * x)`': "The outside's slope goes at the inside's value, and then you multiply by the inside's slope.",
          }

  - type: choice
    id: chain-trace
    kind: predict
    prompt: What does this print?
    code: |
      def df(x):
          u = 2 * x + 1
          return 2 * u * 2

      print(df(1))
    choices: ['12', '6', '3', '9']
    answer: '12'
    why: >-
      At 1 the inside is 3. The outside's slope is `2 * 3`, times the inside's slope, 2.
    misses:
      '6': "That's the outside's slope, `2 * 3`, without the inside's 2."
      '3': "That's the inside's value. The slope is `2 * 3 * 2`."
      '9': "That's `u ** 2`, the value, not the slope."
    variants:
      - code: |
          import math

          def df(x):
              u = 3 * x
              return math.exp(u) * 3

          print(round(df(0), 2))
        choices: ['3.0', '1.0', '0.0', '9.0']
        answer: '3.0'
        why: At 0 the inside is 0, and `exp(0)` is 1. Times the inside's slope, 3, that is 3.
        misses:
          {
            '1.0': That is the outside's slope alone. Multiply by the inside's 3.,
            '0.0': '`exp(0)` is 1, not 0.',
            '9.0': "The 3 appears once, as the inside's slope.",
          }
      - code: |
          def f(x):
              return (x ** 2) ** 2

          def df(x):
              u = x ** 2
              return 2 * u * 2 * x

          print(df(2), 4 * 2 ** 3)
        choices: [32 32, 16 32, 8 32, 32 16]
        answer: 32 32
        why: At 2 the inside is 4. `2 * 4` times `2 * 2` is 32, and that agrees with the power rule on `x ** 4`, `4 * x ** 3`.
        misses:
          {
            16 32: "The inside's slope is `2 * x`, which is 4 at `x = 2`, not 2.",
            8 32: "Multiply the outside's slope, `2 * u` = 8, by the inside's slope, 4.",
            32 16: '`4 * 2 ** 3` is 4 times 8.',
          }

  - type: choice
    id: partial
    prompt: For `f(w, b) = w ** 2 * b`, what's the gradient `[df/dw, df/db]`?
    choices: ['`[2 * w * b, w ** 2]`', '`[2 * w, 1]`', '`[2 * w * b, 2 * w]`', '`[w ** 2, 2 * w * b]`']
    answer: '`[2 * w * b, w ** 2]`'
    why: >-
      Hold `b` fixed: `w ** 2` gives `2 * w`, times `b`. Hold `w` fixed: `w ** 2` is a constant times `b`.
    misses:
      '`[2 * w, 1]`': 'Hold the other input fixed, but keep it as a multiplier: `w ** 2 * b` gives `2 * w * b`.'
      '`[2 * w * b, 2 * w]`': 'With `w` fixed, `w ** 2` is a constant, so the partial for `b` is `w ** 2`.'
      '`[w ** 2, 2 * w * b]`': 'Swapped: the first entry is the partial for `w`.'
    variants:
      - prompt: For `f(w, b) = (w + 2 * b) ** 2`, what's the gradient `[df/dw, df/db]`?
        choices:
          [
            '`[2 * (w + 2 * b), 4 * (w + 2 * b)]`',
            '`[2 * (w + 2 * b), 2 * (w + 2 * b)]`',
            '`[2 * w, 4 * b]`',
            '`[1, 2]`',
          ]
        answer: '`[2 * (w + 2 * b), 4 * (w + 2 * b)]`'
        why: Both use the chain rule with the inside `w + 2 * b`. Its slope is 1 for `w` and 2 for `b`.
        misses:
          {
            '`[2 * (w + 2 * b), 2 * (w + 2 * b)]`': "For `b`, the inside's slope is 2, so the partial is doubled.",
            '`[2 * w, 4 * b]`': 'The square is of the whole sum, so the other input stays inside.',
            '`[1, 2]`': "Those are the inside's slopes. Multiply each by the outside's slope, `2 * (w + 2 * b)`.",
          }
      - prompt: For `f(a, b) = a * b + b`, what's the gradient at `a = 3, b = 2`?
        choices: ['`[2, 4]`', '`[2, 3]`', '`[3, 2]`', '`[2, 5]`']
        answer: '`[2, 4]`'
        why: 'For `a`, hold `b` fixed: the slope is `b`, 2. For `b`, hold `a` fixed: `a + 1`, which is 4.'
        misses:
          {
            '`[2, 3]`': 'The `+ b` adds 1 to the partial for `b`: it is `a + 1`.',
            '`[3, 2]`': 'Swapped: the partial for `a` is `b`, and the one for `b` is `a + 1`.',
            '`[2, 5]`': The partial for `b` is `a + 1` = 4. The value of `b` does not appear in it.,
          }

  - type: choice
    id: direction
    kind: concept
    prompt: The gradient of the loss at the current weights is `[3, -1]`. Which step makes the loss smaller?
    choices:
      [
        '`w = w - 0.1 * np.array([3, -1])`',
        '`w = w + 0.1 * np.array([3, -1])`',
        '`w = w - 0.1 * np.array([-3, 1])`',
        '`w = w * 0.1`',
      ]
    answer: '`w = w - 0.1 * np.array([3, -1])`'
    why: >-
      The gradient points uphill, so subtract it to go down.
    misses:
      '`w = w + 0.1 * np.array([3, -1])`': 'Adding the gradient steps uphill. The loss grows.'
      '`w = w - 0.1 * np.array([-3, 1])`': 'That flips the sign twice, so it also steps uphill.'
      '`w = w * 0.1`': 'That shrinks the weights toward 0 and ignores the gradient.'
    variants:
      - prompt: '`w` is `[1.0, 1.0]` and the gradient there is `[0.0, 2.0]`. After one step with `lr = 0.5`, what is `w`?'
        choices: ['`[1.0, 0.0]`', '`[1.0, 2.0]`', '`[0.0, 0.0]`', '`[0.5, 0.0]`']
        answer: '`[1.0, 0.0]`'
        why: Each weight moves by `lr` times its own partial, against it. The first partial is 0, so the first weight stays.
        misses:
          {
            '`[1.0, 2.0]`': Gradient descent subtracts the gradient. Adding steps uphill.,
            '`[0.0, 0.0]`': A partial of 0 means that weight does not move.,
            '`[0.5, 0.0]`': 'The step for each weight is `lr` times its partial, and the first partial is 0.',
          }
      - prompt: At the current `w`, the slope of the loss is `0.0`. What does that tell you?
        choices:
          [
            'A step would not move `w`: it is at a flat point, often the bottom',
            The loss is 0,
            The learning rate is too small,
            The gradient has a bug,
          ]
        answer: 'A step would not move `w`: it is at a flat point, often the bottom'
        why: A slope of 0 means flat ground. In a valley that is the bottom, and `w - lr * 0` leaves `w` where it is.
        misses:
          {
            The loss is 0: 'The slope can be 0 where the loss is large: a flat bottom can sit at any height.',
            The learning rate is too small: 'The step is `lr * slope`, so with a slope of 0 any rate gives no step.',
            The gradient has a bug: A slope of 0 is what you expect at the bottom of a valley.,
          }

  - type: choice
    id: descent-trace
    kind: predict
    prompt: What does this print?
    code: |
      def grad(w):
          return 2 * (w - 5)

      w = 1.0
      w = w - 0.25 * grad(w)
      print(w)
    choices: ['3.0', '5.0', '-1.0', '2.0']
    answer: '3.0'
    why: >-
      The slope at 1 is -8, and a quarter of it, subtracted, adds 2.
    misses:
      '5.0': 'One step only goes part of the way: a quarter of the slope, 2.'
      '-1.0': 'Subtracting a negative slope moves `w` up, not down.'
      '2.0': "The step is 2, but it's added to where `w` started, 1."
    variants:
      - code: |
          def grad(w):
              return 2 * (w + 1)

          w = 3.0
          for _ in range(2):
              w = w - 0.5 * grad(w)
          print(w)
        choices: ['-1.0', '1.0', '-5.0', '3.0']
        answer: '-1.0'
        why: At 3 the slope is 8, and half of it, subtracted, lands on -1. There the slope is 0, so the second step stays.
        misses:
          {
            '1.0': 'Half of the slope at 3 is 4, so the first step goes from 3 to -1.',
            '-5.0': 'At -1 the slope is 0, so the second step does not move `w`.',
            '3.0': 'The slope at 3 is not 0, so the first step moves `w`.',
          }
      - code: |
          def grad(w):
              return 2 * w

          w = 1.0
          for _ in range(3):
              w = w - 1.5 * grad(w)
          print(w)
        choices: ['-8.0', '0.0', '-2.0', '8.0']
        answer: '-8.0'
        why: 'Each step does `w - 3 * w`, which is `-2 * w`. So `w` goes 1, -2, 4, -8: the rate is too big and it diverges.'
        misses:
          {
            '0.0': 'With this rate, each step overshoots the bottom and lands further away.',
            '-2.0': That is after one step. There are three.,
            '8.0': 'Each step flips the sign: 1, -2, 4, -8.',
          }

  - type: choice
    id: rate
    kind: concept
    prompt: 'You try four learning rates. The final losses are: 0.001 gives 4.1, 0.01 gives 0.9, 0.1 gives 0.02, and 1.0 gives `inf`. Which should you use?'
    choices: ['0.1', '1.0', '0.001', '0.01']
    answer: '0.1'
    why: >-
      It got the lowest loss. 1.0 diverged, and the smaller rates were still creeping.
    misses:
      '1.0': '`inf` means it diverged. That rate is too big.'
      '0.001': 'It has the highest loss. It was still creeping.'
      '0.01': 'Better than 0.001, but 0.1 got lower still without diverging.'
    variants:
      - prompt: Your loss goes 5.0, 9.0, 30.0, 400.0 over the first steps. What should you change?
        choices:
          [
            Make the learning rate smaller,
            Make the learning rate bigger,
            Train for more steps,
            'Nothing, it will settle',
          ]
        answer: Make the learning rate smaller
        why: 'A loss that grows faster and faster is diverging: each step overshoots the bottom by more.'
        misses:
          {
            Make the learning rate bigger: Bigger steps overshoot even further.,
            Train for more steps: More steps of a diverging run only make the loss bigger.,
            'Nothing, it will settle': 'A loss growing each step means the steps are too big, and it will not recover.',
          }
      - prompt: With `lr = 0.0001`, the loss goes 5.00, 4.99, 4.98, 4.97 over 1,000 steps. What's most likely?
        choices:
          [
            The learning rate is too small,
            The model has finished learning,
            The gradient is wrong,
            The learning rate is too big,
          ]
        answer: The learning rate is too small
        why: The loss is falling steadily, just very slowly. Bigger steps would get there in far fewer of them.
        misses:
          {
            The model has finished learning: 'Finished looks flat. This is still falling, only slowly.',
            The gradient is wrong: A steadily falling loss suggests the direction is right. The steps are just tiny.,
            The learning rate is too big: 'Too big makes the loss jump or grow, not creep down.',
          }

  - type: choice
    id: mse
    kind: predict
    prompt: What does this print?
    code: |
      import numpy as np

      x = np.array([1.0, 2.0, 3.0])
      y = np.array([2.0, 2.0, 2.0])
      print(np.mean((1.0 * x + 0.0 - y) ** 2))
    choices: ['0.6666666666666666', '2.0', '0.0', '1.0']
    answer: '0.6666666666666666'
    why: >-
      The errors are -1, 0 and 1. Squared, 1, 0 and 1, and the mean is 2 / 3.
    misses:
      '2.0': '2 is the sum of the squared errors. There are three points, so divide by 3.'
      '0.0': 'Squaring stops the -1 and 1 from cancelling.'
      '1.0': 'The squared errors are 1, 0 and 1. The 0 counts too: 2 / 3.'
    variants:
      - code: |
          import numpy as np

          x = np.array([0.0, 1.0, 2.0])
          y = np.array([1.0, 1.0, 1.0])
          w, b = 0.0, 1.0
          print(np.mean(2 * (w * x + b - y)))
        choices: ['0.0', '1.0', '2.0', '3.0']
        answer: '0.0'
        why: The line is flat at 1, and every `y` is 1, so every error is 0. With no error, the slope for `b` is 0.
        misses:
          {
            '1.0': '`w * x + b` is 1 for every `x`, which matches every `y`, so the errors are all 0.',
            '2.0': 'The 2 multiplies the errors, and they are all 0.',
            '3.0': This is a mean of errors that are all 0.,
          }
      - code: |
          import numpy as np

          x = np.array([1.0, 2.0])
          y = np.array([1.0, 1.0])
          pred = 2.0 * x
          print(np.mean((pred - y) ** 2), np.mean(2 * (pred - y) * x))
        choices: [5.0 7.0, 2.0 7.0, 5.0 4.0, 10.0 14.0]
        answer: 5.0 7.0
        why: 'The errors are 1 and 3, so the mean square is (1 + 9) / 2 = 5. The slope for `w` is the mean of `2 * err * x`: (2 + 12) / 2 = 7.'
        misses:
          {
            2.0 7.0: 'Square each error before taking the mean: 1 and 9.',
            5.0 4.0: '`dw` multiplies each error by its own `x`: `2 * 1 * 1` and `2 * 3 * 2`.',
            10.0 14.0: Those are sums. The mean divides by the 2 points.,
          }

  - type: choice
    id: check
    kind: concept
    prompt: A gradient check gives a relative error of `0.5` for one weight. What do you know?
    choices: ['That partial has a bug', 'Everything is fine', '`h` should be bigger', 'The loss will not fall']
    answer: 'That partial has a bug'
    why: >-
      Anything above about `1e-3` means the formula doesn't match the nudges. The loss might still fall, which is why you check.
    misses:
      'Everything is fine': 'Anything above about `1e-3` means the formula disagrees with the nudge.'
      '`h` should be bigger': 'A bad `h` gives small errors on every weight. 0.5 on one means its formula is wrong.'
      'The loss will not fall': "A wrong gradient can still lower the loss. That's why you check."
    variants:
      - prompt: Your loss falls nicely during training. Does that show the gradient is right?
        choices:
          [
            'No: a slightly wrong gradient can still lower the loss',
            'Yes: a wrong gradient would make the loss grow',
            'Yes, if it falls every single step',
            'No: the loss only falls when the gradient is 0',
          ]
        answer: 'No: a slightly wrong gradient can still lower the loss'
        why: A gradient that is off by a factor, or missing a term, often still points roughly downhill. Only a gradient check catches it.
        misses:
          {
            'Yes: a wrong gradient would make the loss grow': 'Many wrong gradients still point downhill enough to lower the loss, just to the wrong place or slowly.',
            'Yes, if it falls every single step': A gradient missing a `* 2` falls every step too.,
            'No: the loss only falls when the gradient is 0': A gradient of 0 means no step at all.,
          }
      - prompt: Where should you run a gradient check?
        choices:
          [
            At ordinary random weights,
            'At the bottom, where the loss is smallest',
            At weights of exactly 0,
            Only after training has finished,
          ]
        answer: At ordinary random weights
        why: At the bottom every partial is 0, so a buggy formula can agree with the nudges there. Random weights give every term a chance to show.
        misses:
          {
            'At the bottom, where the loss is smallest': 'Both the formula and the nudge are near 0 there, so they agree even if the formula is wrong.',
            At weights of exactly 0: 'Zeros can make whole terms vanish, like the `* w` in a partial, hiding bugs.',
            Only after training has finished: The point is to catch a bug before you trust a training run.,
          }

  - type: fix
    id: fix-grad
    prompt: '`gradients(w, b, x, y)` should return the gradient of the MSE of `w * x + b` as `(dw, db)`. Fix it.'
    code: |
      import numpy as np

      def gradients(w, b, x, y):
          err = w * x + b - y
          dw = np.mean(2 * err)
          db = np.mean(2 * err)
          return dw, db
    solution: |
      import numpy as np

      def gradients(w, b, x, y):
          err = w * x + b - y
          dw = np.mean(2 * err * x)
          db = np.mean(2 * err)
          return dw, db
    tests:
      - {
          call: 'gradients(0.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
          expect: '(-17.0, -8.0)',
        }
      - {
          call: 'gradients(3.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
          expect: '(4.0, 1.0)',
          hidden: true,
        }
      - { call: 'gradients(1.0, 1.0, np.array([1.0, 2.0]), np.array([2.0, 2.0]))', expect: '(2.0, 1.0)', hidden: true }
    why: >-
      Changing `w` moves each prediction by its `x`, so `dw` needs the `* x`.
    variants:
      - prompt: '`gradients(w, b, x, y)` should return the gradient of the MSE of `w * x + b` as `(dw, db)`. The loss goes up instead of down. Fix it.'
        code: |
          import numpy as np

          def gradients(w, b, x, y):
              err = y - (w * x + b)
              dw = np.mean(2 * err * x)
              db = np.mean(2 * err)
              return dw, db
        solution: |
          import numpy as np

          def gradients(w, b, x, y):
              err = (w * x + b) - y
              dw = np.mean(2 * err * x)
              db = np.mean(2 * err)
              return dw, db
        highlightLine: 4
        why: The error has to be prediction minus truth. `y - pred` flips the sign of both partials, so every step goes uphill.
      - prompt: '`gradients(w, b, x, y)` should return the gradient of the MSE of `w * x + b` as `(dw, db)`. Its values are too big. Fix it.'
        code: |
          import numpy as np

          def gradients(w, b, x, y):
              err = w * x + b - y
              dw = np.sum(2 * err * x)
              db = np.sum(2 * err)
              return dw, db
        solution: |
          import numpy as np

          def gradients(w, b, x, y):
              err = w * x + b - y
              dw = np.mean(2 * err * x)
              db = np.mean(2 * err)
              return dw, db
        highlightLine: 5
        why: The loss is a mean, so its partials are means too. A sum makes them grow with the number of points.

  - type: write
    id: write-df
    prompt: >-
      Write `df(x)`, the derivative of `(x ** 2 - 1) ** 3`. So `df(2.0)` is `108.0`.
    starter: |
      def df(x):
          # Your code here
    solution: |
      def df(x):
          return 3 * (x ** 2 - 1) ** 2 * 2 * x
    tests:
      - { call: 'df(2.0)', expect: '108.0' }
      - { call: 'df(0.0)', expect: '0.0' }
      - { call: 'df(1.0)', expect: '0.0', hidden: true }
      - { call: 'df(-2.0)', expect: '-108.0', hidden: true }
      - { call: 'df(0.5)', expect: '1.6875', hidden: true }
    why: >-
      The outside gives `3 * u ** 2` at `u = x ** 2 - 1`, times the inside's slope, `2 * x`.
    variants:
      - prompt: Write `df(x)`, the derivative of `np.exp(x ** 2)`. So `df(1.0)` is about `5.4366`.
        starter: |
          import numpy as np

          def df(x):
              # Your code here
        solution: |
          import numpy as np

          def df(x):
              return np.exp(x ** 2) * 2 * x
        tests:
          - { call: 'round(df(1.0), 4)', expect: '5.4366' }
          - { call: df(0.0), expect: '0.0' }
          - { call: 'round(df(-1.0), 4)', expect: '-5.4366', hidden: true }
