id: p6-checkpoint
track: ml
unit: 6
order: 8
kind: checkpoint
title: Calculus checkpoint
summary: Derivatives, gradients and gradient descent, in code. Get 80% right to move on.

cards:
  - type: choice
    id: power
    prompt: What's the derivative of `4 * x ** 3`?
    choices: ['`12 * x ** 2`', '`4 * x ** 2`', '`12 * x ** 3`', '`3 * x ** 2`']
    answer: '`12 * x ** 2`'
    why: >-
      Bring the 3 down, multiply it by the 4, and drop the power by one.

  - type: choice
    id: chain
    prompt: What's the derivative of `np.exp(5 * x)`?
    choices: ['`5 * np.exp(5 * x)`', '`np.exp(5 * x)`', '`np.exp(5)`', '`5 * x * np.exp(5 * x - 1)`']
    answer: '`5 * np.exp(5 * x)`'
    why: >-
      The outside, `exp`, is its own derivative at the inside's value, times the inside's slope, 5.

  - type: choice
    id: chain-trace
    kind: predict
    prompt: What does this print?
    code: |
      def df(x):
          u = 2 * x + 1
          return 2 * u * 2

      print(df(1))
    choices: ['12', '6', '3', '9']
    answer: '12'
    why: >-
      At 1 the inside is 3. The outside's slope is `2 * 3`, times the inside's slope, 2.

  - type: choice
    id: partial
    prompt: For `f(w, b) = w ** 2 * b`, what's the gradient `[df/dw, df/db]`?
    choices: ['`[2 * w * b, w ** 2]`', '`[2 * w, 1]`', '`[2 * w * b, 2 * w]`', '`[w ** 2, 2 * w * b]`']
    answer: '`[2 * w * b, w ** 2]`'
    why: >-
      Hold `b` fixed: `w ** 2` gives `2 * w`, times `b`. Hold `w` fixed: `w ** 2` is a constant times `b`.

  - type: choice
    id: direction
    kind: concept
    prompt: The gradient of the loss at the current weights is `[3, -1]`. Which step makes the loss smaller?
    choices:
      [
        '`w = w - 0.1 * np.array([3, -1])`',
        '`w = w + 0.1 * np.array([3, -1])`',
        '`w = w - 0.1 * np.array([-3, 1])`',
        '`w = w * 0.1`',
      ]
    answer: '`w = w - 0.1 * np.array([3, -1])`'
    why: >-
      The gradient points uphill, so subtract it to go down.

  - type: choice
    id: descent-trace
    kind: predict
    prompt: What does this print?
    code: |
      def grad(w):
          return 2 * (w - 5)

      w = 1.0
      w = w - 0.25 * grad(w)
      print(w)
    choices: ['3.0', '5.0', '-1.0', '2.0']
    answer: '3.0'
    why: >-
      The slope at 1 is -8, and a quarter of it, subtracted, adds 2.

  - type: choice
    id: rate
    kind: concept
    prompt: 'You try four learning rates. The final losses are: 0.001 gives 4.1, 0.01 gives 0.9, 0.1 gives 0.02, and 1.0 gives `inf`. Which should you use?'
    choices: ['0.1', '1.0', '0.001', '0.01']
    answer: '0.1'
    why: >-
      It got the lowest loss. 1.0 diverged, and the smaller rates were still creeping.

  - type: choice
    id: mse
    kind: predict
    prompt: What does this print?
    code: |
      import numpy as np

      x = np.array([1.0, 2.0, 3.0])
      y = np.array([2.0, 2.0, 2.0])
      print(np.mean((1.0 * x + 0.0 - y) ** 2))
    choices: ['0.6666666666666666', '2.0', '0.0', '1.0']
    answer: '0.6666666666666666'
    why: >-
      The errors are -1, 0 and 1. Squared, 1, 0 and 1, and the mean is 2 / 3.

  - type: choice
    id: check
    kind: concept
    prompt: A gradient check gives a relative error of `0.5` for one weight. What do you know?
    choices: ['That partial has a bug', 'Everything is fine', '`h` should be bigger', 'The loss will not fall']
    answer: 'That partial has a bug'
    why: >-
      Anything above about `1e-3` means the formula doesn't match the nudges. The loss might still fall, which is why you check.

  - type: fix
    id: fix-grad
    prompt: '`gradients(w, b, x, y)` should return the gradient of the MSE of `w * x + b` as `(dw, db)`. Fix it.'
    code: |
      import numpy as np

      def gradients(w, b, x, y):
          err = w * x + b - y
          dw = np.mean(2 * err)
          db = np.mean(2 * err)
          return dw, db
    solution: |
      import numpy as np

      def gradients(w, b, x, y):
          err = w * x + b - y
          dw = np.mean(2 * err * x)
          db = np.mean(2 * err)
          return dw, db
    tests:
      - {
          call: 'gradients(0.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
          expect: '(-17.0, -8.0)',
        }
      - {
          call: 'gradients(3.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
          expect: '(4.0, 1.0)',
          hidden: true,
        }
      - { call: 'gradients(1.0, 1.0, np.array([1.0, 2.0]), np.array([2.0, 2.0]))', expect: '(2.0, 1.0)', hidden: true }
    why: >-
      Changing `w` moves each prediction by its `x`, so `dw` needs the `* x`.

  - type: write
    id: write-df
    prompt: >-
      Write `df(x)`, the derivative of `(x ** 2 - 1) ** 3`. So `df(2.0)` is `108.0`.
    starter: |
      def df(x):
          # Your code here
    solution: |
      def df(x):
          return 3 * (x ** 2 - 1) ** 2 * 2 * x
    tests:
      - { call: 'df(2.0)', expect: '108.0' }
      - { call: 'df(0.0)', expect: '0.0' }
      - { call: 'df(1.0)', expect: '0.0', hidden: true }
      - { call: 'df(-2.0)', expect: '-108.0', hidden: true }
      - { call: 'df(0.5)', expect: '1.6875', hidden: true }
    why: >-
      The outside gives `3 * u ** 2` at `u = x ** 2 - 1`, times the inside's slope, `2 * x`.

  - type: write
    id: write-train
    prompt: >-
      Write `train(x, y, lr, steps)` that starts a line at `w = 0.0, b = 0.0`, takes `steps` steps of gradient descent on the MSE, and returns `(w, b)`.
    starter: |
      import numpy as np

      def train(x, y, lr, steps):
          # Your code here
    solution: |
      import numpy as np

      def train(x, y, lr, steps):
          w, b = 0.0, 0.0
          for _ in range(steps):
              err = w * x + b - y
              w, b = w - lr * np.mean(2 * err * x), b - lr * np.mean(2 * err)
          return w, b
    tests:
      - { call: 'train(np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]), 0.1, 1)', expect: '(1.7, 0.8)' }
      - {
          call: 'tuple(round(v, 2) for v in train(np.array([1.0, 2.0, 3.0, 4.0]), np.array([3.0, 5.0, 6.0, 9.0]), 0.05, 2000))',
          expect: '(1.9, 1.0)',
        }
      - { call: 'train(np.array([1.0, 2.0]), np.array([2.0, 2.0]), 0.1, 0)', expect: '(0.0, 0.0)', hidden: true }
      - {
          call: 'tuple(round(v, 3) for v in train(np.array([-1.0, 0.0, 1.0]), np.array([-2.0, 1.0, 4.0]), 0.1, 500))',
          expect: '(3.0, 1.0)',
          hidden: true,
        }
    why: >-
      Each step works out the errors for the current line, then moves `w` and `b` against their partials at the same time.
