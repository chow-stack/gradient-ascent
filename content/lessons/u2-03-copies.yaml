id: u2-copies
track: ml
unit: 3
order: 3
title: Copies
summary: When you really have two lists, and when you only think you do.

cards:
  - type: learn
    id: shallow
    title: A copy is one level deep
    body: >-
      `.copy()` makes a new outer list, but the items inside are the same objects. For a list of lists, that means the
      inner lists are shared. `copy.deepcopy` copies all the way down.
    code: |
      import copy

      grid = [[1, 2], [3, 4]]
      shallow = grid.copy()
      deep = copy.deepcopy(grid)

      grid[0][0] = 99
      print(shallow[0][0])
      print(deep[0][0])
    subgoals:
      - { line: 4, label: 'New outer list, same inner lists' }
      - { line: 5, label: New lists all the way down }
      - { line: 7, label: Change an inner list }
    predict: What are the two printed values?

  - type: choice
    id: shallow-predict
    kind: predict
    prompt: What does this print?
    code: |
      a = [[1], [2]]
      b = a.copy()
      b[0].append(5)
      b.append([3])
      print(a)
    choices: ['[[1, 5], [2]]', '[[1], [2]]', '[[1, 5], [2], [3]]', '[[1], [2], [3]]']
    answer: '[[1, 5], [2]]'
    why: >-
      The inner lists are shared, so `b[0].append(5)` shows up in `a`. The outer lists are separate, so `b.append([3])`
      doesn't.

  - type: choice
    id: times-trap
    kind: predict
    prompt: What does this print?
    code: |
      grid = [[0] * 2] * 2
      grid[0][0] = 1
      print(grid)
    choices: ['[[1, 0], [1, 0]]', '[[1, 0], [0, 0]]', '[[1, 1], [0, 0]]', 'Error']
    answer: '[[1, 0], [1, 0]]'
    why: >-
      `* 2` on the outer list repeats a reference to one inner list, so both rows are the same object. Build rows
      separately with a loop to get a real grid.
    variants:
      - code: |
          grid = [[0] * 3] * 2
          grid[1][2] = 7
          print(grid)
        choices: ['[[0, 0, 7], [0, 0, 7]]', '[[0, 0, 0], [0, 0, 7]]', '[[0, 0, 7], [0, 0, 0]]', 'Error']
        answer: '[[0, 0, 7], [0, 0, 7]]'
        why: Both rows are one list, so changing it through `grid[1]` shows in `grid[0]` too.
      - code: |
          row = [0, 0]
          grid = [row, row]
          row[1] = 5
          print(grid)
        choices: ['[[0, 5], [0, 5]]', '[[0, 0], [0, 0]]', '[[0, 5], [0, 0]]', 'Error']
        answer: '[[0, 5], [0, 5]]'
        why: The grid holds the same `row` object twice, so one change shows in both places.

  - type: choice
    id: slice-copy
    kind: predict
    prompt: What does this print?
    code: |
      a = [1, 2, 3]
      b = a[:]
      b[0] = 9
      print(a[0], b[0])
    choices: ['1 9', '9 9', '1 1', '9 1']
    answer: '1 9'
    why: >-
      A slice builds a new list, so these are two lists. (NumPy is different: its slices share memory. That comes in the next
      unit.)

  - type: blank
    id: grid-rows
    prompt: Make `zeros` build separate rows, so changing one row leaves the others alone.
    code: |
      def zeros(rows, cols):
          grid = []
          for _ in range(rows):
              grid.append(____)
          return grid
    answers: [['[0] * cols', '[0]*cols']]
    tests:
      - { call: 'zeros(2, 2)', expect: '[[0, 0], [0, 0]]' }
      - { call: '(lambda g: (g[0].append(1), g[1])[1])(zeros(2, 1))', expect: '[0]' }
    why: >-
      Each pass runs `[0] * cols` again, so each row is a new list. Numbers are safe to repeat with `*` because they can't be
      changed in place.

  - type: fix
    id: shared-copy
    prompt: '`clone_grid` should return a copy that can be changed freely, but the rows are still shared. Fix it.'
    code: |
      def clone_grid(grid):
          return grid.copy()
    solution: |
      def clone_grid(grid):
          result = []
          for row in grid:
              result.append(row.copy())
          return result
    tests:
      - { call: 'clone_grid([[1], [2]])', expect: '[[1], [2]]' }
      - { call: '(lambda g: (clone_grid(g)[0].append(9), g)[1])([[1]])', expect: '[[1]]' }
    why: >-
      `.copy()` is one level deep. Copying each row as well makes the two grids fully separate.
    hints:
      - The outer list is new, but what about each row inside it?

  - type: write
    id: sorted-desc
    prompt: Write `top_two(nums)`, which returns the two largest numbers, largest first, without changing `nums`.
    starter: |
      def top_two(nums):
          pass
    solution: |
      def top_two(nums):
          return sorted(nums, reverse=True)[:2]
    tests:
      - { call: 'top_two([1, 5, 3])', expect: '[5, 3]' }
      - { call: 'top_two([2, 2, 1])', expect: '[2, 2]' }
      - { call: '(lambda a: (top_two(a), a)[1])([1, 2, 3])', expect: '[1, 2, 3]', hidden: true }
    hints:
      - '`sorted(nums, reverse=True)` gives a new list, largest first.'

  - type: explain
    id: why-rows
    prompt: Why does changing one cell change a whole column here?
    code: |
      grid = [[0, 0]] * 3
      grid[0][1] = 1
      print(grid)
    model: >-
      `* 3` repeats a reference to one inner list, so all three rows are the same object. Changing it through any row shows in
      every row.
    keyPoints:
      - All rows are one list
      - '`*` on the outer list repeats references, not copies'
