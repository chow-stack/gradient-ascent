id: p1-project-rps
track: ml
unit: 1
order: 13
kind: project
title: 'Project: Rock, paper, scissors'
summary: The game already runs in the Play tab, but it calls every round a draw. Write who won and why, keep the score, and end the match at three.

cards:
  - type: project
    id: rps
    play: rps
    brief: >-
      Rock, paper, scissors against the computer, first to three wins. The game already runs: open the Play tab and
      press a move. It calls every round a draw, though, because the code that decides is a stand-in. Each milestone
      replaces one stand-in, and you can play again after every one.


      How it fits together: when you press a move, the Play tab puts your move in `player` and a random move in
      `computer`, puts the score so far in `wins` and `losses`, and runs your whole program from the top. Then it
      reads the variables your program set (`result`, `reason`, `wins`, `losses` and `winner`) to show the round,
      and passes the new score into the next one. Anything you print shows up under the game.


      To try your code without the Play tab, change `player` and `computer` at the top and press Run.
    example: |
      You win: rock crushes scissors
      Score: 1 to 0
    starter: |
      # The Play tab sets these two each round: your move, and the computer's random one.
      player = "rock"
      computer = "scissors"

      # The score before this round. The Play tab carries it over from the last round.
      wins = 0
      losses = 0


      # ---- Your code: stand-ins for now, so the game runs ----

      result = "draw"  # stand-in: every round is a draw
      reason = "same move"  # stand-in
      winner = "nobody"  # stand-in: the match never ends


      # ---- Prints the round ----

      print("You", result + ":", reason)
      print("Score:", wins, "to", losses)
    solution: |
      # The Play tab sets these two each round: your move, and the computer's random one.
      player = "rock"
      computer = "scissors"

      # The score before this round. The Play tab carries it over from the last round.
      wins = 0
      losses = 0


      # ---- Your code ----

      if player == computer:
          result = "draw"
      elif (
          (player == "rock" and computer == "scissors")
          or (player == "scissors" and computer == "paper")
          or (player == "paper" and computer == "rock")
      ):
          result = "win"
      else:
          result = "lose"

      if result == "win":
          best = player
      else:
          best = computer

      if result == "draw":
          reason = "same move"
      elif best == "rock":
          reason = "rock crushes scissors"
      elif best == "scissors":
          reason = "scissors cut paper"
      else:
          reason = "paper covers rock"

      if result == "win":
          wins = wins + 1
      elif result == "lose":
          losses = losses + 1

      if wins == 3:
          winner = "you"
      elif losses == 3:
          winner = "computer"
      else:
          winner = "nobody"


      # ---- Prints the round ----

      print("You", result + ":", reason)
      print("Score:", wins, "to", losses)
    milestones:
      - title: Who won?
        goal: >-
          Replace the stand-in `result = "draw"` with code that sets `result` to `"win"`, `"lose"` or `"draw"`, from
          your side, using `player` and `computer`. Rock beats scissors, scissors beats paper, and paper beats rock.
          The check tries every pair of moves, so every case has to be right. (The reason still says `same move`:
          that's the next milestone.)
        shows: |
          player = "rock",  computer = "scissors"  →  result is "win"
          player = "rock",  computer = "paper"     →  result is "lose"
          player = "paper", computer = "paper"     →  result is "draw"
        tests:
          - { call: result, expect: "'win'" }
        vary:
          - { player: '"paper"', computer: '"scissors"' }
          - { player: '"scissors"', computer: '"scissors"' }
          - { player: '"rock"', computer: '"paper"' }
          - { player: '"scissors"', computer: '"paper"' }
          - { player: '"paper"', computer: '"rock"' }
        requires: ['elif']
        hints:
          - 'Check for a draw first: `if player == computer:`.'
          - 'There are only three ways to win. Join them with `or`, like `(player == "rock" and computer == "scissors") or ...`. Anything else is a loss.'
      - title: Say why
        goal: >-
          Replace the stand-in for `reason` so it says what happened, with the winning move first:
          `"rock crushes scissors"`, `"scissors cut paper"` or `"paper covers rock"`. On a draw, keep `"same move"`.
          Write it after your code for `result`, so you can use it.
        shows: |
          player = "rock", computer = "paper"  →  reason is "paper covers rock"
        tests:
          - { call: reason, expect: "'rock crushes scissors'" }
        vary:
          - { player: '"rock"', computer: '"paper"' }
          - { player: '"scissors"', computer: '"paper"' }
          - { player: '"paper"', computer: '"scissors"' }
          - { player: '"paper"', computer: '"rock"' }
          - { player: '"rock"', computer: '"rock"' }
        hints:
          - "Work out the winning move first: it's `player` if you won, and `computer` otherwise. Store it in a new variable."
          - 'Then one `if`/`elif` on that move picks the sentence. Handle the draw before the rest.'
      - title: Keep score
        goal: >-
          The score never moves. After your `reason` code, add 1 to `wins` when you won the round, and add 1 to
          `losses` when you lost it. A draw changes neither. The Play tab passes the new numbers into the next round.
        shows: |
          wins = 2, losses = 1, and you win this round  →  wins is 3, losses is 1
        tests:
          - { call: wins, expect: '1' }
          - { call: losses, expect: '0' }
        vary:
          - { player: '"rock"', computer: '"paper"', wins: '3', losses: '5' }
          - { player: '"paper"', computer: '"rock"', wins: '2', losses: '0' }
          - { player: '"paper"', computer: '"paper"', wins: '1', losses: '1' }
        hints:
          - Use `result`, which you've already worked out.
          - '`if result == "win": wins = wins + 1`, then an `elif` for losing.'
      - title: First to three
        goal: >-
          The match never ends. Replace the stand-in for `winner`: `"you"` once `wins` reaches 3, `"computer"` once
          `losses` does, and `"nobody"` before then. Put it after the score is updated, so the winning round counts.
          The Play tab ends the match when it sees a winner.
        shows: |
          wins is 3 after this round  →  winner is "you"
          wins is 2, losses is 2      →  winner is "nobody"
        tests:
          - { call: winner, expect: "'nobody'" }
        vary:
          - { player: '"rock"', computer: '"scissors"', wins: '2', losses: '1' }
          - { player: '"rock"', computer: '"paper"', wins: '0', losses: '2' }
          - { player: '"rock"', computer: '"rock"', wins: '2', losses: '2' }
        hints:
          - '`if wins == 3: winner = "you"`, then `elif` for the computer and `else` for nobody.'
    extras:
      - Add lizard and Spock. Lizard eats paper, Spock smashes scissors, rock crushes lizard, and so on. Try the new moves by changing `player` at the top and pressing Run.
      - Print a different taunt from the computer depending on the score, like when it's two ahead.
      - Make the match first to five.
