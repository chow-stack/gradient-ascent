id: p6-project-fit
track: ml
unit: 6
order: 9
kind: project
title: 'Project: Fit a line'
summary: Build linear regression from scratch, then click in data points and watch your gradient descent roll down the loss valley.

cards:
  - type: project
    id: fit
    play: fit
    brief: >-
      You'll build the whole of linear regression yourself: a prediction, a loss, its gradient, a training step, the
      training loop, and a gradient check to prove the gradient is right. No libraries beyond NumPy.


      The editor starts with only the data: four points on the line y = 2x + 1, so you know the answer your training
      should find, `w = 2` and `b = 1`. Each milestone adds one function, and the last-but-one has you write the
      loop that trains the line and print what it found.


      The Play tab calls your functions with points you click in. Press Train, and watch two things move at once: the
      line bending to fit the points, and a dot rolling down the loss valley, a map of the loss for every `w` and
      `b`. It takes one `step` per frame, so you can watch the loop you wrote. Try the learning rates and see
      creeping, settling and diverging for yourself.
    starter: |
      import numpy as np

      # Try your functions on these points. They sit on the line y = 2x + 1.
      x = np.array([0.0, 1.0, 2.0, 3.0])
      y = np.array([1.0, 3.0, 5.0, 7.0])
    solution: |
      import numpy as np

      x = np.array([0.0, 1.0, 2.0, 3.0])
      y = np.array([1.0, 3.0, 5.0, 7.0])


      def predict(w, b, x):
          return w * x + b


      def loss(w, b, x, y):
          return np.mean((predict(w, b, x) - y) ** 2)


      def gradients(w, b, x, y):
          err = predict(w, b, x) - y
          return np.mean(2 * err * x), np.mean(2 * err)


      def step(w, b, x, y, lr):
          dw, db = gradients(w, b, x, y)
          return w - lr * dw, b - lr * db


      def train(w, b, x, y, lr, steps):
          for _ in range(steps):
              w, b = step(w, b, x, y, lr)
          return w, b


      def check(w, b, x, y):
          h = 0.00001
          dw, db = gradients(w, b, x, y)
          nw = (loss(w + h, b, x, y) - loss(w - h, b, x, y)) / (2 * h)
          nb = (loss(w, b + h, x, y) - loss(w, b - h, x, y)) / (2 * h)
          return (
              abs(dw - nw) / max(abs(dw) + abs(nw), 1e-12),
              abs(db - nb) / max(abs(db) + abs(nb), 1e-12),
          )


      w, b = train(0.0, 0.0, x, y, 0.05, 1000)
      print("w =", round(w, 3), " b =", round(b, 3))
    milestones:
      - title: Predict
        goal: >-
          Write `predict(w, b, x)`, the line's prediction `w * x + b`. It should work when `x` is one number or a whole
          array. Then open the Play tab: your line appears through the points.
        examples:
          - { call: 'predict(2.0, 1.0, 3.0)', gives: '7.0' }
          - { call: 'predict(2.0, 1.0, np.array([0.0, 1.0]))', gives: '[1.0, 3.0]' }
        tests:
          - { call: 'predict(2.0, 1.0, 3.0)', expect: '7.0' }
          - { call: 'predict(2.0, 1.0, np.array([0.0, 1.0]))', expect: '[1.0, 3.0]' }
          - { call: 'predict(-0.5, 0.0, np.array([4.0, -2.0]))', expect: '[-2.0, 1.0]', hidden: true }
        scope: predict
        hints:
          - NumPy does `w * x + b` for every item of an array at once.
      - title: The loss
        goal: >-
          Write `loss(w, b, x, y)`, the mean squared error of the line on the points: how far each prediction is from
          its `y`, squared, then averaged. Use your `predict`. The Play tab then draws the loss valley.
        examples:
          - { call: 'loss(2.0, 1.0, x, y)', gives: '0.0' }
          - { call: 'loss(0.0, 0.0, x, y)', gives: '21.0' }
        tests:
          - { call: 'loss(0.0, 0.0, x, y)', expect: '21.0' }
          - { call: 'loss(2.0, 1.0, x, y)', expect: '0.0' }
          - {
              call: 'loss(1.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
              expect: '7.5',
              hidden: true,
            }
          - { call: 'loss(1.0, 1.0, np.array([1.0, 2.0]), np.array([2.0, 2.0]))', expect: '0.5', hidden: true }
        requires: ['name:predict']
        scope: loss
        hints:
          - The errors are `predict(w, b, x) - y`.
          - Square the errors, then take `np.mean`.
      - title: The gradient
        goal: >-
          Write `gradients(w, b, x, y)`, which gives back the partial derivatives of the loss as a tuple `(dw, db)`:
          how much the loss changes as `w` changes, and as `b` changes. At the best line both are 0.
        examples:
          - { call: 'gradients(0.0, 0.0, x, y)', gives: '(-17.0, -8.0)' }
          - { call: 'gradients(2.0, 1.0, x, y)', gives: '(0.0, 0.0)' }
        tests:
          - { call: 'gradients(0.0, 0.0, x, y)', expect: '(-17.0, -8.0)' }
          - { call: 'gradients(2.0, 1.0, x, y)', expect: '(0.0, 0.0)' }
          - {
              call: 'gradients(3.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]))',
              expect: '(4.0, 1.0)',
              hidden: true,
            }
          - {
              call: 'gradients(1.0, 1.0, np.array([1.0, 2.0]), np.array([2.0, 2.0]))',
              expect: '(2.0, 1.0)',
              hidden: true,
            }
        scope: gradients
        hints:
          - "With `err = predict(w, b, x) - y`, each point's slopes are `2 * err * x` for `w` and `2 * err` for `b`."
          - Take the mean of each, and return them both.
      - title: One step downhill
        goal: >-
          Write `step(w, b, x, y, lr)`, one step of gradient descent: move `w` and `b` against their gradients, each
          by `lr` times its gradient, and give back the new `(w, b)`. Use your `gradients`. Then press Train in the
          Play tab and try each learning rate.
        examples:
          - { call: 'step(0.0, 0.0, x, y, 0.1)', gives: '(1.7, 0.8)' }
          - { call: 'step(2.0, 1.0, x, y, 0.1)', gives: '(2.0, 1.0)' }
        tests:
          - { call: 'step(0.0, 0.0, x, y, 0.1)', expect: '(1.7, 0.8)' }
          - { call: 'step(2.0, 1.0, x, y, 0.1)', expect: '(2.0, 1.0)' }
          - {
              call: 'step(3.0, 0.0, np.array([0.0, 1.0, 2.0, 3.0]), np.array([1.0, 3.0, 5.0, 7.0]), 0.5)',
              expect: '(1.0, -0.5)',
              hidden: true,
            }
          - {
              call: 'step(1.0, 1.0, np.array([1.0, 2.0]), np.array([2.0, 2.0]), 0.25)',
              expect: '(0.5, 0.75)',
              hidden: true,
            }
        requires: ['name:gradients']
        scope: step
        hints:
          - '`dw, db = gradients(w, b, x, y)`'
          - Move each against its partial, scaled by `lr`.
      - title: Train
        goal: >-
          One step isn't enough. Write `train(w, b, x, y, lr, steps)`, which starts at `w` and `b`, takes `steps`
          steps of gradient descent with your `step`, and gives back the final `(w, b)`. Then, at the bottom of the
          program, train from `0.0, 0.0` with a learning rate of `0.05` for 1000 steps, and print what it found. It
          should be very close to `w = 2` and `b = 1`.
        examples:
          - { call: 'train(0.0, 0.0, x, y, 0.1, 1)', gives: '(1.7, 0.8)' }
          - { call: 'train(0.0, 0.0, x, y, 0.1, 2)', gives: '(1.97, 0.93)' }
          - { call: '[round(float(v), 3) for v in train(0.0, 0.0, x, y, 0.05, 1000)]', gives: '[2.0, 1.0]' }
        shows: |
          w = 2.0  b = 1.0
        tests:
          - { call: 'train(0.0, 0.0, x, y, 0.1, 2)', expect: '(1.97, 0.93)' }
          - { call: 'train(5.0, -3.0, x, y, 0.1, 0)', expect: '(5.0, -3.0)' }
          - {
              call: '[round(float(v), 3) for v in train(0.0, 0.0, x, y, 0.05, 1000)]',
              expect: '[2.0, 1.0]',
              hidden: true,
            }
          - {
              call: '[round(float(v), 3) for v in train(0.0, 0.0, x, y, 0.05, 100)]',
              expect: '[2.001, 0.997]',
              hidden: true,
            }
        requires: ['name:step', 'for']
        scope: train
        hints:
          - '`for _ in range(steps):` and inside it, replace `w, b` with what `step` gives back.'
          - 'Return `w, b` after the loop. At the bottom: `w, b = train(0.0, 0.0, x, y, 0.05, 1000)`, then `print(w, b)`.'
      - title: Check the gradient
        goal: >-
          Write `check(w, b, x, y)`. Work out the central difference of `loss` for `w`, then for `b`, with `h = 0.00001`, and give back the two relative
          errors against `gradients` as a tuple. Use `abs(a - n) / max(abs(a) + abs(n), 1e-12)`. Both should be tiny. Then try Check in the Play tab.
        tests:
          - { call: 'max(check(0.5, 0.5, x, y)) < 1e-5', expect: 'True' }
          - { call: 'len(check(-1.0, 2.0, x, y))', expect: '2' }
          - {
              call: 'max(check(1.5, 0.5, np.array([1.0, 2.0, 4.0]), np.array([2.0, 2.0, 5.0]))) < 1e-5',
              expect: 'True',
              hidden: true,
            }
          - {
              call: '(lambda g: (globals().__setitem__("gradients", lambda w, b, x, y: (g(w, b, x, y)[0], g(w, b, x, y)[1] / 2)), check(0.5, 0.5, x, y))[1])(gradients)[1] > 0.3',
              expect: 'True',
              hidden: true,
            }
        requires: ['name:gradients', 'name:loss']
        scope: check
        hints:
          - '`nw = (loss(w + h, b, x, y) - loss(w - h, b, x, y)) / (2 * h)`, and the same for `b`.'
          - Compare `nw` with `dw` and `nb` with `db`, each with the relative error.
    extras:
      - 'Fit a curve: add a `c * x ** 2` term to `predict`, and a third partial to `gradients`.'
      - Add momentum. Keep a running velocity, `v = 0.9 * v + grad`, and step by `v` instead of the gradient. Does it reach the bottom faster?
      - Use the mean absolute error, `np.mean(np.abs(err))`, and compare how much the Outlier points pull the line.
