id: p1-project-receipt
track: ml
unit: 1
order: 13
kind: project
title: 'Project: Trail report'
summary: Combine everything from this unit into one small program.

cards:
  - type: learn
    id: brief
    label: The project
    title: Reporting on a hike
    body: >-
      You'll build one small program in three steps. It takes the raw numbers from a hike, works out what they mean, decides how hard the hike was, and prints a
      report that a person would want to read.


      Each step adds to the last, and you'll see your earlier code in the starter. There's no new Python here, only what you already know, used together. This is what
      real programming feels like. If you need a reminder, you can reread any earlier lesson from the path.

  - type: write
    id: numbers
    prompt: >-
      Step 1 of 3. `name` has stray capitals, and `km` arrived as text. Make `clean_name` hold `name` in lowercase, `distance` hold `km` as a float, and `pace` hold the
      minutes per kilometre, which is `minutes` divided by `distance`.
    starter: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
    solution: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
      clean_name = name.lower()
      distance = float(km)
      pace = minutes / distance
    tests:
      - { call: clean_name, expect: "'eagle ridge'" }
      - { call: distance, expect: '12.5' }
      - { call: pace, expect: '16.0' }
    hints:
      - '`float()` converts text to a number with a decimal point.'
      - Divide after converting, because you can't divide using text.

  - type: write
    id: rating
    prompt: >-
      Step 2 of 3. Make `rating` hold `"hard"` if `distance` is over 20 or `pace` is over 15, `"moderate"` if `distance` is over 8, and `"easy"` otherwise.
    starter: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
      clean_name = name.lower()
      distance = float(km)
      pace = minutes / distance
      # rating goes here
    solution: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
      clean_name = name.lower()
      distance = float(km)
      pace = minutes / distance
      if distance > 20 or pace > 15:
          rating = "hard"
      elif distance > 8:
          rating = "moderate"
      else:
          rating = "easy"
    tests:
      - { call: rating, expect: "'hard'" }
    hints:
      - Use one chain. Each side of `or` must be a complete comparison.

  - type: write
    id: report
    prompt: >-
      Step 3 of 3. Make `report` hold exactly `Eagle ridge: 12.5 km, hard`. Use an f-string, and uppercase the first letter of `clean_name` with `[0]`, `.upper()` and a slice.
      Then print `report`.
    starter: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
      clean_name = name.lower()
      distance = float(km)
      pace = minutes / distance
      if distance > 20 or pace > 15:
          rating = "hard"
      elif distance > 8:
          rating = "moderate"
      else:
          rating = "easy"
      # report goes here
    solution: |
      name = "EAGLE Ridge"
      km = "12.5"
      minutes = 200
      clean_name = name.lower()
      distance = float(km)
      pace = minutes / distance
      if distance > 20 or pace > 15:
          rating = "hard"
      elif distance > 8:
          rating = "moderate"
      else:
          rating = "easy"
      title = clean_name[0].upper() + clean_name[1:]
      report = f"{title}: {distance} km, {rating}"
      print(report)
    tests:
      - { call: report, expect: "'Eagle ridge: 12.5 km, hard'" }
    expectOutput: 'Eagle ridge: 12.5 km, hard'
    why: >-
      Build the title first, then fill all three values into one f-string. In a few units, you'll wrap this in a function so it works on any hike.
    hints:
      - Make the title in its own variable first.
