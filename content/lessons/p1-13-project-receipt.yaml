id: p1-project-receipt
track: ml
unit: 1
order: 13
kind: project
title: 'Project: Monster card'
summary: Design a creature for a card game and print its card, with a power score and a rank worked out from its stats.

cards:
  - type: project
    id: monster-card
    brief: >-
      You're designing creatures for a card game. Each one has a name and four stats, and your program turns them into a printed card: a framed name, a power bar,
      a rank and the creature's weak spot.


      The stats sit at the top of the code. When you're done, change them and run it again. A good program makes a correct card for any creature, so the checks
      will try other stats too. Hard-coding this creature's card won't pass.


      There's no new Python here, only what this unit taught, used together. Work through the milestones in order and press Check whenever you want to see how far
      you've got. Your code is saved as you type, so you can stop and come back.
    example: |
      +----------------------+
      | FLUFFY THE DESTROYER |
      +----------------------+
      HP 64  ATK 23  DEF 9  SPD 15
      Power 70 #######
      Rank: RARE
      Weak spot: defence
    starter: |
      name = "fluffy the destroyer"
      hp = 64
      attack = 23
      defence = 9
      speed = 15

      # Your code goes below.
    solution: |
      name = "fluffy the destroyer"
      hp = 64
      attack = 23
      defence = 9
      speed = 15

      banner = name.upper()
      power = attack * 2 + defence + speed
      bar = "#" * (power // 10)

      if power >= 80:
          rank = "LEGENDARY"
      elif power >= 50:
          rank = "RARE"
      else:
          rank = "COMMON"

      low = min(attack, defence, speed)
      if low == attack:
          weak = "attack"
      elif low == defence:
          weak = "defence"
      else:
          weak = "speed"

      edge = "+" + "-" * (len(banner) + 2) + "+"
      print(edge)
      print("| " + banner + " |")
      print(edge)
      print(f"HP {hp}  ATK {attack}  DEF {defence}  SPD {speed}")
      print(f"Power {power} {bar}")
      print(f"Rank: {rank}")
      print(f"Weak spot: {weak}")
    milestones:
      - title: Shout the name
        goal: Make `banner` hold the creature's name in capitals.
        tests:
          - { call: banner, expect: "'FLUFFY THE DESTROYER'" }
        vary: [{ name: '"mr nibbles"' }]
        hints:
          - Strings have a method that gives back a copy in capitals. You met it when building text.
          - '`banner = name.upper()`'
      - title: Power and a power bar
        goal: >-
          `power` is attack counted twice, plus defence and speed. `bar` is one `#` for every full 10 power, so 70 power gives 7 of them.
        tests:
          - { call: power, expect: '70' }
          - { call: bar, expect: "'#######'" }
        vary: [{ attack: '41' }, { speed: '0' }]
        hints:
          - '`attack * 2 + defence + speed` is the power. Multiplication happens before addition.'
          - Floor division `//` gives the number of whole tens, and a string times a number repeats it.
          - '`bar = "#" * (power // 10)`'
      - title: Give it a rank
        goal: '`rank` is `"LEGENDARY"` for 80 power or more, `"RARE"` for 50 or more, and `"COMMON"` otherwise.'
        tests:
          - { call: rank, expect: "'RARE'" }
        vary: [{ attack: '40' }, { attack: '5' }, { attack: '13' }]
        requires: ['if', 'elif']
        hints:
          - Check the biggest threshold first. Once one branch runs, the rest are skipped.
          - 'Use `if power >= 80:`, then `elif power >= 50:`, then `else:`.'
      - title: Find the weak spot
        goal: >-
          `weak` names the lowest of attack, defence and speed, as `"attack"`, `"defence"` or `"speed"`. If two are tied for lowest, the first in that order
          wins.
        tests:
          - { call: weak, expect: "'defence'" }
        vary: [{ attack: '3' }, { speed: '2' }, { defence: '30' }, { defence: '15' }]
        requires: ['if']
        hints:
          - '`min()` gives you the lowest number. Then work out which stat it came from.'
          - 'Store `low = min(attack, defence, speed)`, then compare: `if low == attack:` and so on.'
      - title: Print the card
        goal: >-
          Print the card like the example. The frame is as wide as the name plus a space on each side, so a longer name makes a wider card.
        expectOutput: |
          +----------------------+
          | FLUFFY THE DESTROYER |
          +----------------------+
          HP 64  ATK 23  DEF 9  SPD 15
          Power 70 #######
          Rank: RARE
          Weak spot: defence
        vary: [{ name: '"bob"' }, { hp: '7', attack: '50' }]
        hints:
          - The top edge is `+`, then one `-` for each character inside the frame, then `+`. Inside the frame is the name with a space either side.
          - '`edge = "+" + "-" * (len(banner) + 2) + "+"`, then print `edge`, the name line, and `edge` again.'
          - 'An f-string builds the stats line: `f"HP {hp}  ATK {attack}  DEF {defence}  SPD {speed}"`.'
