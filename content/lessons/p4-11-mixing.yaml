id: p4-mixing
track: ml
unit: 4
order: 11
title: Mixing objects and numbers
summary: Make 2 * v and v + 1 both work, as micrograd does.

cards:
  - type: learn
    id: goal
    label: The goal
    title: When one side is a plain number
    body: >-
      Real calculations mix your objects with ordinary numbers: `2 * x`, `x + 1`, or `sum(values)`. As your classes stand, all of those crash, and each for a different reason.


      By the end of this lesson you'll be able to make operators accept plain numbers, make them work with the number on the left, and use `sum` on your objects. These are the exact lines in micrograd's `Value`.

  - type: learn
    id: isinstance
    title: Accepting a plain number
    body: >-
      Say `__add__` does `self.data + other.data`. If you write `v + 1`, then `other` is the number 1, which has no `.data`, so you get `AttributeError: 'int' object has no attribute 'data'`.


      The fix is to look at what you were given. `isinstance(x, Value)` is `True` if `x` is a `Value`. So at the top of the method, if `other` isn't already a `Value`, you wrap it in one. Then the rest of the method can carry on assuming it has a `Value`.


      micrograd writes that in one line, using the choosing form from the comprehensions lesson: `other = other if isinstance(other, Value) else Value(other)`. Read it as "keep `other` if it's already a `Value`, and otherwise wrap it". `isinstance` also works on built-in types, as in `isinstance(3, int)`.
    code: |
      class Value:
          def __init__(self, data):
              self.data = data

          def __add__(self, other):
              other = other if isinstance(other, Value) else Value(other)
              return Value(self.data + other.data)

      v = Value(2)
      print((v + Value(3)).data)
      print((v + 1).data)
      print(isinstance(v, Value), isinstance(1, Value))
    subgoals:
      - { line: 6, label: 'Wrap a plain number in a Value' }
      - { line: 7, label: 'From here, other is always a Value' }
      - { line: 11, label: 'A plain number works now' }
      - { line: 12, label: 'Is this a Value?' }
    predict: What will `(v + 1).data` show?

  - type: choice
    id: isinstance-trace
    kind: predict
    prompt: What does this print?
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __mul__(self, other):
              other = other if isinstance(other, V) else V(other)
              return V(self.x * other.x)

      print((V(2) * 3).x, (V(2) * V(5)).x)
    choices: ['6 10', '6 Error', 'Error', '5 7']
    answer: '6 10'
    why: >-
      A plain number gets wrapped, and a `V` is kept as it is, so both forms work.
    variants:
      - code: |
          print(isinstance(1.5, float), isinstance(1, float))
        choices: ['True False', 'True True', 'False False', 'False True']
        answer: 'True False'
        why: >-
          `1` is an `int`, not a `float`.
      - code: |
          def describe(x):
              return "list" if isinstance(x, list) else "other"

          print(describe([1]), describe((1,)))
        choices: ['list other', 'list list', 'other other', 'other list']
        answer: 'list other'
        why: >-
          A tuple isn't a list.

  - type: learn
    id: right
    title: When the number comes first
    body: >-
      `v * 2` runs `v.__mul__(2)`. But `2 * v` starts with the number, so Python first tries `int.__mul__(2, v)`. The `int` class has never heard of your class, so it reports back that it can't do it. Before giving up, Python tries the object on the right, by calling `v.__rmul__(2)`. The r stands for right, or reflected.


      If there's no `__rmul__`, you get `TypeError: unsupported operand type(s) for *: 'int' and 'V'`. Python never swaps the sides by itself, because for some operations the order matters.


      For multiplication and addition, the order doesn't matter, so `__rmul__` can just reuse the normal version with `return self * other`. Subtraction is different. `5 - v` calls `v.__rsub__(5)`, where `self` is `v` and `other` is 5, so the answer has to be `other - self`, and it's easy to get that backwards.
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __mul__(self, k):
              return V(self.x * k)

          def __rmul__(self, k):
              return self * k

          def __rsub__(self, k):
              return V(k - self.x)

      print((V(3) * 2).x)
      print((2 * V(3)).x)
      print((5 - V(3)).x)
    subgoals:
      - { line: 8, label: 'Runs for 2 * v, after int gives up' }
      - { line: 9, label: 'Reuse __mul__' }
      - { line: 12, label: 'Here the order matters' }
      - { line: 15, label: 'int cannot do it, so __rmul__ runs' }
    predict: What will `(5 - V(3)).x` show?

  - type: choice
    id: right-concept
    prompt: Which method does Python use for `2 * v`, when `v` has both `__mul__` and `__rmul__`?
    choices:
      - "`__rmul__`, because the number 2 can't handle it"
      - '`__mul__`, since multiplying always uses it'
      - Neither, because it's an error
    answer: "`__rmul__`, because the number 2 can't handle it"
    why: >-
      Python tries the left object first. `int` doesn't know your class, so it falls back to the right object's `__rmul__`.

  - type: choice
    id: right-error
    prompt: This class has `__mul__` but no `__rmul__`. What happens on the last line?
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __mul__(self, k):
              return V(self.x * k)

      print((2 * V(3)).x)
    choices: ['TypeError', '6', 'AttributeError', '2']
    answer: 'TypeError'
    why: >-
      Python never swaps the sides by itself. `int` can't do it, and there's no fallback.

  - type: explain
    id: explain-rmul
    prompt: Why does `3 * v` fail here, when `v * 3` works?
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __mul__(self, k):
              return V(self.x * k)

      v = V(2)
      print((v * 3).x)
      print((3 * v).x)
    expectError: TypeError
    model: >-
      `3 * v` starts with the integer, which can't multiply a `V`, and the class has no `__rmul__` to fall back on. `v * 3` uses `__mul__`, because `v` is on the left.
    keyPoints:
      - The object on the left is tried first
      - '`__rmul__` handles your object being on the right'

  - type: learn
    id: sum
    title: Why sum needs __radd__
    body: >-
      This next one catches almost everybody. `sum([a, b])` looks like it only adds your objects, but `sum` starts with 0. It really works out `0 + a + b`. So the first step has the plain number 0 on the left, which means Python needs `a.__radd__(0)`. Without it, you get a `TypeError`, even though `a + b` works perfectly.


      Add `__radd__`, and `sum` works. Together with `isinstance` wrapping, `0 + a` becomes `a + 0`, and that gives a new object with the same value.


      You can also write `sum(values, start)` to give it a different starting value, but `__radd__` is the usual fix. In micrograd's neural network, the loss is written as `sum(...)` over the examples, so this exact method is what makes that line work.
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __add__(self, other):
              other = other if isinstance(other, V) else V(other)
              return V(self.x + other.x)

          def __radd__(self, other):
              return self + other

      total = sum([V(1), V(2), V(3)])
      print(total.x)
      print((10 + V(1)).x)
    subgoals:
      - { line: 6, label: 'Accepts the 0 from sum' }
      - { line: 9, label: 'Runs for 0 + a' }
      - { line: 10, label: 'Same as a + 0' }
      - { line: 12, label: 'Really 0 + V(1) + V(2) + V(3)' }
    predict: What will `total.x` show?

  - type: blank
    id: fill-rmul
    prompt: Fill in the method name so `2 * v` works, and this shows `6`.
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __mul__(self, k):
              return V(self.x * k)

          def ____(self, k):
              return self * k

      print((2 * V(3)).x)
    answers: [['__rmul__']]
    expectOutput: '6'
    why: >-
      `__rmul__` handles a number on the left.
    variants:
      - prompt: Fill in the method name so `sum` works, and this shows `3`.
        code: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __add__(self, other):
                  n = other.x if isinstance(other, V) else other
                  return V(self.x + n)

              def ____(self, other):
                  return self + other

          print(sum([V(1), V(2)]).x)
        answers: [['__radd__']]
        expectOutput: '3'
        why: >-
          `sum` starts from 0, so the first step has a number on the left.
      - prompt: Fill in the blank so a plain number gets wrapped, and this shows `5`.
        code: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __add__(self, other):
                  other = other if ____ else V(other)
                  return V(self.x + other.x)

          print((V(2) + 3).x)
        answers: [['isinstance(other, V)', 'isinstance(other,V)']]
        expectOutput: '5'
        why: >-
          Keep it if it's already a `V`, and otherwise wrap it.
      - prompt: Fill in the blank so the order is right, and this shows `2`.
        code: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __rsub__(self, other):
                  return V(____)

          print((5 - V(3)).x)
        answers: [['other - self.x', 'other-self.x']]
        expectOutput: '2'
        why: >-
          In `5 - v`, `other` is 5 and `self` is `v`, so it's `other - self.x`.

  - type: fix
    id: fix-wrap
    prompt: '`(V(2) + 1).x` should give back `3`, but it crashes with an `AttributeError`, because `1` has no `.x`. Fix `__add__` so it accepts a plain number.'
    code: |
      class V:
          def __init__(self, x):
              self.x = x

          def __add__(self, other):
              return V(self.x + other.x)
    solution: |
      class V:
          def __init__(self, x):
              self.x = x

          def __add__(self, other):
              other = other if isinstance(other, V) else V(other)
              return V(self.x + other.x)
    highlightLine: 6
    tests:
      - { call: '(V(2) + 1).x', expect: '3' }
      - { call: '(V(2) + V(5)).x', expect: '7' }
    why: >-
      Wrapping at the top of the method means the rest only has to deal with a `V`.
    hints:
      - '`isinstance(other, V)` tells you what you were given.'
    variants:
      - prompt: '`(2 * V(3)).x` should give back `6`, but it crashes with a `TypeError`. Add the missing method.'
        code: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __mul__(self, k):
                  return V(self.x * k)
        solution: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __mul__(self, k):
                  return V(self.x * k)

              def __rmul__(self, k):
                  return self * k
        highlightLine: 1
        tests:
          - { call: '(2 * V(3)).x', expect: '6' }
          - { call: '(V(3) * 2).x', expect: '6' }
        why: >-
          With the number on the left, Python looks for `__rmul__`.
        hints:
          - It can reuse `__mul__`.
      - prompt: '`(5 - V(3)).x` should give back `2`, but it gives back `-2`. Fix the order.'
        code: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __rsub__(self, other):
                  return V(self.x - other)
        solution: |
          class V:
              def __init__(self, x):
                  self.x = x

              def __rsub__(self, other):
                  return V(other - self.x)
        highlightLine: 6
        tests:
          - { call: '(5 - V(3)).x', expect: '2' }
        why: >-
          In `5 - v`, the number is on the left, so it's `other - self.x`.
        hints:
          - In `5 - v`, which one is `other`?

  - type: learn
    id: worked
    label: Worked example
    title: The arithmetic of micrograd
    body: >-
      Here's `Value` with all its arithmetic. It's close to the real micrograd source, without the gradient parts. You now know every line in it.


      Notice how few real calculations there are. Only `__add__` and `__mul__` work directly with the data. Everything else is written in terms of them. Subtraction is adding a negative, negation is multiplying by -1, and the right-hand versions call the left-hand ones with the sides swapped.


      That matters for the micrograd unit. Each operation that touches data needs its own gradient rule, so the fewer of them there are, the less there is to write. The final line uses all of it, and it's the kind of expression a loss function is made of.
    code: |
      class Value:
          def __init__(self, data):
              self.data = data

          def __repr__(self):
              return f"Value({self.data})"

          def __add__(self, other):
              other = other if isinstance(other, Value) else Value(other)
              return Value(self.data + other.data)

          def __mul__(self, other):
              other = other if isinstance(other, Value) else Value(other)
              return Value(self.data * other.data)

          def __neg__(self):
              return self * -1

          def __sub__(self, other):
              return self + (-other)

          def __radd__(self, other):
              return self + other

          def __rmul__(self, other):
              return self * other

      x = Value(3)
      print(2 * x - 1)
      print(sum([x, x, 1]))
    subgoals:
      - { line: 9, label: 'Accept plain numbers' }
      - { line: 17, label: 'Written using *' }
      - { line: 20, label: 'Written using + and negation' }
      - { line: 26, label: 'The sides swapped' }
      - { line: 30, label: 'Mixed with plain numbers' }
    predict: What will `2 * x - 1` show?

  - type: write
    id: write-mixing
    prompt: Write a class `Num` with `.data`. `Num(2) + 3`, `3 + Num(2)` and `Num(2) + Num(3)` should all work, each giving a new `Num`. `sum([Num(1), Num(2)])` should work as well.
    starter: |
      # Write the Num class here
    solution: |
      class Num:
          def __init__(self, data):
              self.data = data

          def __add__(self, other):
              other = other if isinstance(other, Num) else Num(other)
              return Num(self.data + other.data)

          def __radd__(self, other):
              return self + other
    tests:
      - { call: '(Num(2) + 3).data', expect: '5' }
      - { call: '(3 + Num(2)).data', expect: '5' }
      - { call: '(Num(2) + Num(3)).data', expect: '5' }
      - { call: 'sum([Num(1), Num(2)]).data', expect: '3' }
    why: >-
      Wrapping handles a number on the right, and `__radd__` handles one on the left, which includes the 0 from `sum`.
    hints:
      - Use `isinstance` in `__add__`.
      - '`__radd__` can reuse `__add__`.'
    variants:
      - prompt: Write a class `Scale` with `.k`. `Scale(2) * 3` and `3 * Scale(2)` should both give a new `Scale` with `k` of 6. `Scale(2) * Scale(5)` should give one with a `k` of 10.
        starter: |
          # Write the Scale class here
        solution: |
          class Scale:
              def __init__(self, k):
                  self.k = k

              def __mul__(self, other):
                  other = other if isinstance(other, Scale) else Scale(other)
                  return Scale(self.k * other.k)

              def __rmul__(self, other):
                  return self * other
        tests:
          - { call: '(Scale(2) * 3).k', expect: '6' }
          - { call: '(3 * Scale(2)).k', expect: '6' }
          - { call: '(Scale(2) * Scale(5)).k', expect: '10' }
        hints:
          - It's the same shape as adding, with `*` in place of `+`.

  - type: choice
    id: remember-eq
    kind: predict
    prompt: From the last lesson. What does this print?
    code: |
      class P:
          def __init__(self, x):
              self.x = x

      print(P(1) == P(1))
    choices: ['False', 'True', 'None', 'Error']
    answer: 'False'
    why: >-
      Without `__eq__`, `==` asks whether they're the same object, and these are two objects.

  - type: learn
    id: recap
    label: Recap
    title: What you know now
    body: >-
      `isinstance(x, C)` checks a type, and lets you wrap plain numbers. With a number on the left, Python tries `__rmul__` or `__radd__` on the right-hand object. `sum` starts from 0, so it needs `__radd__`. Order matters for `__rsub__`.


      Next: objects you can call like functions and index like lists, as you do with PyTorch's models and datasets.
