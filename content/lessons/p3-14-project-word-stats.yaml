id: p3-project-word-stats
track: ml
unit: 3
order: 14
kind: project
title: 'Project: Autocomplete'
summary: Build the word suggester from a phone keyboard, trained on Adam's diary. It's a tiny language model, made of lists and dictionaries.

cards:
  - type: project
    id: autocomplete
    brief: >-
      Your phone suggests the next word as you type. The simplest way to do that is to read a lot of text and remember, for every word, which words came right
      after it. Then, to suggest, pick the word that came after most often. That's a language model, a very small one. The big ones predict the next word too.


      You'll train one on Adam's diary. First the table of what follows what, then a suggester, then a "keep tapping the middle suggestion" game that writes a
      whole sentence. That gets stuck in a loop, like a real phone does. So the last step rolls dice instead, picking words in proportion to how often they
      followed. That's how chatbots avoid repeating themselves.


      The diary and the dice's seed are at the top of the code, and the checks will try other diaries and seeds.
    example: |
      Learned 11 words from a diary of 30.
      Keyboard: i like the hill . i like the hill
      Dice: i like the hill . i eat the hill
      Dice: i like the hill is steep . i climb
      Dice: i like the grass more
    starter: |
      import random

      seed = 11
      diary = "i climb the hill . i eat the grass . the grass is sweet . the hill is steep . i like the hill . i like the grass more"

      # Your functions go here.
    solution: |
      import random

      seed = 11
      diary = "i climb the hill . i eat the grass . the grass is sweet . the hill is steep . i like the hill . i like the grass more"


      def follows(words):
          table = {}
          for i in range(len(words) - 1):
              if words[i] not in table:
                  table[words[i]] = []
              table[words[i]].append(words[i + 1])
          return table


      def best_next(options):
          counts = {}
          for w in options:
              counts[w] = counts.get(w, 0) + 1
          best = options[0]
          for w in options:
              if counts[w] > counts[best]:
                  best = w
          return best


      def complete(table, word, n):
          out = [word]
          for i in range(n):
              if word not in table:
                  break
              word = best_next(table[word])
              out.append(word)
          return " ".join(out)


      def babble(table, word, n):
          out = [word]
          for i in range(n):
              if word not in table:
                  break
              word = random.choice(table[word])
              out.append(word)
          return " ".join(out)


      random.seed(seed)
      words = diary.split()
      table = follows(words)
      print(f"Learned {len(table)} words from a diary of {len(words)}.")
      print("Keyboard:", complete(table, "i", 8))
      for i in range(3):
          print("Dice:", babble(table, "i", 8))
    milestones:
      - title: What comes next
        goal: >-
          Write `follows(words)`. It takes a list of words and gives back a dictionary. Each key is a word, and its value is the list of every word that came
          straight after it, in order, repeats included. The last word has nothing after it.
        tests:
          - { call: "follows(['a', 'b', 'a', 'c'])", expect: "{'a': ['b', 'c'], 'b': ['a']}" }
          - { call: "follows(['to', 'be', 'or', 'not', 'to', 'be'])", expect: "{'to': ['be', 'be'], 'be': ['or'], 'or': ['not'], 'not': ['to']}" }
          - { call: "follows(['x'])", expect: '{}', hidden: true }
        hints:
          - Loop over the positions with `range(len(words) - 1)`, so `words[i + 1]` is always there.
          - The first time you see a word, give it an empty list. Then `.append` the next word to its list.
          - 'Inside the loop: `if words[i] not in table: table[words[i]] = []`, then `table[words[i]].append(words[i + 1])`.'
      - title: The best guess
        goal: >-
          Write `best_next(options)`, which gives back the word that appears most often in the list. If there's a tie, give back the one that appears first.
        tests:
          - { call: "best_next(['b', 'c', 'c'])", expect: "'c'" }
          - { call: "best_next(['x', 'y'])", expect: "'x'" }
          - { call: "best_next(['y', 'x', 'x', 'y', 'z'])", expect: "'y'", hidden: true }
          - { call: "best_next(['hill', 'grass', 'grass', 'hill', 'hill', 'grass'])", expect: "'hill'", hidden: true }
        hints:
          - Count with a dictionary first, the way you did in the counting lesson.
          - 'Then find the best: start with `best = options[0]` and only replace it when a count is bigger, not equal. That keeps the first one on a tie.'
      - title: Keep tapping the suggestion
        goal: >-
          Write `complete(table, word, n)`. Start with `word` and add the best next word, then the best word after that, up to `n` more words. Stop early if a
          word isn't in the table. Give back the words joined with spaces.
        tests:
          - { call: "complete({'i': ['like'], 'like': ['tea']}, 'i', 5)", expect: "'i like tea'" }
          - { call: "complete({'a': ['b', 'a', 'a']}, 'a', 3)", expect: "'a a a a'" }
          - { call: "complete({'a': ['b']}, 'z', 4)", expect: "'z'", hidden: true }
          - { call: "complete({'go': ['go']}, 'go', 2)", expect: "'go go go'", hidden: true }
        requires: ['name:best_next', 'name:join']
        scope: complete
        hints:
          - Keep a list of the words so far, starting with `[word]`. A `for` loop with `range(n)` takes up to `n` steps.
          - Each step, `break` if `word not in table`. Otherwise set `word = best_next(table[word])` and append it.
          - '`" ".join(out)` turns the list back into text.'
      - title: Roll the dice
        goal: >-
          Write `babble(table, word, n)`. It works like `complete`, but each next word is `random.choice(table[word])`. Call `random.choice` once per word.
          Words that followed more often are in the list more times, so they're picked more often.
        tests:
          - { call: "babble({'a': ['b'], 'b': ['a']}, 'a', 4)", expect: "'a b a b a'" }
          - { call: "babble({'a': ['b']}, 'a', 5)", expect: "'a b'" }
          - { call: "babble({}, 'hi', 3)", expect: "'hi'", hidden: true }
        requires: ['name:choice']
        scope: babble
        hints:
          - Copy `complete` and change one line.
          - '`word = random.choice(table[word])`'
      - title: Train it on the diary
        goal: >-
          Set the seed with `random.seed(seed)`. Split the diary into words, build the table, and print what it learned, then one keyboard sentence and three
          dice sentences, all starting from `"i"` with 8 more words, like the example.
        expectOutput: |
          Learned 11 words from a diary of 30.
          Keyboard: i like the hill . i like the hill
          Dice: i like the hill . i eat the hill
          Dice: i like the hill is steep . i climb
          Dice: i like the grass more
        vary: [{ seed: '4' }, { diary: '"i run . i jump . you run fast . i run fast"' }]
        hints:
          - '`len(table)` is the number of different words that have something after them. `len(words)` is the length of the whole diary.'
          - 'Call `random.seed(seed)` once, before any dice. Then `for i in range(3): print("Dice:", babble(table, "i", 8))`.'
