id: u2-shaping
track: ml
unit: 2
order: 5
title: Tuples, zip and comprehensions
summary: The short forms you'll see on every line of ML code.

cards:
  - type: learn
    id: unpacking
    title: Tuples, unpacking and zip
    body: >-
      A tuple is a fixed group of values, and unpacking pulls it apart. `zip` walks two lists side by side, and
      `enumerate` gives each item's position. Together they replace most index loops.
    code: |
      point = (3, 4)
      x, y = point
      print(x + y)

      for a, b in zip([1, 2], [10, 20]):
          print(a * b)

      for i, word in enumerate(["hi", "yo"]):
          print(i, word)
    subgoals:
      - { line: 2, label: Unpack a tuple }
      - { line: 5, label: Two lists side by side }
      - { line: 8, label: Position and item }
    predict: What does the `zip` loop print?

  - type: choice
    id: tuple-parens
    kind: predict
    prompt: What does this print?
    code: |
      a = (5)
      b = (5,)
      print(type(a).__name__, type(b).__name__)
    choices: ['int tuple', 'tuple tuple', 'int int', 'tuple int']
    answer: 'int tuple'
    why: >-
      Parentheses alone only group, so `(5)` is the number 5. The comma is what makes a tuple.

  - type: choice
    id: zip-short
    kind: predict
    prompt: What does this print?
    code: |
      total = 0
      for w, x in zip([2, 3], [10, 1]):
          total += w * x
      print(total)
    choices: ['23', '16', '60', '5']
    answer: '23'
    why: >-
      2 × 10 + 3 × 1 = 23. That's a dot product, which you'll see everywhere from now on.
    variants:
      - code: |
          total = 0
          for w, x in zip([1, 4], [5, 2]):
              total += w * x
          print(total)
        choices: ['13', '12', '40', '10']
        answer: '13'
        why: 1 × 5 + 4 × 2 = 13.
      - code: |
          total = 0
          for w, x in zip([2, 0, 1], [3, 9, 4]):
              total += w * x
          print(total)
        choices: ['10', '19', '27', '6']
        answer: '10'
        why: 2 × 3 + 0 × 9 + 1 × 4 = 10. A weight of 0 ignores that input.

  - type: choice
    id: set-order
    kind: predict
    prompt: What does this print?
    code: |
      letters = set("banana")
      print(len(letters), sorted(letters))
    choices: ["3 ['a', 'b', 'n']", "6 ['a', 'a', 'a', 'b', 'n', 'n']", "3 ['b', 'a', 'n']", 'Error']
    answer: "3 ['a', 'b', 'n']"
    why: >-
      A set keeps one of each and has no fixed order, so sort it if the order matters. Building the alphabet for makemore
      works just like this.

  - type: learn
    id: comprehensions
    title: Comprehensions build a new list
    body: >-
      A comprehension is an accumulator loop in one line: what to keep, what to loop over, and an optional filter. It makes a
      new list and leaves the original alone. Without brackets, inside `sum()` say, it's a generator expression.
    code: |
      nums = [1, 2, 3, 4]
      squares = [n * n for n in nums]
      evens = [n for n in nums if n % 2 == 0]
      lookup = {ch: i for i, ch in enumerate("abc")}
      print(squares, evens, lookup)
      print(sum(n * n for n in nums))
    subgoals:
      - { line: 2, label: Transform each item }
      - { line: 3, label: Keep some items }
      - { line: 4, label: Build a dict }
      - { line: 6, label: 'No list needed, just the sum' }
    predict: What does the last line print?

  - type: choice
    id: comp-original
    kind: predict
    prompt: What does this print?
    code: |
      nums = [1, 2]
      [n * 10 for n in nums]
      print(nums)
    choices: ['[1, 2]', '[10, 20]', 'None', 'Error']
    answer: '[1, 2]'
    why: >-
      A comprehension makes a new list. Nothing saved this one, and `nums` never changes.

  - type: parsons
    id: comp-order
    prompt: Order the lines to pair each word with its length, longer than 1 letter only.
    code: |
      words = ["a", "bb", "ccc"]
      pairs = [(w, len(w)) for w in words if len(w) > 1]
      print(pairs)
    distractors: ['pairs = [(w, len(w)) if len(w) > 1 for w in words]']
    expectOutput: "[('bb', 2), ('ccc', 3)]"
    why: >-
      A filter's `if` goes at the end, after the `for`.

  - type: blank
    id: dot
    prompt: Finish `dot(a, b)`, using `zip` inside `sum`.
    code: |
      def dot(a, b):
          return sum(x * y for x, y in ____)
    answers: [['zip(a, b)']]
    tests:
      - { call: 'dot([1, 2], [3, 4])', expect: '11' }
      - { call: 'dot([], [])', expect: '0' }
    why: >-
      `zip` pairs the items, the generator multiplies each pair, and `sum` adds them up.

  - type: fix
    id: filter-position
    prompt: '`positives` should keep only numbers above 0, but it crashes. Fix it.'
    code: |
      def positives(nums):
          return [n if n > 0 for n in nums]
    solution: |
      def positives(nums):
          return [n for n in nums if n > 0]
    tests:
      - { call: 'positives([1, -2, 3])', expect: '[1, 3]' }
      - { call: 'positives([-1])', expect: '[]' }
    why: >-
      A filter goes after the `for`. An `if` before the `for` needs an `else`, because it picks a value rather than filtering.
    hints:
      - Where does the `if` go when you're keeping only some items?

  - type: write
    id: char-index
    prompt: >-
      Write `char_to_index(text)`, which returns a dict of each distinct character, in sorted order, to its position.
      `"bab"` gives `{'a': 0, 'b': 1}`.
    starter: |
      def char_to_index(text):
          pass
    solution: |
      def char_to_index(text):
          return {ch: i for i, ch in enumerate(sorted(set(text)))}
    tests:
      - { call: 'char_to_index("bab")', expect: "{'a': 0, 'b': 1}" }
      - { call: 'char_to_index("")', expect: '{}' }
      - { call: 'char_to_index("cca")', expect: "{'a': 0, 'c': 1}", hidden: true }
    why: >-
      This exact line builds the vocabulary in makemore and GPT.
    hints:
      - '`set` removes repeats, `sorted` fixes the order, `enumerate` gives positions.'

  - type: explain
    id: what-comp
    prompt: What does this line produce, and how?
    code: |
      counts = {w: len(w) for w in ["hi", "hey"] if "e" in w}
      print(counts)
    model: >-
      It builds a dict from each word to its length, keeping only words containing "e", so it's `{'hey': 3}`.
    keyPoints:
      - Builds a dict
      - The `if` filters out "hi"
