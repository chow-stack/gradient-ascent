  - type: learn
    id: worked
    label: Worked example
    title: Mini-batches
    body: >-
      Real training doesn't use the whole dataset on every step. It takes a small random group of examples, called a mini-batch, updates the weights, and moves on to the next group. One pass through all the data is called an epoch.


      Here's the pattern. At the start of each epoch, make a new shuffled `order`. Then go through it in steps, using `range(0, n, batch_size)`. Each `start` gives a slice of positions, and those pick the rows. Slicing never fails at the end, so the last batch is just smaller.


      Every example is used exactly once per epoch, in a different order each time. That line, `X[batch]`, is everything you learned about picking by position. PyTorch's `DataLoader` does this for you later, but it does nothing more than this.
    code: |
      import numpy as np

      rng = np.random.default_rng(0)
      X = np.arange(14).reshape(7, 2)
      y = np.arange(7)
      n = len(X)
      batch_size = 3

      for epoch in range(2):
          order = rng.permutation(n)
          for start in range(0, n, batch_size):
              batch = order[start:start + batch_size]
              X_b, y_b = X[batch], y[batch]
              print(epoch, X_b.shape, y_b)
    subgoals:
      - { line: 9, label: 'One pass through the data' }
      - { line: 10, label: 'A new shuffle each epoch' }
      - { line: 11, label: 'Go through it in steps' }
      - { line: 12, label: 'The next group of positions' }
      - { line: 13, label: 'The same rows of both' }
    predict: How big will the last batch of each epoch be?

  - type: write
    id: write-split
    prompt: Write `shuffled_split(X, y, n_test, seed)`, which shuffles the rows using that seed, and gives back `X_train, y_train, X_test, y_test`, with the last `n_test` shuffled rows as the test set.
    starter: |
      import numpy as np

      def shuffled_split(X, y, n_test, seed):
          # Your code here
    solution: |
      import numpy as np

      def shuffled_split(X, y, n_test, seed):
          rng = np.random.default_rng(seed)
          order = rng.permutation(len(X))
          X, y = X[order], y[order]
          cut = len(X) - n_test
          return X[:cut], y[:cut], X[cut:], y[cut:]
    tests:
      - { call: 'shuffled_split(np.zeros((10, 2)), np.zeros(10), 3, 0)[0].shape', expect: '(7, 2)' }
      - { call: 'shuffled_split(np.zeros((10, 2)), np.zeros(10), 3, 0)[3].shape', expect: '(3,)' }
      - { call: '(lambda r: (r[0][:, 0] == r[1]).all() and (r[2][:, 0] == r[3]).all())(shuffled_split(np.arange(20).reshape(10, 2), np.arange(0, 20, 2), 3, 0))', expect: 'True', hidden: true }
      - { call: '(lambda r: r[1].tolist() != list(range(0, 14, 2)))(shuffled_split(np.arange(20).reshape(10, 2), np.arange(0, 20, 2), 3, 0))', expect: 'True', hidden: true }
    why: >-
      One order for both keeps the pairs together, and a fixed seed makes the split repeatable.
    hints:
      - Make one `order`, use it on both, and then slice.
      - The cut is at `len(X) - n_test`.
    variants:
      - prompt: Write `batches(n, batch_size, seed)`, which gives back a list of arrays of positions, one for each mini-batch, from one shuffled order. So `batches(5, 2, 0)` has 3 batches, of sizes 2, 2 and 1.
        starter: |
          import numpy as np

          def batches(n, batch_size, seed):
              # Your code here
        solution: |
          import numpy as np

          def batches(n, batch_size, seed):
              order = np.random.default_rng(seed).permutation(n)
              return [order[s:s + batch_size] for s in range(0, n, batch_size)]
        tests:
          - { call: '[len(b) for b in batches(5, 2, 0)]', expect: '[2, 2, 1]' }
          - { call: 'sorted(np.concatenate(batches(6, 4, 1)).tolist())', expect: '[0, 1, 2, 3, 4, 5]' }
        hints:
          - Step through the order with `range(0, n, batch_size)`.

  - type: choice
    id: remember-matmul
    kind: predict
    prompt: From the last lesson. What does this print?
    code: |
      import numpy as np
      print((np.ones((6, 4)) @ np.ones((4, 3))).shape)
    choices: ['(6, 3)', '(4, 4)', '(3, 6)', 'Error']
    answer: '(6, 3)'
    why: >-
      The inner numbers match and vanish, and the outer numbers remain.

  - type: learn
    id: recap
    label: Recap
    title: What you know now
    body: >-
      `default_rng(seed)` makes repeatable random numbers. `integers`, `random` and `normal` take a shape, and `permutation` gives a shuffled order. Use one order for both inputs and labels. `concatenate` extends an axis, and `stack` adds one. A mini-batch is a slice of a shuffled order.


      Next: seeing your numbers, with plots.
