  - type: fix
    id: fix-shuffle
    requires: ['name:default_rng', 'name:arange', 'op:*']
    prompt: This shuffle should keep each `x` with its `y`, so it should show `True`. Fix it.
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      x = np.arange(20)
      y = x * 2
      x_s = x[rng.permutation(20)]
      y_s = y[rng.permutation(20)]
      print((y_s == x_s * 2).all())
    solution: |
      import numpy as np
      rng = np.random.default_rng(0)
      x = np.arange(20)
      y = x * 2
      order = rng.permutation(20)
      x_s = x[order]
      y_s = y[order]
      print((y_s == x_s * 2).all())
    highlightLine: 5
    expectOutput: 'True'
    why: >-
      One order for both keeps the pairs together.
    hints:
      - How many different orders does this make?
    variants:
      - prompt: These should be two different draws, so this should show `False`. But the generator gets recreated each time. Fix it.
        code: |
          import numpy as np

          def draw():
              rng = np.random.default_rng(0)
              return rng.random()

          print(draw() == draw())
        solution: |
          import numpy as np

          rng = np.random.default_rng(0)

          def draw():
              return rng.random()

          print(draw() == draw())
        highlightLine: 4
        expectOutput: 'False'
        why: >-
          Make the generator once, and keep using it.
        hints:
          - The same seed restarts the same sequence.
        requires: ['def', 'return', 'name:default_rng']
      - prompt: These dice rolls should include a 6, so this should show `6`, but the highest is always 5. Fix it.
        code: |
          import numpy as np
          rng = np.random.default_rng(0)
          rolls = rng.integers(1, 6, size=1000)
          print(rolls.max())
        solution: |
          import numpy as np
          rng = np.random.default_rng(0)
          rolls = rng.integers(1, 7, size=1000)
          print(rolls.max())
        highlightLine: 3
        expectOutput: '6'
        why: >-
          `integers` stops before the end, like `range`.
        hints:
