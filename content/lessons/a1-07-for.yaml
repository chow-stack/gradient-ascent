id: a1-for
track: ml
unit: 1
order: 7
title: for loops and range
summary: Loop over things directly. range() for counting.

cards:
  - type: learn
    id: for-range
    title: for goes over things
    body: >-
      Python's `for` walks over the items of something: a range of numbers, the letters of a string, a
      list. `range(n)` counts 0 up to n−1, like Java's `for (int i = 0; i < n; i++)`.


      `range(start, stop, step)` gives more control. The stop number is never included.
    code: |
      for i in range(3):
          print(i)

      for letter in "hey":
          print(letter)
    java: |
      for (int i = 0; i < 3; i++) {
          System.out.println(i);
      }
      for (char letter : "hey".toCharArray()) {
          System.out.println(letter);
      }
    subgoals:
      - { line: 1, label: Count with range }
      - { line: 4, label: Loop over a string directly }
    predict: What's the last number the first loop prints?

  - type: choice
    id: range-step
    kind: predict
    prompt: What does this print?
    code: |
      print(list(range(2, 10, 3)))
    choices: ['[2, 5, 8]', '[2, 5, 8, 11]', '[3, 6, 9]', '[2, 4, 6, 8]']
    answer: '[2, 5, 8]'
    why: >-
      Start at 2, step by 3, stop before 10: 2, 5, 8. (`list()` turns the range into a list so you can
      see it.)

  - type: choice
    id: stars
    kind: predict
    prompt: What does this print?
    code: |
      for i in range(1, 4):
          print(i * "*")
    choices: ["*\n**\n***", "*\n**\n***\n****", "**\n***\n****", '***']
    answer: "*\n**\n***"
    why: >-
      `range(1, 4)` is 1, 2, 3, and a string times a number repeats it.

  - type: choice
    id: countdown-range
    prompt: Which loop prints 10, 8, 6, 4, 2?
    choices:
      - 'for i in range(10, 0, -2):'
      - 'for i in range(10, 2, -2):'
      - 'for i in range(2, 10, 2):'
      - 'for i in range(10, 0, 2):'
    answer: 'for i in range(10, 0, -2):'
    why: >-
      A negative step counts down. The stop (0) is excluded, so 2 is the last value. `range(10, 2, -2)`
      would stop before 2.
    hints:
      - The stop value is never included.

  - type: parsons
    id: vowels
    prompt: Order the lines to count the vowels in "mountain" (it should print `4`).
    code: |
      word = "mountain"
      count = 0
      for ch in word:
          if ch in "aeiou":
              count += 1
      print(count)
    distractors: ['    count = 0']
    expectOutput: '4'
    why: >-
      Start the count before the loop. `ch in "aeiou"` asks whether the letter appears in that string.
      Resetting `count` inside the loop would throw away the progress.

  - type: blank
    id: sum-100
    prompt: Fill in the stop value so it adds 1 through 100 (the answer is 5050).
    code: |
      total = 0
      for n in range(1, ____):
          total += n
      print(total)
    answers: [['101']]
    expectOutput: '5050'
    why: >-
      The stop is excluded, so to include 100 you stop at 101.

  - type: fix
    id: sum-to
    prompt: '`sum_to(3)` should be 1 + 2 + 3 = 6. Fix the range.'
    code: |
      def sum_to(n):
          total = 0
          for i in range(n):
              total += i
          return total
    solution: |
      def sum_to(n):
          total = 0
          for i in range(1, n + 1):
              total += i
          return total
    highlightLine: 3
    tests:
      - { call: sum_to(3), expect: '6' }
      - { call: sum_to(1), expect: '1' }
      - { call: sum_to(10), expect: '55', hidden: true }
    why: >-
      `range(n)` is 0 to n−1. You need 1 to n, which is `range(1, n + 1)`.
    hints:
      - Which numbers does `range(3)` actually give?

  - type: write
    id: factorial
    prompt: Write `factorial(n)`, which returns 1 × 2 × … × n. `factorial(0)` is 1.
    starter: |
      def factorial(n):
          pass
    solution: |
      def factorial(n):
          result = 1
          for i in range(2, n + 1):
              result *= i
          return result
    tests:
      - { call: factorial(5), expect: '120' }
      - { call: factorial(1), expect: '1' }
      - { call: factorial(0), expect: '1', hidden: true }
      - { call: factorial(10), expect: '3628800', hidden: true }
    hints:
      - Start a result at 1 (not 0, or everything becomes 0).
      - Multiply it by each number from 1 to n.

  - type: explain
    id: index-loop
    prompt: What does this print?
    code: |
      word = "goat"
      for i in range(len(word)):
          print(i, word[i])
    model: >-
      It loops over every position in the word and prints each index with its letter: 0 g, 1 o, 2 a,
      3 t, one per line.
    keyPoints:
      - '`range(len(word))` gives the indexes 0 to 3'
      - '`word[i]` is the letter at that index'
