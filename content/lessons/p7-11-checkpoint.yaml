        solution: |
          import numpy as np

          def sigmoid(z):
              return 1 / (1 + np.exp(-z))

          def step(X, y, w, b, lr):
              p = sigmoid(X @ w + b)
              w = w - lr * X.T @ (p - y) / len(y)
              b = b - lr * np.mean(p - y)
              return w, b
        highlightLine: 8
        tests:
          - {
              call: 'step(np.array([[1.0], [2.0]]), np.array([1.0, 0.0]), np.array([0.0]), 0.0, 1.0)',
