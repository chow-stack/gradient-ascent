id: a1-lists
track: ml
unit: 1
order: 8
title: Lists
summary: Python's ArrayList, with slicing, and two names for one list.

cards:
  - type: learn
    id: basics
    title: Lists are ArrayLists with better syntax
    body: >-
      A list is ordered and grows as you add to it. `.append()` adds to the end, `[-1]` is the last
      item, `len()` is the size, and slices work just like strings.
    code: |
      nums = [4, 8, 15]
      nums.append(16)
      print(nums)
      print(nums[0], nums[-1])
      print(len(nums))
      print(nums[1:3])
    java: |
      ArrayList<Integer> nums = new ArrayList<>(List.of(4, 8, 15));
      nums.add(16);
      System.out.println(nums);
      System.out.println(nums.get(0) + " " + nums.get(nums.size() - 1));
      System.out.println(nums.size());
      System.out.println(nums.subList(1, 3));
    subgoals:
      - { line: 1, label: Make a list }
      - { line: 2, label: Add to the end }
      - { line: 4, label: Read by index }
      - { line: 6, label: Slice }
    predict: What does `nums[1:3]` print?

  - type: choice
    id: alias
    kind: predict
    prompt: What does this print?
    code: |
      a = [1, 2, 3]
      b = a
      b.append(4)
      print(a)
    choices: ['[1, 2, 3, 4]', '[1, 2, 3]', '[4]', 'Error']
    answer: '[1, 2, 3, 4]'
    why: >-
      `b = a` does not copy the list. Both names point at the same list, so changing it through `b`
      shows up in `a`. To copy, use `b = a.copy()`. (Java objects behave the same way.)
    hints:
      - Is there one list here, or two?

  - type: choice
    id: sort
    kind: predict
    prompt: What does this print?
    code: |
      nums = [3, 1, 2]
      nums.sort()
      print(nums[-1])
    choices: ['3', '2', '1', '[1, 2, 3]']
    answer: '3'
    why: >-
      `.sort()` sorts the list in place to [1, 2, 3], and `[-1]` is the last item.

  - type: choice
    id: concat
    kind: predict
    prompt: What does this print?
    code: |
      print([1, 2] + [3])
    choices: ['[1, 2, 3]', '[1, 2, [3]]', '[4, 2]', 'Error']
    answer: '[1, 2, 3]'
    why: >-
      `+` joins two lists into a new one, like it joins strings.

  - type: parsons
    id: squares
    prompt: Order the lines to build the list of squares 1 through 25.
    code: |
      squares = []
      for n in range(1, 6):
          squares.append(n * n)
      print(squares)
    distractors: ['    squares = n * n']
    expectOutput: '[1, 4, 9, 16, 25]'
    why: >-
      Start with an empty list, then `.append()` one value per pass. Assigning `squares = n * n` would
      throw the list away.

  - type: blank
    id: last-item
    prompt: Make `last` return the final item of any non-empty list.
    code: |
      def last(items):
          return items[____]
    answers: [['-1', 'len(items) - 1', 'len(items)-1']]
    tests:
      - { call: 'last([1, 2, 3])', expect: '3' }
      - { call: 'last(["a"])', expect: "'a'" }
    why: >-
      Negative indexes count from the end; `-1` is the last item.

  - type: fix
    id: max-negatives
    prompt: '`max_of` works for positive numbers but fails for `[-5, -2, -9]`. Fix it.'
    code: |
      def max_of(nums):
          best = 0
          for n in nums:
              if n > best:
                  best = n
          return best
    solution: |
      def max_of(nums):
          best = nums[0]
          for n in nums:
              if n > best:
                  best = n
          return best
    highlightLine: 2
    tests:
      - { call: 'max_of([3, 9, 2])', expect: '9' }
      - { call: 'max_of([-5, -2, -9])', expect: '-2' }
    why: >-
      Starting at 0 means a list of negatives never beats it. Start with the first item instead.
    hints:
      - If every number is negative, can any of them be greater than the starting `best`?

  - type: write
    id: evens
    prompt: Write `evens(nums)` that returns a new list with only the even numbers, in order.
    starter: |
      def evens(nums):
          pass
    solution: |
      def evens(nums):
          result = []
          for n in nums:
              if n % 2 == 0:
                  result.append(n)
          return result
    tests:
      - { call: 'evens([1, 2, 3, 4])', expect: '[2, 4]' }
      - { call: 'evens([])', expect: '[]' }
      - { call: 'evens([7, 9])', expect: '[]', hidden: true }
      - { call: 'evens([0, -2, 5])', expect: '[0, -2]', hidden: true }
    hints:
      - Start with an empty list and `.append()` the ones that pass a test.
      - A number is even when `n % 2 == 0`.

  - type: explain
    id: reverse
    prompt: What does this function return for `[1, 2, 3]`, and how?
    code: |
      def mystery(items):
          result = []
          for x in items:
              result = [x] + result
          return result
    model: >-
      It returns the list reversed, `[3, 2, 1]`, by putting each item in front of everything collected
      so far.
    keyPoints:
      - '`[x] + result` puts x at the front'
      - The last item ends up first
