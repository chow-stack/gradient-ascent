id: p4-project-vec
track: ml
unit: 4
order: 16
kind: project
title: 'Project: Mini PyTorch'
summary: Build your own tiny version of PyTorch's layers, then wire a network by hand that solves a puzzle a single layer can't.

cards:
  - type: project
    id: mini-torch
    brief: >-
      In PyTorch, a network is made of layers. Each layer is an object you can call like a function, and a `Sequential` stacks them so data flows through one
      after another. You'll build those pieces yourself, with the classes, special methods and errors from this unit. Later, when you use the real thing,
      you'll know what's inside.


      Then you'll put them to work on XOR. XOR gives 1 when exactly one of its two inputs is 1. A single layer can't do it, which stalled neural network
      research for years. Two layers with a ReLU between them can, and you'll set the weights by hand. Usually training finds them, and that's the next unit's
      job.


      A layer works on a plain list of numbers. `Linear` has one row of weights for each output. Each output is its row times the input, added up, plus that
      output's bias.
    example: |
      Sequential(Linear(2 -> 2), ReLU(), Linear(2 -> 1))
      0 xor 0 = 0
      0 xor 1 = 1
      1 xor 0 = 1
      1 xor 1 = 0
      Caught: expected 2 inputs, got 3
    starter: |
      # Your classes go here: Module, Linear, ReLU and Sequential.
    solution: |
      class Module:
          def __call__(self, x):
              return self.forward(x)


      class Linear(Module):
          def __init__(self, weights, bias):
              self.weights = weights
              self.bias = bias

          def forward(self, x):
              if len(x) != len(self.weights[0]):
                  raise ValueError(f"expected {len(self.weights[0])} inputs, got {len(x)}")
              return [sum([w * v for w, v in zip(row, x)]) + b for row, b in zip(self.weights, self.bias)]

          def __repr__(self):
              return f"Linear({len(self.weights[0])} -> {len(self.weights)})"


      class ReLU(Module):
          def forward(self, x):
              return [max(0, v) for v in x]

          def __repr__(self):
              return "ReLU()"


      class Sequential(Module):
          def __init__(self, layers):
              self.layers = layers

          def forward(self, x):
              for layer in self.layers:
                  x = layer(x)
              return x

          def __len__(self):
              return len(self.layers)

          def __getitem__(self, i):
              return self.layers[i]

          def __repr__(self):
              return "Sequential(" + ", ".join([repr(layer) for layer in self.layers]) + ")"


      net = Sequential([Linear([[1, 1], [1, 1]], [0, -1]), ReLU(), Linear([[1, -2]], [0])])
      print(net)
      for a, b in [(0, 0), (0, 1), (1, 0), (1, 1)]:
          print(f"{a} xor {b} = {net([a, b])[0]}")
      try:
          net([1, 0, 1])
      except ValueError as e:
          print("Caught:", e)
    milestones:
      - title: A layer you can call
        goal: >-
          Write a `Module` class whose `__call__(self, x)` gives back `self.forward(x)`. Then write `Linear(weights, bias)`, a subclass of `Module` with a
          `forward` method. Calling a `Linear` on a list gives back one number per row of weights.
        tests:
          - { call: 'Linear([[1, 2]], [3])([10, 20])', expect: '[53]' }
          - { call: 'Linear([[1, 0], [0, 1]], [0, 1])([4, 5])', expect: '[4, 6]' }
          - { call: 'issubclass(Linear, Module)', expect: 'True' }
          - { call: "'forward' in Linear.__dict__ and '__call__' in Module.__dict__", expect: 'True', hidden: true }
          - { call: 'Linear([[2, 0, 1], [0, 0, 0]], [1, 5])([3, 4, 5])', expect: '[12, 5]', hidden: true }
        hints:
          - '`Module` only needs `__call__`. The subclass supplies `forward`, which is where the maths happens.'
          - For each row of weights, and its bias, `zip(row, x)` pairs each weight with its input. Multiply the pairs and add them up.
          - '`return [sum([w * v for w, v in zip(row, x)]) + b for row, b in zip(self.weights, self.bias)]`'
      - title: ReLU
        goal: Write `ReLU`, a `Module` whose `forward` turns every negative number into 0 and leaves the rest alone.
        tests:
          - { call: 'ReLU()([-2, 0, 3])', expect: '[0, 0, 3]' }
          - { call: 'issubclass(ReLU, Module)', expect: 'True' }
          - { call: 'ReLU()([-0.5, 7, -9])', expect: '[0, 7, 0]', hidden: true }
        hints:
          - '`max(0, v)` is `v` if it''s positive and 0 otherwise.'
          - A list comprehension does the whole list in one line.
      - title: Stack them
        goal: >-
          Write `Sequential(layers)`, a `Module` holding a list of layers. Its `forward` passes the input through each layer in turn. Make `len()` give the
          number of layers and `[i]` give layer `i`.
        tests:
          - { call: 'Sequential([Linear([[2]], [0]), Linear([[3]], [1])])([5])', expect: '[31]' }
          - { call: 'len(Sequential([ReLU(), ReLU(), ReLU()]))', expect: '3' }
          - { call: 'type(Sequential([ReLU(), Linear([[1]], [0])])[1]).__name__', expect: "'Linear'" }
          - { call: 'Sequential([Linear([[1], [-1]], [0, 0]), ReLU()])([4])', expect: '[4, 0]', hidden: true }
        hints:
          - In `forward`, loop over the layers and replace `x` with `layer(x)` each time. Calling works because every layer is a `Module`.
          - '`__len__` and `__getitem__` can hand the work to the list: `return len(self.layers)` and `return self.layers[i]`.'
      - title: Nice names and a clear error
        goal: >-
          Give each class a `__repr__`: `Linear(2 -> 3)` for 2 inputs and 3 outputs, `ReLU()`, and `Sequential(...)` with its layers inside, separated by
          commas. Then make `Linear` raise a `ValueError` saying `expected 2 inputs, got 3` when the input has the wrong length.
        tests:
          - { call: 'repr(Linear([[1, 2], [3, 4], [5, 6]], [0, 0, 0]))', expect: "'Linear(2 -> 3)'" }
          - { call: 'repr(ReLU())', expect: "'ReLU()'" }
          - { call: 'repr(Sequential([ReLU(), Linear([[1, 1, 1]], [0])]))', expect: "'Sequential(ReLU(), Linear(3 -> 1))'" }
          - { call: 'repr(Sequential([]))', expect: "'Sequential()'", hidden: true }
        requires: ['raise']
        scope: Linear
        hints:
          - The number of inputs is the length of one row, `len(self.weights[0])`. The number of outputs is the number of rows.
          - '`", ".join(...)` of each layer''s `repr` builds the inside of `Sequential(...)`.'
          - 'At the start of `Linear.forward`: `if len(x) != len(self.weights[0]): raise ValueError(f"expected ... inputs, got ...")`.'
      - title: Solve XOR
        goal: >-
          Build `net`: a `Linear` from 2 inputs to 2, a `ReLU`, and a `Linear` from 2 to 1. The first layer's weights are all 1, with biases 0 and -1. The last
          layer's weights are 1 and -2, with bias 0. Print `net`, the four XOR lines, and the error you get from giving it three inputs, like the example.
        tests:
          - { call: 'net([0, 1])', expect: '[1]' }
          - { call: 'len(net)', expect: '3' }
          - { call: 'net([1, 1])', expect: '[0]', hidden: true }
        expectOutput: |
          Sequential(Linear(2 -> 2), ReLU(), Linear(2 -> 1))
          0 xor 0 = 0
          0 xor 1 = 1
          1 xor 0 = 1
          1 xor 1 = 0
          Caught: expected 2 inputs, got 3
        hints:
          - '`net = Sequential([Linear([[1, 1], [1, 1]], [0, -1]), ReLU(), Linear([[1, -2]], [0])])`'
          - '`net([a, b])` gives a list with one number in it, so take `[0]` when you print.'
          - Wrap `net([1, 0, 1])` in `try`, and in `except ValueError as e:` print `"Caught:"` and `e`.
