id: a1-dicts
track: ml
unit: 1
order: 9
title: Dictionaries
summary: Python's HashMap. Keys to values, and the counting trick.

cards:
  - type: learn
    id: basics
    title: Dicts are HashMaps
    body: >-
      A dict maps keys to values. Read and write with `d[key]`, and loop over pairs with `.items()`.
      Dicts remember the order you added things.
    code: |
      ages = {"adam": 4, "eve": 6}
      ages["luna"] = 2
      print(ages["adam"])
      print(len(ages))
      for name, age in ages.items():
          print(name, age)
    java: |
      HashMap<String, Integer> ages = new HashMap<>();
      ages.put("adam", 4);
      ages.put("eve", 6);
      ages.put("luna", 2);
      System.out.println(ages.get("adam"));
      System.out.println(ages.size());
      for (var e : ages.entrySet()) {
          System.out.println(e.getKey() + " " + e.getValue());
      }
    subgoals:
      - { line: 1, label: Make a dict }
      - { line: 2, label: Add a key }
      - { line: 5, label: Loop over key-value pairs }
    predict: In what order do the names print?

  - type: choice
    id: overwrite
    kind: predict
    prompt: What does this print?
    code: |
      d = {"a": 1}
      d["a"] = 5
      d["b"] = 2
      print(d)
    choices: ["{'a': 5, 'b': 2}", "{'a': 1, 'b': 2}", "{'a': 1, 'a': 5, 'b': 2}", 'Error']
    answer: "{'a': 5, 'b': 2}"
    why: >-
      Keys are unique. Assigning to an existing key replaces its value.

  - type: choice
    id: missing-key
    prompt: "`stock = {'rope': 3}`. What happens with `stock['tent']`?"
    choices: ['It raises a KeyError', 'It gives None', 'It gives 0', "It gives ''"]
    answer: 'It raises a KeyError'
    why: >-
      Unlike Java's `get()` returning null, a missing key crashes. Use `stock.get('tent', 0)` to get a
      default instead.

  - type: choice
    id: get-default
    kind: predict
    prompt: What does this print?
    code: |
      stock = {"rope": 3}
      print(stock.get("tent", 0))
    choices: ['0', 'None', 'KeyError', '3']
    answer: '0'
    why: >-
      `.get(key, default)` returns the default when the key isn't there.

  - type: parsons
    id: word-count
    prompt: "Order the lines to count each word (it should print `{'up': 3, 'down': 1}`)."
    code: |
      words = ["up", "down", "up", "up"]
      counts = {}
      for w in words:
          counts[w] = counts.get(w, 0) + 1
      print(counts)
    distractors: ['    counts[w] = 1']
    expectOutput: "{'up': 3, 'down': 1}"
    why: >-
      `counts.get(w, 0) + 1` means "whatever it was so far (or 0), plus one". This counting pattern is
      everywhere.

  - type: blank
    id: items
    prompt: Fill in the method that loops over keys and values together.
    code: |
      prices = {"rope": 12, "tent": 80}
      for item, price in prices.____():
          print(item, price)
    answers: [['items']]
    expectOutput: |
      rope 12
      tent 80
    why: >-
      `.items()` gives (key, value) pairs. `.keys()` and `.values()` give just one side.

  - type: fix
    id: wrong-key
    prompt: "`total_value` should multiply each item's count by its price. Fix the crash."
    code: |
      def total_value(stock, prices):
          total = 0
          for item in stock:
              total += stock[item] * prices[stock]
          return total
    solution: |
      def total_value(stock, prices):
          total = 0
          for item in stock:
              total += stock[item] * prices[item]
          return total
    highlightLine: 4
    tests:
      - { call: 'total_value({"rope": 2}, {"rope": 5})', expect: '10' }
      - { call: 'total_value({"a": 1, "b": 3}, {"a": 2, "b": 1})', expect: '5' }
    why: >-
      Looping over a dict gives its keys. The price lookup needs the key (`item`), not the whole dict.
    hints:
      - In `prices[...]`, what should go in the brackets?

  - type: write
    id: letter-counts
    prompt: Write `letter_counts(word)` that returns a dict of how many times each letter appears.
    starter: |
      def letter_counts(word):
          pass
    solution: |
      def letter_counts(word):
          counts = {}
          for ch in word:
              counts[ch] = counts.get(ch, 0) + 1
          return counts
    tests:
      - { call: 'letter_counts("aab")', expect: "{'a': 2, 'b': 1}" }
      - { call: 'letter_counts("")', expect: '{}' }
      - { call: 'letter_counts("goat")', expect: "{'g': 1, 'o': 1, 'a': 1, 't': 1}", hidden: true }
    hints:
      - Same pattern as the word counter, with letters.

  - type: explain
    id: invert
    prompt: What does `invert` do?
    code: |
      def invert(d):
          out = {}
          for k, v in d.items():
              out[v] = k
          return out
    model: >-
      It swaps keys and values: `invert({"a": 1})` returns `{1: "a"}`. If two keys share a value, the
      later one wins.
    keyPoints:
      - Each value becomes a key pointing back at its old key
      - Duplicate values overwrite each other
