id: p3-floats
track: ml
unit: 3
order: 12
title: Numbers that don't quite add up
summary: Why 0.1 + 0.2 isn't 0.3, and how to compare and show decimals.

cards:
  - type: learn
    id: goal
    label: The goal
    title: Computers round
    body: >-
      Everything in machine learning is calculated with decimals, and decimals in a computer are only approximate. It's easy to lose hours to this if you don't know about it.


      By the end of this lesson you'll understand why `0.1 + 0.2` doesn't equal `0.3`, you'll be able to compare decimals safely, and you'll be able to display them neatly. This also finishes the Python basics.

  - type: learn
    id: why
    title: 0.1 + 0.2
    body: >-
      Try it. `0.1 + 0.2` gives `0.30000000000000004`. It isn't a bug in Python, and every language that uses standard floats does the same.


      A float is stored in binary, in a fixed amount of space. Some decimals have no exact binary form, just as 1/3 has no exact decimal form: you'd write 0.3333... forever and have to stop somewhere. 0.1 is one of those numbers, so what's stored is extremely close to 0.1, but not exactly it. These tiny errors can show up when you add things.


      Whole numbers don't have this problem. In Python, an `int` is always exact, however big it gets. So if you can count something in whole numbers, like cents rather than dollars, you should.
    deeper: >-
      A standard float has about 15–17 digits of precision, and it can get very large or very small. ML often uses 32-bit floats, which have only about 7 digits, to save memory and run faster on a GPU. That's plenty for neural networks, because they don't need exact numbers. But very small numbers can round down to 0, which is one reason models add up log probabilities and don't multiply probabilities directly.
    code: |
      print(0.1 + 0.2)
      print(0.1 + 0.2 == 0.3)
      print(0.5 + 0.25 == 0.75)
      print(10 ** 20 + 1)
      print(1e-3)
      print(2e3)
    subgoals:
      - { line: 1, label: 'Very close, but not exact' }
      - { line: 2, label: 'So == fails' }
      - { line: 3, label: 'Halves and quarters are exact in binary' }
      - { line: 4, label: 'Whole numbers stay exact' }
      - { line: 5, label: 'Scientific notation: 1 × 10⁻³, as in a learning rate' }
    predict: What will `0.1 + 0.2 == 0.3` show?

  - type: choice
    id: float-trace
    kind: predict
    prompt: What does this print?
    code: |
      print(0.1 + 0.2 == 0.3)
    choices: ['False', 'True', '0.3', 'Error']
    answer: 'False'
    why: >-
      `0.1 + 0.2` is very slightly above 0.3, and `==` checks for an exact match.
    variants:
      - code: |
          print(1 + 2 == 3)
        choices: ['True', 'False', '3', 'Error']
        answer: 'True'
        why: >-
          Whole numbers are exact.
      - code: |
          print(1e2)
        choices: ['100.0', '100', '12', '1e2']
        answer: '100.0'
        why: >-
          `e2` means times 10 squared. This way of writing a number always gives a float.
      - code: |
          print(0.5 + 0.5 == 1.0)
        choices: ['True', 'False', '1', 'Error']
        answer: 'True'
        why: >-
          0.5 is exact in binary. Not every decimal is inexact, which is why this bug can hide.

  - type: learn
    id: compare
    title: Comparing floats safely
    body: >-
      The rule: don't use `==` to compare calculated floats. It might work today and fail tomorrow with slightly different numbers. Ask whether they're close enough instead.


      `abs(a - b) < 1e-9` asks whether the difference is tiny, and `math.isclose(a, b)` does the same with sensible defaults. How close is close enough depends on the problem, and that small number is called a tolerance. Vectors in the next unit's project compare with one too.


      The same goes for loop conditions. `while x != 1.0:` might never end, if `x` steps over 1.0 by a tiny amount and never lands on it. So use `while x < 1.0:`, and you can't miss.
    code: |
      import math
      a = 0.1 + 0.2
      print(abs(a - 0.3) < 1e-9)
      print(math.isclose(a, 0.3))

      x = 0
      steps = 0
      while x < 1.0:
          x += 0.1
          steps += 1
      print(steps, x)
    subgoals:
      - { line: 3, label: 'Is the difference tiny?' }
      - { line: 4, label: 'The same, ready-made' }
      - { line: 8, label: 'Use < rather than !=' }
      - { line: 11, label: 'Surprising, and now you know why' }
    predict: After ten steps of 0.1, is `x` exactly 1.0?

  - type: choice
    id: compare-trace
    kind: predict
    prompt: What does this print?
    code: |
      a = 0.1 * 3
      print(abs(a - 0.3) < 0.001)
    choices: ['True', 'False', '0.3', 'Error']
    answer: 'True'
    why: >-
      The difference is tiny, far below the tolerance.
    variants:
      - code: |
          import math
          print(math.isclose(1.0, 1.1))
        choices: ['False', 'True', '0.1', 'Error']
        answer: 'False'
        why: >-
          `isclose` allows only a tiny difference, and 0.1 is a long way past it.
      - code: |
          total = 0
          for i in range(3):
              total += 0.1
          print(total == 0.3, round(total, 2) == 0.3)
        choices: ['False True', 'True True', 'False False', 'True False']
        answer: 'False True'
        why: >-
          The sum is very slightly off, and rounding it makes it match.

  - type: explain
    id: explain-tolerance
    prompt: This is meant to check that a calculation came out as 0.7. Why might it give the wrong answer, and what would you write instead?
    code: |
      result = 0.1 + 0.6
      print(result == 0.7)
    model: >-
      Decimals like these can't be stored exactly in binary, so a calculated result can differ very slightly from 0.7, and `==` needs an exact match. Use `abs(result - 0.7) < 1e-9`, or `math.isclose`.
    keyPoints:
      - Floats are approximate, so a calculated value can differ very slightly
      - Compare with a tolerance, using `abs(a - b) < 1e-9` or `math.isclose`

  - type: learn
    id: format
    title: Showing decimals neatly
    body: >-
      Long decimals are noise when you're reading results. `round(x, 2)` gives you a new number, rounded to two places. It's fine for displaying, but don't round in the middle of a calculation, because you'd be throwing away accuracy that you'll want later.


      f-strings have a neater way of doing this. `f"{x:.2f}"` shows `x` with exactly two decimal places. It only affects the text, and `x` itself doesn't change. It also keeps trailing zeros, so `2.5` shows as `2.50`, and columns of numbers line up.


      The part after the colon is a format. `{x:.4f}` gives four places, and `{x:.1%}` shows a fraction as a percentage. `{x:.2e}` uses scientific notation. A training log nearly always uses these, like `f"step {i} loss {loss:.4f}"`.
    code: |
      x = 2 / 3
      print(x)
      print(round(x, 2))
      print(f"{x:.2f}")
      print(f"{2.5:.2f}")
      print(f"{0.875:.1%}")
      print(f"step {3} loss {0.12345:.4f}")
    subgoals:
      - { line: 2, label: 'All the digits' }
      - { line: 3, label: 'A new, rounded number' }
      - { line: 4, label: 'Only the text changes' }
      - { line: 5, label: 'Keeps trailing zeros' }
      - { line: 6, label: 'As a percentage' }
      - { line: 7, label: 'A typical training log' }
    predict: What will `f"{2.5:.2f}"` show?

  - type: blank
    id: fill-format
    prompt: Fill in the blank so this shows `3.14`.
    code: |
      x = 3.14159
      print(f"{x:____}")
    answers: [['.2f']]
    expectOutput: '3.14'
    why: >-
      `.2f` means a float with two decimal places.
    variants:
      - prompt: Fill in the blank so this safely compares the two values, and shows `True`.
        code: |
          a = 0.1 + 0.2
          print(abs(a - 0.3) ____ 1e-9)
        answers: [['<', '<=']]
        expectOutput: 'True'
        why: >-
          The difference has to be below the tolerance.
      - prompt: Fill in the blank to write one thousandth in scientific notation, so this shows `0.001`.
        code: |
          lr = ____
          print(lr)
        answers: [['1e-3', '1E-3', '0.001']]
        expectOutput: '0.001'
        why: >-
          `1e-3` is how learning rates are usually written.

  - type: fix
    id: fix-compare
    prompt: '`is_third(0.1 * 3)` should give back `True`, but it gives back `False`. Fix it so it uses a tolerance of `1e-9`.'
    code: |
      def is_third(x):
          return x == 0.3
    solution: |
      def is_third(x):
          return abs(x - 0.3) < 1e-9
    highlightLine: 2
    tests:
      - { call: is_third(0.1 * 3), expect: 'True' }
      - { call: is_third(0.31), expect: 'False' }
    why: >-
      Compare the size of the difference, and not the exact values.
    hints:
      - What does `abs(a - b)` tell you?
    variants:
      - prompt: This never ends, because `x` steps over `1.0` without ever equalling it. Fix the condition so it shows `Done`.
        code: |
          x = 0
          while x != 1.0:
              x += 0.1
          print("Done")
        solution: |
          x = 0
          while x < 1.0:
              x += 0.1
          print("Done")
        highlightLine: 2
        tests: []
        expectOutput: Done
        why: >-
          With `<`, the loop can't step past the end without stopping.
        hints:
          - Which comparison stops once `x` has reached or passed 1.0?
        requires: ['while', 'op:+']
      - prompt: This should show `Mean 2.50`, with two decimal places, but it shows `Mean 2.5`. Fix the f-string.
        code: |
          m = 5 / 2
          print(f"Mean {m}")
        solution: |
          m = 5 / 2
          print(f"Mean {m:.2f}")
        highlightLine: 2
        tests: []
        expectOutput: Mean 2.50
        why: >-
          `:.2f` keeps exactly two places, including trailing zeros.
        hints:
          - What goes after the colon in the braces?
        requires: ['op:/']

  - type: learn
    id: worked
    label: Worked example
    title: A stopping rule
    body: >-
      Here's a real use for a tolerance. Training often stops when the loss has stopped improving. You can't check that two losses are equal, because they almost never will be, and you can't wait for 0, because you may never reach it. So you ask whether the change is below a tolerance.


      Below, a value shrinks towards a limit by a fixed fraction on each step. The loop keeps the previous value, works out the new one, and stops when the change is tiny. It also has a limit on the number of steps, so it can't run forever if something goes wrong. Real training loops have the same safety net.


      The f-string gives a clean report, while the real value keeps all its digits.
    code: |
      value = 1.0
      previous = 2.0
      steps = 0
      while abs(value - previous) > 1e-3 and steps < 100:
          previous = value
          value = value * 0.5
          steps += 1
      print(f"Stopped after {steps} steps at {value:.4f}")
    subgoals:
      - { line: 4, label: 'Stop when it barely changes, or at the limit' }
      - { line: 5, label: 'Remember the old value' }
      - { line: 6, label: 'Work out the new one' }
      - { line: 8, label: 'A neat report' }
    predict: Will it reach exactly 0?

  - type: write
    id: approx-equal
    prompt: Write `all_close(a, b, tol=1e-6)`, which takes two lists of the same length and gives back `True` if every pair of matching items differs by less than `tol`.
    starter: |
      def all_close(a, b, tol=1e-6):
          # Your code here
    solution: |
      def all_close(a, b, tol=1e-6):
          for i in range(len(a)):
              if abs(a[i] - b[i]) >= tol:
                  return False
          return True
    tests:
      - { call: 'all_close([0.1 + 0.2], [0.3])', expect: 'True' }
      - { call: 'all_close([1.0, 2.0], [1.0, 2.5])', expect: 'False' }
      - { call: 'all_close([1.0], [1.5], 1.0)', expect: 'True' }
      - { call: 'all_close([], [])', expect: 'True' }
    why: >-
      It's the find pattern: one failure is enough to say no, and it can only say yes after the loop.
    hints:
      - Return `False` the moment any pair is too far apart.
    variants:
      - prompt: Write `format_losses(losses)`, which gives back a string of the losses with 2 decimal places each and commas between them. So `format_losses([0.5, 0.123])` gives back `"0.50, 0.12"`.
        starter: |
          def format_losses(losses):
              # Your code here
        solution: |
          def format_losses(losses):
              parts = []
              for loss in losses:
                  parts.append(f"{loss:.2f}")
              return ", ".join(parts)
        tests:
          - { call: 'format_losses([0.5, 0.123])', expect: "'0.50, 0.12'" }
          - { call: 'format_losses([])', expect: "''" }
        hints:
          - Build a list of strings, then join them.

  - type: choice
    id: remember-seed
    kind: predict
    prompt: From the last lesson. What does this print?
    code: |
      import random
      random.seed(3)
      a = random.random()
      random.seed(3)
      print(a == random.random())
    choices: ['True', 'False', 'None', 'Error']
    answer: 'True'
    why: >-
      The same seed restarts the same sequence.

  - type: learn
    id: recap
    label: Recap
    title: What you know now
    body: >-
      Floats are approximate, and whole numbers are exact. Don't compare calculated floats with `==`, and use a tolerance instead. Use `<` rather than `!=` in loops over floats. `f"{x:.2f}"` shows a value neatly, without changing it.


      That's the end of this unit, and of the Python basics. Next comes the checkpoint, and then a project that counts the words in a text.
