id: u2-functions
track: ml
unit: 2
order: 4
title: Functions as values
summary: Functions can be passed around and can remember things. micrograd is built on this.

cards:
  - type: learn
    id: passing
    title: A function is a value
    body: >-
      Without parentheses, a function's name is the function itself, which you can store or pass along. `f()` calls it.
      `lambda` writes a small function in one line. `key=` tells `sorted` what to compare.
    code: |
      def square(x):
          return x * x

      def apply_twice(f, x):
          return f(f(x))

      print(apply_twice(square, 3))
      print(sorted(["ccc", "a", "bb"], key=len))
      print(sorted([3, -5, 1], key=lambda n: abs(n)))
    subgoals:
      - { line: 7, label: 'Pass the function, no parentheses' }
      - { line: 8, label: Sort by length }
      - { line: 9, label: Sort by a one-line function }
    predict: What does `apply_twice(square, 3)` print?

  - type: choice
    id: no-parens
    kind: predict
    prompt: What does this print?
    code: |
      def hello():
          return "hi"

      greet = hello
      print(greet())
    choices: ['hi', 'greet', 'None', 'Error']
    answer: 'hi'
    why: >-
      `greet = hello` has no parentheses, so it doesn't call anything. It's a second name for the function, and `greet()` calls it.

  - type: choice
    id: apply
    kind: predict
    prompt: What does this print?
    code: |
      def apply(f, x):
          return f(x) + 1

      print(apply(lambda n: n * 2, 5))
    choices: ['11', '12', '10', '6']
    answer: '11'
    why: The lambda doubles 5 to 10, then `apply` adds 1.
    variants:
      - code: |
          def apply(f, x):
              return f(x + 1)

          print(apply(lambda n: n * 2, 5))
        choices: ['12', '11', '10', '6']
        answer: '12'
        why: '`x + 1` is 6 and the lambda doubles it. Order matters: this adds first.'
      - code: |
          def apply(f, g, x):
              return g(f(x))

          print(apply(lambda n: n + 3, lambda n: n * n, 2))
        choices: ['25', '7', '10', '16']
        answer: '25'
        why: '`f(2)` is 5, then `g(5)` is 25. The inner call runs first, as in the chain rule later.'

  - type: learn
    id: closures
    title: A closure remembers its surroundings
    body: >-
      A function defined inside another can use the outer function's variables, even after the outer one returns. It keeps
      the variable itself, not a copy of its value. micrograd uses this to remember how to send gradients back.
    code: |
      def make_counter():
          count = 0
          def step():
              nonlocal count
              count += 1
              return count
          return step

      tick = make_counter()
      print(tick())
      print(tick())
    subgoals:
      - { line: 3, label: Inner function uses `count` }
      - { line: 4, label: Needed to assign to the outer variable }
      - { line: 7, label: 'Return the function, not a call' }
    predict: What do the two calls print?

  - type: choice
    id: closure-sees-latest
    kind: predict
    prompt: What does this print?
    code: |
      x = 1
      def show():
          return x

      x = 2
      print(show())
    choices: ['2', '1', 'None', 'Error']
    answer: '2'
    why: >-
      The function looks up `x` when it runs, not when it's defined, so it sees the latest value. It doesn't store a copy.

  - type: choice
    id: late-binding
    kind: predict
    prompt: What does this print?
    code: |
      fs = []
      for i in range(3):
          fs.append(lambda: i)
      print(fs[0]())
    choices: ['2', '0', '3', 'Error']
    answer: '2'
    why: >-
      All three lambdas share the one variable `i`, and by the time they run the loop has left it at 2.

  - type: parsons
    id: make-adder
    prompt: Order the lines so `make_adder(n)` returns a function that adds `n`.
    code: |
      def make_adder(n):
          def add(x):
              return x + n
          return add
    distractors: ['    return add(n)']
    tests:
      - { call: 'make_adder(2)(5)', expect: '7' }
    why: >-
      Return `add` without parentheses, so the caller gets the function. `add(n)` would call it right away.

  - type: blank
    id: sort-key
    prompt: Sort the words by their last letter.
    code: |
      def by_last(words):
          return sorted(words, key=____)
    answers: [['lambda w: w[-1]', 'lambda word: word[-1]', 'lambda x: x[-1]', 'lambda s: s[-1]']]
    tests:
      - { call: 'by_last(["ab", "ca", "bc"])', expect: "['ca', 'ab', 'bc']" }
    why: >-
      `key` takes a function, called once per word. `sorted` compares what it returns.

  - type: fix
    id: called-too-early
    prompt: '`on_done` should store a function to call later, but it stores the result instead. Fix it.'
    code: |
      def hello():
          return "done"

      def on_done(f):
          return f

      callback = on_done(hello())
      result = callback()
    solution: |
      def hello():
          return "done"

      def on_done(f):
          return f

      callback = on_done(hello)
      result = callback()
    tests:
      - { call: 'result', expect: "'done'" }
    why: >-
      `hello()` runs right away and passes along the string. `hello` passes the function itself.
    hints:
      - What's the difference between `hello` and `hello()`?

  - type: write
    id: make-multiplier
    prompt: Write `make_multiplier(n)`, which returns a function that multiplies its input by `n`.
    starter: |
      def make_multiplier(n):
          pass
    solution: |
      def make_multiplier(n):
          def multiply(x):
              return x * n
          return multiply
    tests:
      - { call: 'make_multiplier(3)(4)', expect: '12' }
      - { call: 'make_multiplier(0)(9)', expect: '0' }
      - { call: '(lambda d, t: (d(1), t(1)))(make_multiplier(2), make_multiplier(3))', expect: '(2, 3)', hidden: true }
    hints:
      - Define a function inside the function, and return it without parentheses.

  - type: explain
    id: why-closure
    prompt: How does `step` still know `amount` after `make_step` has finished?
    code: |
      def make_step(amount):
          def step(x):
              return x + amount
          return step
    model: >-
      `step` is a closure: it keeps access to the variables of the function it was defined in, so `amount` stays
      available after `make_step` returns.
    keyPoints:
      - An inner function keeps access to outer variables
      - That lasts after the outer function returns
