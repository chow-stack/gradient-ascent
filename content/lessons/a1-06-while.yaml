id: a1-while
track: ml
unit: 1
order: 6
title: while loops
summary: Repeat until a condition turns false. No ++ in Python.

cards:
  - type: learn
    id: countdown
    title: while, without the braces
    body: >-
      A `while` loop repeats its indented block as long as the condition is true. Something inside the
      loop has to move it toward stopping.


      Python has no `++` or `--`. Write `n -= 1` or `n += 1` instead.
    code: |
      n = 3
      while n > 0:
          print(n)
          n -= 1
      print("Liftoff!")
    java: |
      int n = 3;
      while (n > 0) {
          System.out.println(n);
          n--;
      }
      System.out.println("Liftoff!");
    subgoals:
      - { line: 1, label: Start value }
      - { line: 2, label: Keep going while this is true }
      - { line: 4, label: Move toward stopping }
    predict: How many numbers print before Liftoff?

  - type: choice
    id: sum-loop
    kind: predict
    prompt: What does this print?
    code: |
      total = 0
      i = 1
      while i <= 4:
          total += i
          i += 1
      print(total)
    choices: ['10', '6', '4', '15']
    answer: '10'
    why: >-
      `i` goes 1, 2, 3, 4 (the condition includes 4), so total = 1 + 2 + 3 + 4 = 10.
    hints:
      - Write down `i` and `total` after each pass.

  - type: choice
    id: no-plusplus
    prompt: Python has no `i++`. What do you write instead?
    choices: ['i += 1', 'i++', '++i', 'i =+ 1']
    answer: 'i += 1'
    why: >-
      `i += 1` adds one. Watch out for `i =+ 1`: it's valid Python but means `i = +1`, which sets i to 1
      forever.

  - type: choice
    id: halving
    kind: predict
    prompt: What does this print?
    code: |
      n = 10
      count = 0
      while n > 1:
          n = n // 2
          count += 1
      print(count)
    choices: ['3', '4', '5', '10']
    answer: '3'
    why: >-
      10 → 5 → 2 → 1. Three halvings, then `n > 1` is false. (This is the idea behind binary search:
      halving gets small fast.)
    hints:
      - Track `n` through each pass. Remember `//` drops the decimal.

  - type: parsons
    id: digit-sum
    prompt: Order the lines to add up the digits of 482 (it should print `14`).
    code: |
      n = 482
      total = 0
      while n > 0:
          total += n % 10
          n = n // 10
      print(total)
    distractors: ['    n = n / 10']
    expectOutput: '14'
    why: >-
      Take the last digit with `% 10`, then drop it with `// 10`, until nothing is left.
      `/ 10` would make n a decimal that never reaches 0 cleanly.

  - type: blank
    id: countdown-fn
    prompt: Fill in the comparison so `countdown(3)` prints 3, 2, 1, then `Go!`.
    code: |
      def countdown(n):
          while n ____ 0:
              print(n)
              n -= 1
          print("Go!")

      countdown(3)
    answers: [['>']]
    expectOutput: |
      3
      2
      1
      Go!
    why: >-
      `n > 0` stops before printing 0.

  - type: fix
    id: off-by-one
    prompt: This should print 0, 1 and 2, but prints one number too many. Fix it.
    code: |
      i = 0
      while i <= 3:
          print(i)
          i += 1
    solution: |
      i = 0
      while i < 3:
          print(i)
          i += 1
    highlightLine: 2
    expectOutput: |
      0
      1
      2
    why: >-
      `<= 3` lets i = 3 through. Off-by-one errors are the most common loop bug; check the last pass.
    hints:
      - What is the last value of `i` that gets printed?

  - type: write
    id: count-digits
    prompt: Write `count_digits(n)` that returns how many digits a positive whole number has. Use a while loop.
    starter: |
      def count_digits(n):
          pass
    solution: |
      def count_digits(n):
          count = 0
          while n > 0:
              n = n // 10
              count += 1
          return count
    tests:
      - { call: count_digits(5), expect: '1' }
      - { call: count_digits(1234), expect: '4' }
      - { call: count_digits(1000), expect: '4', hidden: true }
    hints:
      - Each `n // 10` removes one digit.
      - Count how many times you can do that before n reaches 0.

  - type: explain
    id: doubling
    prompt: What does this print, and why that number?
    code: |
      n = 1
      while n < 100:
          n = n * 2
      print(n)
    model: >-
      It keeps doubling n until n is at least 100, then prints it. 64 is still under 100, so it doubles
      once more and prints 128.
    keyPoints:
      - The loop stops the first time `n < 100` is false
      - 1, 2, 4, … 64, 128 → prints 128
