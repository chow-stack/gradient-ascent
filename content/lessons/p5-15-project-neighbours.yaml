id: p5-project-neighbours
track: ml
unit: 5
order: 15
kind: project
title: 'Project: Doodle recogniser'
summary: Teach the computer to recognise tiny doodles by finding the most similar one it has seen. Then draw your own, and teach it new ones.

cards:
  - type: project
    id: doodles
    play: doodle
    brief: >-
      To recognise something new, find the most similar thing you've already seen and copy its label. It's called nearest neighbours, and it's
      surprisingly strong. You'll use it to recognise 5 by 5 doodles of a cross, a plus and a square.


      An image is a grid of numbers, 1 for ink and 0 for paper. Flatten each grid into a row of 25 numbers, and "most similar" becomes "closest", measured
      with the distance formula. You'll do it with no loops in the maths, so it would stay fast with thousands of images.


      Once `predict` works, draw your own doodles in the Play tab. When it guesses wrong, teach it the right answer and draw again.
    starter: |
      import numpy as np
      import matplotlib.pyplot as plt


      def doodle(text):
          return np.array([[1.0 if c == "#" else 0.0 for c in row] for row in text.split()])


      train = np.array([
          doodle("#...# .#.#. ..#.. .#.#. #...#"),
          doodle("#...# .#.#. ..#.. .#.#. #..##"),
          doodle("..#.. ..#.. ##### ..#.. ..#.."),
          doodle("..#.. ..#.. ####. ..#.. ..#.."),
          doodle("##### #...# #...# #...# #####"),
          doodle("####. #...# #...# #...# #####"),
      ])
      labels = np.array(["cross", "cross", "plus", "plus", "square", "square"])

      tests = np.array([
          doodle("#...# .#.#. ..#.. .#.#. ##..#"),
          doodle("..#.. ..#.. ##### ..#.. ..##."),
          doodle("..... .###. .#.#. .###. ....."),
      ])
      test_labels = np.array(["cross", "plus", "square"])

      # Your functions go here.
    solution: |
      import numpy as np
      import matplotlib.pyplot as plt


      def doodle(text):
          return np.array([[1.0 if c == "#" else 0.0 for c in row] for row in text.split()])


      train = np.array([
          doodle("#...# .#.#. ..#.. .#.#. #...#"),
          doodle("#...# .#.#. ..#.. .#.#. #..##"),
          doodle("..#.. ..#.. ##### ..#.. ..#.."),
          doodle("..#.. ..#.. ####. ..#.. ..#.."),
          doodle("##### #...# #...# #...# #####"),
          doodle("####. #...# #...# #...# #####"),
      ])
      labels = np.array(["cross", "cross", "plus", "plus", "square", "square"])

      tests = np.array([
          doodle("#...# .#.#. ..#.. .#.#. ##..#"),
          doodle("..#.. ..#.. ##### ..#.. ..##."),
          doodle("..... .###. .#.#. .###. ....."),
      ])
      test_labels = np.array(["cross", "plus", "square"])


      def flatten(images):
          return images.reshape(len(images), -1)


      def distances(X, x):
          return np.sqrt(((X - x) ** 2).sum(axis=1))


      def predict(X, labels, x):
          return labels[np.argmin(distances(X, x))]


      def predict_all(X, labels, T):
          gaps = np.sqrt(((T[:, None, :] - X[None, :, :]) ** 2).sum(axis=2))
          return labels[gaps.argmin(axis=1)]


      guesses = predict_all(flatten(train), labels, flatten(tests))
      for i in range(len(tests)):
          print(f"Doodle {i + 1}: looks like a {guesses[i]} (it's a {test_labels[i]})")
      accuracy = round((guesses == test_labels).mean() * 100)
      print(f"Accuracy: {accuracy}%")

      plt.imshow(tests[2], cmap="gray")
      plt.title("A square it called a plus")
      plt.show()
    milestones:
      - title: Flatten
        goal: Write `flatten(images)`. It takes a stack of grids, shape `(n, rows, cols)`, and gives back one row per image, shape `(n, rows * cols)`.
        tests:
          - { call: 'flatten(np.zeros((3, 5, 5))).shape', expect: '(3, 25)' }
          - { call: 'flatten(np.arange(8).reshape(2, 2, 2))', expect: '[[0, 1, 2, 3], [4, 5, 6, 7]]' }
          - { call: 'flatten(np.ones((1, 4, 2))).shape', expect: '(1, 8)', hidden: true }
        forbids: ['loop']
        scope: flatten
        hints:
          - '`reshape` can change the shape without changing the numbers. `-1` means "whatever size fits".'
          - '`return images.reshape(len(images), -1)`'
      - title: How far apart?
        goal: >-
          Write `distances(X, x)`. `X` has one row per image and `x` is one image. Give back the distance from `x` to each row: subtract, square, add up along
          each row, and take the square root.
        tests:
          - { call: 'distances(np.array([[0.0, 0.0], [3.0, 4.0]]), np.array([0.0, 0.0]))', expect: '[0.0, 5.0]' }
          - {
              call: 'distances(np.array([[1.0, 1.0], [1.0, 2.0], [4.0, 5.0]]), np.array([1.0, 1.0]))',
              expect: '[0.0, 1.0, 5.0]',
              hidden: true,
            }
          - { call: 'distances(np.ones((4, 25)), np.zeros(25)).shape', expect: '(4,)', hidden: true }
        forbids: ['loop']
        scope: distances
        hints:
          - '`X - x` broadcasts: `x` is taken away from every row at once.'
          - Add up along each row with `axis=1`, so you get one number per image.
          - '`return np.sqrt(((X - x) ** 2).sum(axis=1))`'
      - title: Nearest neighbour
        goal: Write `predict(X, labels, x)`, which gives back the label of the row of `X` closest to `x`.
        tests:
          - {
              call: "predict(np.array([[0.0, 0.0], [5.0, 5.0]]), np.array(['a', 'b']), np.array([4.0, 4.0]))",
              expect: "'b'",
            }
          - {
              call: "predict(np.array([[0.0, 0.0], [5.0, 5.0]]), np.array(['a', 'b']), np.array([1.0, 2.0]))",
              expect: "'a'",
            }
          - { call: 'predict(flatten(train), labels, flatten(tests)[0])', expect: "'cross'", hidden: true }
        requires: ['name:distances']
        forbids: ['loop']
        scope: predict
        hints:
          - '`np.argmin` gives the position of the smallest value.'
          - '`return labels[np.argmin(distances(X, x))]`'
      - title: All at once
        goal: >-
          Write `predict_all(X, labels, T)`, which predicts a label for every row of `T` with no loop. Make a table of distances with one row per test image
          and one column per training image, then take the closest in each row.
        tests:
          - {
              call: "predict_all(np.array([[0.0, 0.0], [5.0, 5.0]]), np.array(['a', 'b']), np.array([[1.0, 0.0], [6.0, 5.0], [4.0, 5.0]]))",
              expect: "['a', 'b', 'b']",
            }
          - {
              call: "predict_all(np.array([[0.0], [10.0], [20.0]]), np.array(['x', 'y', 'z']), np.array([[19.0], [1.0]]))",
              expect: "['z', 'x']",
              hidden: true,
            }
        forbids: ['loop']
        scope: predict_all
        hints:
          - '`T[:, None, :]` has shape `(m, 1, d)` and `X[None, :, :]` has shape `(1, n, d)`. Subtracting them broadcasts to `(m, n, d)`: every test image minus every training image.'
          - Square, add up along the last axis (`axis=2`), and take the square root. That's the `(m, n)` table.
          - '`labels[gaps.argmin(axis=1)]` picks the closest training label for each row.'
      - title: Test it, and catch the mistake
        goal: >-
          Run `predict_all` on the test doodles and set `accuracy` to the share it gets right, as a whole percentage. Print a line for each doodle if you
          like. Then draw the one it got wrong with `plt.imshow`. Why did it get that one wrong?
        tests:
          - {
              call: 'predict_all(flatten(train), labels, flatten(tests)).tolist()',
              expect: "['cross', 'plus', 'plus']",
            }
          - { call: accuracy, expect: '67' }
        hints:
          - '`guesses == test_labels` gives an array of `True` and `False`. Its `.mean()` is the share that are right.'
          - '`round(... * 100)` turns 0.666 into 67.'
          - "The third doodle is a small square. Nearest neighbours compares pixel by pixel, and the small square's ink is in the middle, where the plus has its ink."
    extras:
      - In the Play tab, teach it a new shape, like a heart or a letter, with two or three examples. How few does it need?
      - Try k nearest neighbours. Take the 3 closest training doodles and let them vote.
      - Shift a doodle one square to the right and see whether it still recognises it. Why not?
