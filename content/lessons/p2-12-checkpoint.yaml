  - type: fix
    id: fix-early
    prompt: '`has_upper("aB")` should give back `True`. Fix it.'
    code: |
      def has_upper(text):
          for ch in text:
              if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
                  return True
              else:
                  return False
    solution: |
      def has_upper(text):
          for ch in text:
              if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
                  return True
          return False
    tests:
      - { call: 'has_upper("aB")', expect: 'True' }
      - { call: 'has_upper("ab")', expect: 'False' }
    why: >-
      A search can only say no after checking everything.
    variants:
      - prompt: '`all_digits("12a")` should give back `False`, because `a` is not a digit. Fix it.'
        code: |
          def all_digits(text):
              for ch in text:
                  if ch not in "0123456789":
                      return False
                  else:
                      return True
              return True
        solution: |
          def all_digits(text):
              for ch in text:
                  if ch not in "0123456789":
                      return False
              return True
        tests:
          - { call: all_digits("12a"), expect: 'False' }
          - { call: all_digits("123"), expect: 'True' }
          - { call: all_digits("a1"), expect: 'False', hidden: true }
          - { call: all_digits("7"), expect: 'True', hidden: true }
        why: 'The `else: return True` said yes after checking only the first character. Saying yes to "all of them" has to wait until the loop has finished.'
      - prompt: '`has_digit("ab3")` should give back `True`. Fix it.'
        code: |
          def has_digit(text):
              for ch in text:
                  if ch in "0123456789":
                      return True
                  else:
                      return False
        solution: |
          def has_digit(text):
              for ch in text:
                  if ch in "0123456789":
                      return True
              return False
        tests:
          - { call: has_digit("ab3"), expect: 'True' }
          - { call: has_digit("abc"), expect: 'False' }
          - { call: has_digit(""), expect: 'False', hidden: true }
          - { call: has_digit("7"), expect: 'True', hidden: true }
        why: 'The `else: return False` gave up after the first character. Only after the loop has checked everything can it say no.'
        hints: []

  - type: fix
    id: fix-loop
    prompt: This never ends. Fix it so it gives back the sum of 1 to `limit`, and `sum_to(3)` gives back `6`.
    code: |
      def sum_to(limit):
          total = 0
          n = 1
          while n <= limit:
              total += n
          return total
    solution: |
      def sum_to(limit):
          total = 0
          n = 1
          while n <= limit:
              total += n
              n += 1
          return total
    tests:
      - { call: sum_to(3), expect: '6' }
      - { call: sum_to(0), expect: '0' }
    why: >-
      Nothing in the block changed `n`, so the condition stayed true.
    variants:
      - prompt: This should give back how many times `n` can be halved with `//` before it reaches 1, so `halvings(8)` gives back `3`. It never ends. Fix it.
        code: |
          def halvings(n):
              count = 0
              while n > 1:
                  count += 1
              return count
        solution: |
          def halvings(n):
              count = 0
              while n > 1:
                  n = n // 2
                  count += 1
              return count
        tests:
          - { call: halvings(8), expect: '3' }
          - { call: halvings(1), expect: '0' }
          - { call: halvings(20), expect: '4', hidden: true }
        why: The condition looks at `n`, but only `count` changed, so `n > 1` stayed true forever.
      - prompt: '`count_up(3)` should give back `"123"`, but it gives back `"1234"`. Fix it.'
        code: |
          def count_up(limit):
              text = ""
              n = 1
              while n <= limit + 1:
                  text += str(n)
                  n += 1
              return text
        solution: |
          def count_up(limit):
              text = ""
              n = 1
              while n <= limit:
                  text += str(n)
                  n += 1
              return text
        tests:
          - { call: count_up(3), expect: "'123'" }
          - { call: count_up(0), expect: "''" }
          - { call: count_up(5), expect: "'12345'", hidden: true }
        why: 'An off-by-one: `<= limit + 1` lets `n` reach one past the limit. `<= limit` stops at the limit.'

  - type: write
    id: write-count
    prompt: Write `count_multiples(limit, d)`, which gives back how many numbers from 1 up to and including `limit` divide by `d` with no remainder.
    starter: |
      def count_multiples(limit, d):
          # Your code here
    solution: |
      def count_multiples(limit, d):
          count = 0
          for n in range(1, limit + 1):
              if n % d == 0:
                  count += 1
          return count
    tests:
      - { call: 'count_multiples(10, 3)', expect: '3' }
      - { call: 'count_multiples(6, 6)', expect: '1' }
      - { call: 'count_multiples(2, 5)', expect: '0' }
    why: >-
      A counter, a `for` loop that includes `limit`, and a `return` after the loop.
    variants:
      - prompt: Write `count_char(text, c)`, which gives back how many times the character `c` appears in `text`. So `count_char("banana", "a")` gives back `3`.
        starter: |
          def count_char(text, c):
              # Your code here
        solution: |
          def count_char(text, c):
              count = 0
              for ch in text:
                  if ch == c:
                      count += 1
              return count
        tests:
          - { call: 'count_char("banana", "a")', expect: '3' }
          - { call: 'count_char("goat", "z")', expect: '0' }
          - { call: 'count_char("", "a")', expect: '0', hidden: true }
          - { call: 'count_char("aaaa", "a")', expect: '4', hidden: true }
        requires: [loop]
        why: A counter starts at 0 before the loop, goes up on each match, and is returned after the loop.
      - prompt: Write `sum_evens(limit)`, which gives back the sum of the even numbers from 1 up to and including `limit`. So `sum_evens(6)` gives back `12`, for 2 + 4 + 6.
        starter: |
          def sum_evens(limit):
              # Your code here
        solution: |
          def sum_evens(limit):
              total = 0
              for n in range(1, limit + 1):
                  if n % 2 == 0:
                      total += n
              return total
        tests:
          - { call: sum_evens(6), expect: '12' }
          - { call: sum_evens(1), expect: '0' }
          - { call: sum_evens(7), expect: '12', hidden: true }
          - { call: sum_evens(10), expect: '30', hidden: true }
        requires: [loop]
        why: A total, a loop that includes `limit`, and an `if` that decides which numbers count.

  - type: write
    id: write-compress
    prompt: Write `no_vowels(text)`, which gives back `text` with every lowercase vowel removed. So `no_vowels("goat")` gives back `"gt"`.
    starter: |
      def no_vowels(text):
          # Your code here
    solution: |
      def no_vowels(text):
          out = ""
          for ch in text:
              if ch not in "aeiou":
                  out += ch
          return out
    tests:
      - { call: 'no_vowels("goat")', expect: "'gt'" }
      - { call: 'no_vowels("sky")', expect: "'sky'" }
      - { call: 'no_vowels("")', expect: "''" }
    why: >-
      A string accumulator starts at `""`. `not (ch in "aeiou")` works too.
    variants:
      - prompt: Write `shout(text)`, which gives back `text` with every space replaced by `!`. So `shout("hi there")` gives back `"hi!there"`. Use a loop, not `.replace`.
        starter: |
          def shout(text):
              # Your code here
        solution: |
          def shout(text):
              out = ""
              for ch in text:
                  if ch == " ":
                      out += "!"
                  else:
                      out += ch
              return out
        tests:
          - { call: shout("hi there"), expect: "'hi!there'" }
          - { call: shout("a b c"), expect: "'a!b!c'" }
          - { call: shout(""), expect: "''", hidden: true }
        requires: [loop]
        forbids: ['name:replace']
        why: A string accumulator starts at `""`, and each character adds either itself or `!`.
      - prompt: Write `initials(text)`, which gives back the uppercase letters in `text`, in order. So `initials("Ada Byron")` gives back `"AB"`.
        starter: |
          def initials(text):
              # Your code here
        solution: |
          def initials(text):
              out = ""
              for ch in text:
                  if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
                      out += ch
              return out
        tests:
          - { call: initials("Ada Byron"), expect: "'AB'" }
          - { call: initials("goat"), expect: "''" }
          - { call: initials("NASA"), expect: "'NASA'", hidden: true }
        requires: [loop]
        why: Go through each character, and keep only the ones found in the string of capital letters.
