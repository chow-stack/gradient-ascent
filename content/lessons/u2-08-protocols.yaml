id: u2-protocols
track: ml
unit: 2
order: 8
title: Objects that act like functions
summary: The methods behind PyTorch's model(x) and dataset[i].

cards:
  - type: learn
    id: call
    title: model(x) is a method call
    body: >-
      `__call__` lets an object be called like a function. `__len__` makes `len(obj)` work, and `__getitem__` makes
      `obj[i]` work. That's all that PyTorch's models and datasets are doing.
    code: |
      class Doubler:
          def __call__(self, x):
              return x * 2

      class Squares:
          def __len__(self):
              return 3
          def __getitem__(self, i):
              return i * i

      model = Doubler()
      data = Squares()
      print(model(5))
      print(len(data), data[2])
    subgoals:
      - { line: 2, label: Runs for `model(x)` }
      - { line: 6, label: Runs for `len(data)` }
      - { line: 8, label: 'Runs for `data[i]`' }
    predict: What do the last two lines print?

  - type: choice
    id: call-predict
    kind: predict
    prompt: What does this print?
    code: |
      class Scale:
          def __init__(self, k):
              self.k = k
          def __call__(self, x):
              return x * self.k

      triple = Scale(3)
      print(triple(4))
    choices: ['12', '4', '3', 'Error']
    answer: '12'
    why: >-
      `triple(4)` runs `triple.__call__(4)`, and `self.k` is 3. There's no method named `triple`; the object itself is being called.
    variants:
      - code: |
          class Scale:
              def __init__(self, k):
                  self.k = k
              def __call__(self, x):
                  return x * self.k

          layers = [Scale(2), Scale(5)]
          x = 1
          for layer in layers:
              x = layer(x)
          print(x)
        choices: ['10', '7', '1', 'Error']
        answer: '10'
        why: "Each layer feeds the next: 1 × 2 = 2, then 2 × 5 = 10. That's how a network runs."
      - code: |
          class Shift:
              def __init__(self, k):
                  self.k = k
              def __call__(self, x):
                  return x + self.k

          f = Shift(1)
          print(f(f(2)))
        choices: ['4', '3', '2', 'Error']
        answer: '4'
        why: '`f(2)` is 3, then `f(3)` is 4.'

  - type: choice
    id: getitem-loop
    kind: predict
    prompt: What does this print?
    code: |
      class Pairs:
          def __init__(self, xs, ys):
              self.xs = xs
              self.ys = ys
          def __len__(self):
              return len(self.xs)
          def __getitem__(self, i):
              return self.xs[i], self.ys[i]

      d = Pairs([1, 2], [10, 20])
      x, y = d[1]
      print(len(d), x + y)
    choices: ['2 22', '2 11', '4 22', 'Error']
    answer: '2 22'
    why: >-
      `d[1]` runs `__getitem__(1)`, giving (2, 20), which is unpacked. This is a PyTorch `Dataset` in miniature.

  - type: learn
    id: inherit
    title: Inheriting from a base class
    body: >-
      Put the parent in parentheses to inherit its methods. Python runs only the child's `__init__`, so call the parent's
      yourself with `super().__init__()`. Every PyTorch model starts exactly like this.
    code: |
      class Module:
          def __init__(self):
              self.training = True

      class Linear(Module):
          def __init__(self, w):
              super().__init__()
              self.w = w

          def __call__(self, x):
              return self.w * x

      layer = Linear(2)
      print(layer(3), layer.training)
    java: |
      class Linear extends Module {
          double w;
          Linear(double w) { super(); this.w = w; }
      }
    subgoals:
      - { line: 5, label: Inherit from `Module` }
      - { line: 7, label: Run the parent's setup }
      - { line: 8, label: Then add this class's own attribute }
    predict: What does it print?

  - type: choice
    id: forgot-super
    kind: predict
    prompt: What does this print?
    code: |
      class Base:
          def __init__(self):
              self.ready = True

      class Child(Base):
          def __init__(self):
              self.size = 1

      try:
          print(Child().ready)
      except AttributeError:
          print("no ready")
    choices: ['no ready', 'True', 'None', 'False']
    answer: 'no ready'
    why: >-
      The child's `__init__` replaces the parent's, which never runs. In Java, `super()` is automatic; in Python it isn't.

  - type: parsons
    id: order-sub
    prompt: Order the lines so `Square(3).area()` returns 9 and `.named` is `True`.
    code: |
      class Shape:
          def __init__(self):
              self.named = True
      class Square(Shape):
          def __init__(self, s):
              super().__init__()
              self.s = s
          def area(self):
              return self.s * self.s
    tests:
      - { call: 'Square(3).area()', expect: '9' }
      - { call: 'Square(3).named', expect: 'True' }
    why: >-
      `super().__init__()` runs the parent's setup. Without it `.named` wouldn't exist.

  - type: blank
    id: blank-call
    prompt: Fill in the method name so `Add(2)(3)` gives 5.
    code: |
      class Add:
          def __init__(self, n):
              self.n = n

          def ____(self, x):
              return x + self.n
    answers: [['__call__']]
    tests:
      - { call: 'Add(2)(3)', expect: '5' }
    why: Calling an object with parentheses runs its `__call__`.

  - type: fix
    id: child-init
    prompt: '`Dense(2)(3)` should give 6, but the class crashes on `self.calls`. Fix it.'
    code: |
      class Module:
          def __init__(self):
              self.calls = 0

      class Dense(Module):
          def __init__(self, w):
              self.w = w

          def __call__(self, x):
              self.calls += 1
              return self.w * x
    solution: |
      class Module:
          def __init__(self):
              self.calls = 0

      class Dense(Module):
          def __init__(self, w):
              super().__init__()
              self.w = w

          def __call__(self, x):
              self.calls += 1
              return self.w * x
    tests:
      - { call: 'Dense(2)(3)', expect: '6' }
      - { call: '(lambda d: (d(1), d.calls)[1])(Dense(2))', expect: '1' }
    why: >-
      The parent's `__init__` never ran, so `calls` was never created. It's the classic first bug in a PyTorch model.
    hints:
      - Which line creates `self.calls`, and does it ever run?

  - type: write
    id: dataset
    prompt: >-
      Write a class `Dataset`. `Dataset(xs, ys)` stores two lists; `len(d)` gives how many examples there are, and `d[i]`
      gives the tuple `(xs[i], ys[i])`.
    starter: |
      class Dataset:
          pass
    solution: |
      class Dataset:
          def __init__(self, xs, ys):
              self.xs = xs
              self.ys = ys

          def __len__(self):
              return len(self.xs)

          def __getitem__(self, i):
              return self.xs[i], self.ys[i]
    tests:
      - { call: 'len(Dataset([1, 2], [3, 4]))', expect: '2' }
      - { call: 'Dataset([1, 2], [3, 4])[1]', expect: '(2, 4)' }
      - { call: 'len(Dataset([], []))', expect: '0', hidden: true }
    hints:
      - Two methods besides `__init__`, and neither needs a loop.

  - type: explain
    id: what-model-call
    prompt: What actually happens on the last line?
    code: |
      class Model:
          def __init__(self, w):
              self.w = w

          def __call__(self, x):
              return self.w * x

      model = Model(2)
      y = model(3)
    model: >-
      `model` is an object, not a function. Python runs `model.__call__(3)`, which multiplies 3 by the stored weight, so `y` is 6.
    keyPoints:
      - Calling an object runs `__call__`
      - The weight is stored on the object
