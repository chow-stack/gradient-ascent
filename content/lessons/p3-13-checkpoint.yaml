id: p3-checkpoint
track: ml
unit: 3
order: 13
kind: checkpoint
title: Unit 3 checkpoint
summary: Lists, dicts and libraries, mixed up. Get 80% right to move on.

cards:
  - type: choice
    id: method-none
    kind: predict
    prompt: What does this print?
    code: |
      a = [2, 1]
      b = a.sort()
      print(b, a)
    choices: ['None [1, 2]', '[1, 2] [1, 2]', '[1, 2] [2, 1]', 'None [2, 1]']
    answer: 'None [1, 2]'
    why: >-
      `.sort()` changes the list and gives back `None`.
    variants:
      - code: |
          nums = [3, 1, 2]
          nums = nums.append(4)
          print(nums)
        choices: [None, '[3, 1, 2, 4]', '[4]', Error]
        answer: None
        why: '`.append` changes the list and gives back `None`, and that `None` was stored back in `nums`.'
        misses:
          {
            '[3, 1, 2, 4]': 'The 4 was added, but then `nums =` replaced the list with what `.append` gave back, `None`.',
            '[4]': '`.append` adds to the list it is called on. The problem is storing its result.',
            Error: 'Storing `None` is allowed. The trouble only shows up later, when you try to use `nums` as a list.',
          }
      - code: |
          a = [3, 1, 2]
          b = sorted(a)
          a.reverse()
          print(a, b)
        choices: ['[2, 1, 3] [1, 2, 3]', '[3, 2, 1] [1, 2, 3]', 'None [1, 2, 3]', '[2, 1, 3] None']
        answer: '[2, 1, 3] [1, 2, 3]'
        why: '`sorted` gives back a new sorted list and leaves `a` alone. `.reverse()` flips `a` itself, in its original order.'
        misses:
          {
            '[3, 2, 1] [1, 2, 3]': '`sorted(a)` does not change `a`, so `.reverse()` flips `[3, 1, 2]`, not a sorted list.',
            'None [1, 2, 3]': '`a.reverse()` gives back `None`, but nothing stored that. `a` itself was flipped.',
            '[2, 1, 3] None': '`sorted` is a built-in that gives back a new list. Only list methods like `.sort` give back `None`.',
          }

  - type: choice
    id: alias
    kind: predict
    prompt: What does this print?
    code: |
      a = [1]
      b = a
      c = a[:]
      b.append(2)
      c.append(3)
      print(a)
    choices: ['[1, 2]', '[1, 2, 3]', '[1, 3]', '[1]']
    answer: '[1, 2]'
    why: >-
      `b` is the same list, and `c` is a copy.
    variants:
      - code: |
          def f(x):
              x.append(1)
              x = [9]

          a = []
          f(a)
          print(a)
        choices: ['[1]', '[9]', '[]', '[1, 9]']
        answer: '[1]'
        why: >-
          `append` changes the shared list. Assigning only moves the local name.
      - code: |
          row = [0, 0]
          grid = [row, row]
          grid[0][0] = 5
          print(grid)
        choices: ['[[5, 0], [5, 0]]', '[[5, 0], [0, 0]]', '[[5, 5], [0, 0]]', '[5, 0, 0, 0]']
        answer: '[[5, 0], [5, 0]]'
        why: Both items of `grid` are the same list, `row`, so changing it through one shows up in both.
        misses:
          {
            '[[5, 0], [0, 0]]': '`[row, row]` holds two names for one list, not two copies.',
            '[[5, 5], [0, 0]]': '`grid[0][0]` is row 0, position 0. The surprise is that row 1 is the same list.',
            '[5, 0, 0, 0]': A list of lists keeps its inner lists. It is not flattened into one.,
          }

  - type: choice
    id: loop-variable
    kind: predict
    prompt: What does this print?
    code: |
      a = [1, 2]
      for x in a:
          x = x * 5
      print(a)
    choices: ['[1, 2]', '[5, 10]', '[5, 2]', '10']
    answer: '[1, 2]'
    why: >-
      Assigning to the loop variable doesn't touch the list.
    variants:
      - code: |
          words = ["a", "b"]
          for w in words:
              w = w.upper()
          print(words)
        choices: ["['a', 'b']", "['A', 'B']", "['A', 'b']", AB]
        answer: "['a', 'b']"
        why: '`w` is a name for each item in turn. Giving `w` a new value does not put anything back in the list.'
        misses:
          {
            "['A', 'B']": 'To change the list, you need to assign to `words[i]`, or build a new list.',
            "['A', 'b']": Nothing in the loop changes the list on any pass.,
            AB: 'The `print` shows the list itself, which was never changed.',
          }
      - code: |
          nums = [1, 2, 3]
          for i in range(len(nums)):
              nums[i] = nums[i] * 2
          print(nums)
        choices: ['[2, 4, 6]', '[1, 2, 3]', '[0, 2, 4]', '[2, 2, 3]']
        answer: '[2, 4, 6]'
        why: Assigning to `nums[i]` puts the new value into the list itself, at each position.
        misses:
          {
            '[1, 2, 3]': 'This time the loop assigns to `nums[i]`, a place in the list, so the list changes.',
            '[0, 2, 4]': '`i` is the position, but the line doubles `nums[i]`, the item at that position.',
            '[2, 2, 3]': 'The loop runs once for each position, so every item is doubled.',
          }

  - type: choice
    id: grid
    kind: predict
    prompt: What does this print?
    code: |
      g = [[1, 2, 3], [4, 5, 6]]
      print(len(g), g[1][0])
    choices: ['2 4', '3 4', '2 2', '6 4']
    answer: '2 4'
    why: >-
      There are 2 rows, and row 1, column 0 is 4.
    variants:
      - code: |
          g = [[1, 2], [3, 4], [5, 6]]
          print(g[2], g[0][1] + g[1][0])
        choices: ['[5, 6] 5', '[5, 6] 6', '[3, 4] 5', 5 5]
        answer: '[5, 6] 5'
        why: '`g[2]` is the third row. `g[0][1]` is 2 and `g[1][0]` is 3, so they add to 5.'
        misses:
          {
            '[5, 6] 6': 'The first index picks the row, the second the column: `g[0][1]` is 2.',
            '[3, 4] 5': 'Indexes start at 0, so `g[2]` is the third row.',
            5 5: 'One index picks a whole row, which is a list.',
          }
      - code: |
          g = [[1, 2, 3], [4, 5, 6]]
          total = 0
          for row in g:
              total += row[2]
          print(total)
        choices: ['9', '15', '21', '6']
        answer: '9'
        why: 'Each `row` is a list, and `row[2]` is its last column: 3 and 6.'
        misses:
          {
            '15': 'That is the sum of row 1. The loop takes position 2 of each row: the column 3, 6.',
            '21': 'Only one item from each row is added, `row[2]`.',
            '6': 'There are two rows, so it adds 3 as well as 6.',
          }

  - type: choice
    id: split-strings
    kind: predict
    prompt: What does this print?
    code: |
      a, b = "2,5".split(",")
      print(a * 2 + b)
    choices: ['225', '9', '45', 'Error']
    answer: '225'
    why: >-
      The pieces are strings, so `*` repeats and `+` joins.
    variants:
      - code: |
          parts = "3 4".split()
          print(parts[0] + parts[1], int(parts[0]) + int(parts[1]))
        choices: [34 7, 7 7, 34 34, 3 4 7]
        answer: 34 7
        why: '`split` gives back strings, so `+` joins them. After `int`, `+` adds.'
        misses:
          {
            7 7: 'Before converting, the pieces are text, and `+` on text joins them.',
            34 34: '`int` turns each piece into a number, so the second `+` adds.',
            3 4 7: '`+` joins text with nothing in between.',
          }
      - code: |
          words = ["red", "fox"]
          print("-".join(words), len("-".join(words)))
        choices: [red-fox 7, red-fox 2, -red-fox- 9, red fox 7]
        answer: red-fox 7
        why: '`join` puts the separator only between items, giving a single string of 7 characters.'
        misses:
          {
            red-fox 2: '`join` gives back one string, and `len` counts its characters.',
            -red-fox- 9: 'The separator goes between items, not at the ends.',
            red fox 7: 'The separator is the string `join` is called on, here a dash.',
          }

  - type: choice
    id: dict-loop
    kind: predict
    prompt: What does this print?
    code: |
      d = {"z": 1, "a": 2}
      for x in d:
          print(x, d[x])
      print(max(d))
    choices: ["z 1\na 2\nz", "1 z\n2 a\n2", "a 2\nz 1\na", "z 1\na 2\n2"]
    answer: "z 1\na 2\nz"
    why: >-
      A dict loop goes through the keys in the order they were added, and `max` compares keys.
    variants:
      - code: |
          d = {"b": 3, "a": 1}
          d["c"] = 2
          print(list(d), sum(d.values()))
        choices: ["['b', 'a', 'c'] 6", "['a', 'b', 'c'] 6", '[3, 1, 2] 6', "['b', 'a', 'c'] 3"]
        answer: "['b', 'a', 'c'] 6"
        why: '`list(d)` gives the keys in the order they were added. `.values()` gives 3, 1 and 2.'
        misses:
          {
            "['a', 'b', 'c'] 6": A dict keeps the order keys were added. It does not sort them.,
            '[3, 1, 2] 6': 'Going through a dict, or making a list of it, gives the keys.',
            "['b', 'a', 'c'] 3": '`sum(d.values())` adds every value, including the new one.',
          }
      - code: |
          d = {"x": 5, "y": 9}
          best = max(d, key=d.get)
          print(max(d), best)
        choices: [y y, x y, 9 y, y 9]
        answer: y y
        why: '`max(d)` compares the keys, and `"y"` comes after `"x"`. With `key=d.get` it compares values, and 9 wins, which is also `"y"`.'
        misses:
          {
            x y: '`max(d)` compares keys as text, and `"y"` is after `"x"`.',
            9 y: '`max(d)` gives back a key, not a value.',
            y 9: '`max` with a `key` still gives back the key, not the value it compared.',
          }

  - type: choice
    id: which-safe
    kind: concept
    prompt: Which of these is the right way to compare a calculated float `x` with 0.3?
    choices:
      - 'abs(x - 0.3) < 1e-9'
      - 'x == 0.3'
      - 'x is 0.3'
      - 'int(x) == 0.3'
    answer: 'abs(x - 0.3) < 1e-9'
    why: >-
      Floats are approximate, so compare with a tolerance.
    variants:
      - prompt: '`total` is a sum of floats that should come to 1. Which loop is safe?'
        choices:
          ['while abs(total - 1) > 1e-9:', 'while total != 1:', 'while total != 1.0:', 'while round(total) != 1.0:']
        answer: 'while abs(total - 1) > 1e-9:'
        why: A sum of floats can miss 1 by a tiny amount and never equal it exactly, so a loop testing `!=` can run forever.
        misses:
          {
            'while total != 1:': '`total` may be 0.9999999999999999, which is not equal to 1, so the loop never ends.',
            'while total != 1.0:': '`1.0` is still an exact comparison. Floats need a tolerance.',
            'while round(total) != 1.0:': '`round` stops at the nearest whole number, so 0.6 already counts as 1.',
          }
      - prompt: What does this print?
        kind: predict
        code: |
          x = 0.1 + 0.2
          print(x == 0.3, round(x, 2) == 0.3)
        choices: [False True, True True, False False, True False]
        answer: False True
        why: '`0.1 + 0.2` is 0.30000000000000004, so `==` fails. Rounding to 2 places gives exactly the same float as `0.3`.'
        misses:
          {
            True True: 'Floats are stored approximately, so `0.1 + 0.2` is a tiny bit more than 0.3.',
            False False: 'Rounding to 2 places removes the tiny error, so it compares equal.',
            True False: The exact comparison is the one that fails.,
          }

