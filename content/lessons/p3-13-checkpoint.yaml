  - type: fix
    id: fix-best
    prompt: '`largest([-3, -1])` should give back `-1`. Fix it.'
    code: |
      def largest(items):
          best = 0
          for x in items:
              if x > best:
                  best = x
          return best
    solution: |
      def largest(items):
          best = items[0]
          for x in items:
              if x > best:
                  best = x
          return best
    tests:
      - { call: 'largest([-3, -1])', expect: '-1' }
      - { call: 'largest([2, 9])', expect: '9' }
    why: >-
      Best so far starts from a real item.
    variants:
      - prompt: '`shortest(["kiwi", "fig"])` should give back `"fig"`. Fix it.'
        code: |
          def shortest(words):
              best = ""
              for w in words:
                  if len(w) < len(best):
                      best = w
              return best
        solution: |
          def shortest(words):
              best = words[0]
              for w in words:
                  if len(w) < len(best):
                      best = w
              return best
        tests:
          - { call: 'shortest(["kiwi", "fig"])', expect: "'fig'" }
          - { call: 'shortest(["pear", "apple"])', expect: "'pear'" }
          - { call: 'shortest(["melon"])', expect: "'melon'", hidden: true }
        why: Nothing is shorter than `""`, so it never changed. Starting from a real item makes the comparison fair.
      - prompt: '`coldest([-5, -9, -2])` should give back `-9`, but it gives back `-2`. Fix it.'
        code: |
          def coldest(temps):
              best = temps[0]
              for t in temps:
                  if t > best:
                      best = t
              return best
        solution: |
          def coldest(temps):
              best = temps[0]
              for t in temps:
                  if t < best:
                      best = t
              return best
        tests:
          - { call: 'coldest([-5, -9, -2])', expect: '-9' }
          - { call: 'coldest([3, 1, 2])', expect: '1' }
          - { call: 'coldest([4])', expect: '4', hidden: true }
        why: 'Coldest is the smallest, so a new best has to be lower than the current one: `<`, not `>`.'

  - type: fix
    id: fix-remove
    prompt: '`no_negatives([-1, -2, 3])` should give back `[3]`. Fix it.'
    code: |
      def no_negatives(items):
          for x in items:
              if x < 0:
                  items.remove(x)
          return items
    solution: |
      def no_negatives(items):
          out = []
          for x in items:
              if x >= 0:
                  out.append(x)
          return out
    tests:
      - { call: 'no_negatives([-1, -2, 3])', expect: '[3]' }
      - { call: 'no_negatives([])', expect: '[]' }
    why: >-
      Removing during the loop skips items, so build a new list.
    variants:
      - prompt: '`no_blanks(["a", "", "", "b"])` should give back `["a", "b"]`. Fix it.'
        code: |
          def no_blanks(items):
              for x in items:
                  if x == "":
                      items.remove(x)
              return items
        solution: |
          def no_blanks(items):
              out = []
              for x in items:
                  if x != "":
                      out.append(x)
              return out
        tests:
          - { call: 'no_blanks(["a", "", "", "b"])', expect: "['a', 'b']" }
          - { call: 'no_blanks([])', expect: '[]' }
          - { call: 'no_blanks(["", ""])', expect: '[]', hidden: true }
        why: Removing during the loop shifts the rest along, so the second blank was skipped. Build a new list instead.
      - prompt: '`add_one(nums)` should give back a new list with 1 added to each item, and leave `nums` unchanged. Fix it.'
        code: |
          def add_one(nums):
              out = nums
              for i in range(len(out)):
                  out[i] += 1
              return out

          a = [1, 2]
          b = add_one(a)
        solution: |
          def add_one(nums):
              out = nums[:]
              for i in range(len(out)):
                  out[i] += 1
              return out

          a = [1, 2]
          b = add_one(a)
        tests:
          - { call: b, expect: '[2, 3]' }
          - { call: a, expect: '[1, 2]' }
          - { call: 'add_one([5, 0])', expect: '[6, 1]', hidden: true }
        why: '`out = nums` is a second name for the same list, so changing `out` changed `nums`. A copy, `nums[:]`, keeps them apart.'

  - type: write
    id: write-matrix
    prompt: Write `row_means(grid)`, which gives back a list of the mean of each row. So `row_means([[1, 3], [2, 2]])` gives back `[2.0, 2.0]`.
    starter: |
      def row_means(grid):
          # Your code here
    solution: |
      def row_means(grid):
          out = []
          for row in grid:
              out.append(sum(row) / len(row))
          return out
    tests:
      - { call: 'row_means([[1, 3], [2, 2]])', expect: '[2.0, 2.0]' }
      - { call: 'row_means([])', expect: '[]' }
    why: >-
      A row is a list, so `sum` and `len` work on it.
    variants:
      - prompt: Write `column(grid, c)`, which gives back a list of the items in column `c` of every row. So `column([[1, 2], [3, 4]], 1)` gives back `[2, 4]`.
        starter: |
          def column(grid, c):
              # Your code here
        solution: |
          def column(grid, c):
              out = []
              for row in grid:
                  out.append(row[c])
              return out
        tests:
          - { call: 'column([[1, 2], [3, 4]], 1)', expect: '[2, 4]' }
          - { call: 'column([[1, 2], [3, 4]], 0)', expect: '[1, 3]' }
          - { call: 'column([], 0)', expect: '[]', hidden: true }
        why: Each row is a list, and `row[c]` picks column `c` from it.
      - prompt: Write `grid_max(grid)`, which gives back the largest number anywhere in the grid. So `grid_max([[1, 7], [4, 2]])` gives back `7`. You can assume the grid has at least one number.
        starter: |
          def grid_max(grid):
              # Your code here
        solution: |
          def grid_max(grid):
              best = grid[0][0]
              for row in grid:
                  for x in row:
                      if x > best:
                          best = x
              return best
        tests:
          - { call: 'grid_max([[1, 7], [4, 2]])', expect: '7' }
          - { call: 'grid_max([[-3, -8], [-5, -4]])', expect: '-3' }
          - { call: 'grid_max([[2]])', expect: '2', hidden: true }
        why: Best so far, started from a real item, with one loop for the rows and one inside it for each item.

  - type: write
    id: write-top
    prompt: Write `top_word(text)`, which gives back the most common word in `text`, in lowercase. If there's a tie, the word seen first wins. You can assume that the text has at least one word.
    starter: |
      def top_word(text):
          # Your code here
    solution: |
      def top_word(text):
          counts = {}
          for word in text.lower().split():
              counts[word] = counts.get(word, 0) + 1
          best = None
          for word in counts:
              if best is None or counts[word] > counts[best]:
                  best = word
          return best
    tests:
      - { call: 'top_word("a b B")', expect: "'b'" }
      - { call: 'top_word("x y")', expect: "'x'" }
    why: >-
      Two patterns one after another: count, then best so far.
    variants:
      - prompt: 'Write `char_counts(text)`, which gives back a dictionary of how many times each character appears, ignoring spaces. So `char_counts("aa b")` gives back `{"a": 2, "b": 1}`.'
        starter: |
          def char_counts(text):
              # Your code here
        solution: |
          def char_counts(text):
              counts = {}
              for ch in text:
                  if ch != " ":
                      counts[ch] = counts.get(ch, 0) + 1
              return counts
        tests:
          - { call: char_counts("aa b"), expect: "{'a': 2, 'b': 1}" }
          - { call: char_counts(""), expect: '{}' }
          - { call: char_counts("x x x"), expect: "{'x': 3}", hidden: true }
        why: 'The counting pattern: `.get(ch, 0) + 1` handles a new key, and the `if` skips spaces.'
      - prompt: Write `longest_word(text)`, which gives back the longest word in `text`. If there's a tie, the word seen first wins. You can assume the text has at least one word.
        starter: |
          def longest_word(text):
              # Your code here
        solution: |
          def longest_word(text):
              words = text.split()
              best = words[0]
              for w in words:
                  if len(w) > len(best):
                      best = w
              return best
        tests:
          - { call: longest_word("a big goat"), expect: "'goat'" }
          - { call: longest_word("hi yo"), expect: "'hi'" }
          - { call: longest_word("summit"), expect: "'summit'", hidden: true }
        why: Split into words, then best so far. `>` rather than `>=` keeps the first word in a tie.
