title: Python for ML checkpoint
summary: Everything from this unit, mixed up. Get 80% right to move on.

cards:
  - type: choice
    id: alias-class
    kind: predict
    prompt: What does this print?
    code: |
      class Box:
          def __init__(self, items):
              self.items = items

      shared = [1]
      a = Box(shared)
      b = Box(shared)
      a.items.append(2)
      print(b.items)
    choices: ['[1, 2]', '[1]', '[2]', 'Error']
    answer: '[1, 2]'
    why: Both objects hold the same list, so changing it through `a` shows through `b`.

  - type: choice
    id: shallow-mix
    kind: predict
    prompt: What does this print?
    code: |
      a = [[0], [0]]
      b = a[:]
      b[0][0] = 1
      b[1] = [9]
      print(a)
    choices: ['[[1], [0]]', '[[0], [0]]', '[[1], [9]]', '[[0], [9]]']
    answer: '[[1], [0]]'
    why: A slice is one level deep. Inner lists are shared, but replacing an item in `b` doesn't affect `a`.

  - type: choice
    id: late-closure
    kind: predict
    prompt: What does this print?
    code: |
      def make():
          n = 1
          def get():
              return n
          n = 5
          return get

      print(make()())
    choices: ['5', '1', 'None', 'Error']
    answer: '5'
    why: A closure keeps the variable itself, not a copy of its value when defined.

  - type: choice
    id: comp-filter
    kind: predict
    prompt: What does this print?
    code: |
      pairs = [(1, "a"), (2, "b"), (3, "c")]
      print([s for n, s in pairs if n % 2 == 1])
    choices: ["['a', 'c']", "['b']", '[1, 3]', 'Error']
    answer: "['a', 'c']"
    why: Each tuple is unpacked, the filter keeps odd `n`, and each kept `s` goes in the new list.

  - type: choice
    id: eq-dunder
    kind: predict
    prompt: What does this print?
    code: |
      class P:
          def __init__(self, x):
              self.x = x
          def __eq__(self, other):
              return self.x == other.x

      a = P(1)
      b = P(1)
      print(a == b, a is b)
    choices: ['True False', 'True True', 'False False', 'Error']
    answer: 'True False'
    why: "`__eq__` compares values, while `is` still asks if they're the same object."

  - type: choice
    id: rmul-order
    prompt: '`v` has `__mul__` but no `__rmul__`. What happens with `2 * v`?'
    choices:
      - "`TypeError`, since `int` can't do it and there's no fallback"
      - It uses `__mul__` with the sides swapped
      - It returns 2
    answer: "`TypeError`, since `int` can't do it and there's no fallback"
    why: Python never swaps the sides on its own. It needs `__rmul__` on the right object.

  - type: fix
    id: fix-init
    prompt: '`Net(2)(3)` should return 6, but it crashes. Fix it.'
    code: |
      class Base:
          def __init__(self):
              self.scale = 1

      class Net(Base):
          def __init__(self, w):
              self.w = w

          def __call__(self, x):
              return self.w * x * self.scale
    solution: |
      class Base:
          def __init__(self):
              self.scale = 1

      class Net(Base):
          def __init__(self, w):
              super().__init__()
              self.w = w

          def __call__(self, x):
              return self.w * x * self.scale
    tests:
      - { call: 'Net(2)(3)', expect: '6' }
    why: The child's `__init__` replaces the parent's, so call `super().__init__()` yourself.

  - type: fix
    id: fix-mutation
    prompt: '`normalize` should return a new list that sums to 1 and leave its input alone. Fix it.'
    code: |
      def normalize(nums):
          total = sum(nums)
          for i in range(len(nums)):
              nums[i] = nums[i] / total
          return nums
    solution: |
      def normalize(nums):
          total = sum(nums)
          return [n / total for n in nums]
    tests:
      - { call: 'normalize([1, 3])', expect: '[0.25, 0.75]' }
      - { call: '(lambda a: (normalize(a), a)[1])([1, 3])', expect: '[1, 3]' }
    why: A parameter names the caller's list, so assigning to `nums[i]` changes it. A comprehension makes a new list.

  - type: write
    id: write-vocab
    prompt: >-
      Write `encode(text, vocab)`, which turns each character into its number using the dict `vocab`.
      `encode("ba", {"a": 0, "b": 1})` gives `[1, 0]`.
    starter: |
      def encode(text, vocab):
          pass
    solution: |
      def encode(text, vocab):
          return [vocab[ch] for ch in text]
    tests:
      - { call: 'encode("ba", {"a": 0, "b": 1})', expect: '[1, 0]' }
      - { call: 'encode("", {})', expect: '[]' }

  - type: write
    id: write-class
    prompt: >-
      Write a class `Batch`. `Batch(items)` stores a list, `len(b)` gives its size, and `b[i]` gives item `i` multiplied by 2.
    starter: |
      class Batch:
          pass
    solution: |
      class Batch:
          def __init__(self, items):
              self.items = items

          def __len__(self):
              return len(self.items)

          def __getitem__(self, i):
              return self.items[i] * 2
    tests:
      - { call: 'len(Batch([1, 2]))', expect: '2' }
      - { call: 'Batch([1, 2])[1]', expect: '4' }
