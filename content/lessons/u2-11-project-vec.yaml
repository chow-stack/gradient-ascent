id: u2-project-vec
track: ml
unit: 2
order: 11
kind: project
title: 'Project: Vector class'
summary: Build a small vector class with real arithmetic. Unit 3 replaces it with NumPy.

cards:
  - type: write
    id: init-repr
    prompt: >-
      Step 1 of 4. Write a class `Vec`. `Vec([1, 2])` stores the list as `.items`, and `repr` gives `Vec([1, 2])`.
    starter: |
      class Vec:
          pass
    solution: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def __repr__(self):
              return f"Vec({self.items})"
    tests:
      - { call: 'Vec([1, 2]).items', expect: '[1, 2]' }
      - { call: 'repr(Vec([1, 2]))', expect: "'Vec([1, 2])'" }
    hints:
      - An f-string shows a list the way `print` does.

  - type: write
    id: arithmetic
    prompt: >-
      Step 2 of 4. Add `+` and `-` between vectors, and `*` by a number on either side. Each returns a new `Vec`.
    starter: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def __repr__(self):
              return f"Vec({self.items})"
    solution: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def __repr__(self):
              return f"Vec({self.items})"

          def __add__(self, other):
              return Vec([a + b for a, b in zip(self.items, other.items)])

          def __sub__(self, other):
              return Vec([a - b for a, b in zip(self.items, other.items)])

          def __mul__(self, k):
              return Vec([a * k for a in self.items])

          def __rmul__(self, k):
              return self * k
    tests:
      - { call: '(Vec([1, 2]) + Vec([3, 4])).items', expect: '[4, 6]' }
      - { call: '(Vec([3, 4]) - Vec([1, 1])).items', expect: '[2, 3]' }
      - { call: '(Vec([1, 2]) * 2).items', expect: '[2, 4]' }
      - { call: '(2 * Vec([1, 2])).items', expect: '[2, 4]' }
      - { call: '(lambda v: (v + v, v.items)[1])(Vec([1]))', expect: '[1]', hidden: true }
    hints:
      - '`zip` plus a comprehension handles `+` and `-`.'
      - '`__rmul__` can just reuse `self * k`.'

  - type: write
    id: dot-length
    prompt: >-
      Step 3 of 4. Add `.dot(other)` for the dot product and `.length()` for the length: the square root of the vector's
      dot product with itself. `x ** 0.5` is a square root.
    starter: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def __repr__(self):
              return f"Vec({self.items})"
    solution: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def __repr__(self):
              return f"Vec({self.items})"

          def dot(self, other):
              return sum(a * b for a, b in zip(self.items, other.items))

          def length(self):
              return self.dot(self) ** 0.5
    tests:
      - { call: 'Vec([1, 2]).dot(Vec([3, 4]))', expect: '11' }
      - { call: 'Vec([3, 4]).length()', expect: '5.0' }
      - { call: 'Vec([0, 0]).length()', expect: '0.0', hidden: true }
    hints:
      - '`.length()` can call `self.dot(self)`.'

  - type: write
    id: eq-sizes
    prompt: >-
      Step 4 of 4. Add `==`, which treats values within 1e-9 as equal, because floats are rarely exact. Also make `dot`
      raise `ValueError` if the sizes differ.
    starter: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def dot(self, other):
              return sum(a * b for a, b in zip(self.items, other.items))

      def _dot_raises():
          try:
              Vec([1]).dot(Vec([1, 2]))
          except ValueError:
              return True
          return False
    solution: |
      class Vec:
          def __init__(self, items):
              self.items = items

          def dot(self, other):
              if len(self.items) != len(other.items):
                  raise ValueError("sizes differ")
              return sum(a * b for a, b in zip(self.items, other.items))

          def __eq__(self, other):
              if len(self.items) != len(other.items):
                  return False
              return all(abs(a - b) < 1e-9 for a, b in zip(self.items, other.items))

      def _dot_raises():
          try:
              Vec([1]).dot(Vec([1, 2]))
          except ValueError:
              return True
          return False
    tests:
      - { call: 'Vec([0.1 + 0.2]) == Vec([0.3])', expect: 'True' }
      - { call: 'Vec([1]) == Vec([2])', expect: 'False' }
      - { call: '_dot_raises()', expect: 'True' }
      - { call: 'Vec([1]) == Vec([1, 2])', expect: 'False', hidden: true }
    hints:
      - '`all(...)` is True when every item in a generator is true.'
