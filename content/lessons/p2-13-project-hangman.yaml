id: p2-project-hangman
track: ml
unit: 2
order: 13
kind: project
title: 'Project: Hangman, and a bot that plays it'
summary: The game already runs in the Play tab, just badly. Fix its rules one function at a time, then write a bot that plays it.

cards:
  - type: project
    id: hangman
    play: hangman
    brief: >-
      Hangman: the game picks a secret word, and you guess it one letter at a time before you run out of lives. It
      already runs: open the Play tab and press some letters. It plays badly, though: it shows you the secret word,
      you never lose a life, and it never ends. That's because your three functions are stand-ins. Each milestone
      fixes one of them, and you can play again after every one.


      How it fits together: the Play tab picks the word and keeps track of the letters you've pressed. After every
      letter it calls your functions with the word and those letters: `masked` for what to show, `misses` for how
      many lives to take away (from `lives`), and `status` to know whether the game is over. Last, you'll write
      `next_guess`, a bot that picks letters by itself, and watch it play.


      There are no lists yet, so the letters guessed so far are one string, like `"tea"`.
    starter: |
      lives = 6
      common = "etaoinshrdlucmfwypvbgkjqxz"


      # ---- Your functions: stand-ins for now, so the game runs ----

      def masked(word, guessed):
          return word  # stand-in: shows the whole word


      def misses(word, guessed):
          return 0  # stand-in: you never lose a life


      def status(word, guessed):
          return "playing"  # stand-in: the game never ends
    solution: |
      lives = 6
      common = "etaoinshrdlucmfwypvbgkjqxz"


      # ---- Your functions ----

      def masked(word, guessed):
          shown = ""
          for c in word:
              if c in guessed:
                  shown = shown + c
              else:
                  shown = shown + "_"
          return shown


      def misses(word, guessed):
          count = 0
          for c in guessed:
              if c not in word:
                  count = count + 1
          return count


      def status(word, guessed):
          if "_" not in masked(word, guessed):
              return "won"
          if misses(word, guessed) >= lives:
              return "lost"
          return "playing"


      def next_guess(guessed):
          for c in common:
              if c not in guessed:
                  return c
          return ""
    milestones:
      - title: Hide the letters
        goal: >-
          The game shows the whole secret word. Change `masked(word, guessed)` so it gives back the word with every
          letter that hasn't been guessed yet replaced by `_`. Then play: the blanks fill in as you guess.
        examples:
          - { call: 'masked("goat", "ta")', gives: "'__at'" }
          - { call: 'masked("hill", "")', gives: "'____'" }
          - { call: 'masked("hill", "hil")', gives: "'hill'" }
        tests:
          - { call: 'masked("goat", "ta")', expect: "'__at'" }
          - { call: 'masked("hill", "")', expect: "'____'" }
          - { call: 'masked("hill", "hil")', expect: "'hill'", hidden: true }
          - { call: 'masked("banana", "an")', expect: "'_anana'", hidden: true }
        requires: ['for']
        scope: masked
        hints:
          - Start with an empty string, and go through the word one letter at a time.
          - '`if c in guessed:` add the letter, `else:` add `"_"`. Return the string after the loop.'
      - title: Count the wrong guesses
        goal: >-
          You never lose a life. Change `misses(word, guessed)` so it counts the guessed letters that aren't in the
          word. The game takes that many hearts away.
        examples:
          - { call: 'misses("goat", "tax")', gives: '1' }
          - { call: 'misses("goat", "")', gives: '0' }
          - { call: 'misses("hill", "xyzh")', gives: '3' }
        tests:
          - { call: 'misses("goat", "tax")', expect: '1' }
          - { call: 'misses("goat", "")', expect: '0' }
          - { call: 'misses("hill", "xyzh")', expect: '3', hidden: true }
        scope: misses
        hints:
          - This time, loop over `guessed`, not the word.
          - Keep a count that starts at 0, and add 1 for each letter that's `not in word`.
      - title: End the game
        goal: >-
          The game never stops. Change `status(word, guessed)` so it gives back `"won"` once no letter is still
          hidden, `"lost"` once the misses reach `lives`, and `"playing"` otherwise. Use your other two functions.
        examples:
          - { call: 'status("goat", "goat")', gives: "'won'" }
          - { call: 'status("goat", "ga")', gives: "'playing'" }
          - { call: 'status("goat", "xyzqwe")', gives: "'lost'" }
        tests:
          - { call: 'status("goat", "goat")', expect: "'won'" }
          - { call: 'status("goat", "ga")', expect: "'playing'" }
          - { call: 'status("goat", "xyzqwe")', expect: "'lost'" }
          - { call: 'status("goat", "xyzq")', expect: "'playing'", hidden: true }
        vary:
          - { lives: '3' }
        requires: ['name:masked', 'name:misses']
        scope: status
        hints:
          - '`"_" in masked(word, guessed)` tells you if any letter is still hidden.'
          - Compare `misses(word, guessed)` with `lives`, not with 6, so the game still works if someone changes `lives`.
      - title: A bot that plays
        goal: >-
          Now teach the computer to play. Write a new function, `next_guess(guessed)`, under `status`. It gives back
          the first letter in `common` that isn't in `guessed` yet. `common` lists the letters from most to least used
          in English, so the bot guesses like a sensible person. Then press "Let your bot play" in the Play tab: it
          asks `next_guess` for a letter, presses it, and repeats until the game ends.
        examples:
          - { call: 'next_guess("")', gives: "'e'" }
          - { call: 'next_guess("et")', gives: "'a'" }
        tests:
          - { call: 'next_guess("")', expect: "'e'" }
          - { call: 'next_guess("et")', expect: "'a'" }
          - { call: 'next_guess("etaoinshrdlucmfwypvbgkjqx")', expect: "'z'", hidden: true }
        vary:
          - { common: '"zyx"' }
        requires: ['return']
        scope: next_guess
        hints:
          - Loop over `common`. The first letter that's `not in guessed` is the answer.
          - '`return` it straight away, from inside the loop. That ends the function.'
    extras:
      - Watch your bot play ten words. How many does it win? Try changing `lives` or the order of `common` and see if it does better.
      - Make `next_guess` save the vowels for later, or try them first.
      - Print a running commentary from inside `status`. It shows up under the game.
