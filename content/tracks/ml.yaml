id: ml
name: Machine learning
summary: One path from Python to a tiny GPT.
units:
  - unit: 1
    title: Programs and values
    summary: What code is, how to read errors, and working with numbers, text and decisions.
  - unit: 2
    title: Functions and repetition
    summary: Write your own functions, repeat work with loops, and read tracebacks.
  - unit: 3
    title: Collections and libraries
    summary: Lists, dictionaries and libraries, and the patterns for using them on real data.
  - unit: 4
    title: Python for ML code
    summary: Tuples, comprehensions and classes, the parts of Python that micrograd and PyTorch rely on.
  - unit: 5
    title: NumPy, shapes and plots
    summary: Arrays, vectorising, broadcasting and matrix maths, the way ML code handles numbers.
  - unit: 6
    title: Calculus and gradient descent
    summary: Slopes, the chain rule and gradients, worked out in code, and how a model uses them to learn.
  - unit: 7
    title: First models, judged honestly
    summary: Logistic regression from scratch, then splits, baselines, precision, recall and leakage, so a good score means a good model.
